version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # syn is a dev-only parser used by a retained M5 campaign. Cargo.lock is
      # deliberately bound into retained-evidence provenance, so routine syn
      # churn invalidates official evidence and requires campaign promotion.
      # Keep major migrations visible and keep security updates eligible.
      - dependency-name: "syn"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - "area:ci"
