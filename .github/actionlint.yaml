# Compatibility adapter for GitHub.com's self-repository $/ reusable-workflow syntax.
# actionlint 1.7.12 does not yet implement this syntax (rhysd/actionlint#711/#760).
# Remove this exact diagnostic filter when the managed actionlint release supports it.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - '^reusable workflow call "\$/\.github/workflows/[^"/]+\.ya?ml" at "uses" is not following the format '
# GitHub-hosted Ubuntu 26.04 Arm64 is GA, but actionlint 1.7.12 predates this Arm64 label.
# Remove this compatibility entry when the managed actionlint release recognizes it natively.
self-hosted-runner:
  labels:
    - ubuntu-26.04-arm
