name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify manual recovery targets a published release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          view="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft)"
          test "$(jq -r '.tagName' <<<"${view}")" = "${RELEASE_TAG}"
          test "$(jq -r '.isDraft' <<<"${view}")" = "false"

      - name: Verify release tag and select publication mode
        id: release
        run: |
          set -euo pipefail
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "oxide-batch") | .version')"
          test "v${package_version}" = "${RELEASE_TAG}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          if test "${package_version}" = "0.5.0"; then
            # crates.io Trusted Publishing cannot create a crate. v0.5.0 is
            # the one-time workspace bootstrap that first publishes core,
            # repository, plan, and cli alongside the already-owned facade.
            echo "bootstrap=true" >> "${GITHUB_OUTPUT}"
          else
            echo "bootstrap=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify packages
        if: github.event_name == 'release' && steps.release.outputs.bootstrap != 'true'
        run: >-
          cargo publish --package oxide-batch-core
          --package oxide-batch-repository --package oxide-batch-plan
          --package oxide-batch --package oxide-batch-cli
          --package oxide-batch-test
          --locked --dry-run

      - name: Verify manually bootstrapped crates.io archives
        if: steps.release.outputs.bootstrap == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # Derived from the checked-out tag's own manifests rather than a
          # hardcoded list, so recovery verification of an older tag (e.g.
          # v0.5.0, which predates oxide-batch-test) names exactly the
          # crates that tag actually released, not the current accepted set.
          RELEASED_CRATES="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select((.publish // []) | length > 0) | .name' \
            | tr '\n' ' ')"

          published=""
          for crate in ${RELEASED_CRATES}; do
            published="${published} --package ${crate}"
          done
          # Recreate the exact archives from the immutable release tag. The
          # bootstrap is accepted only if crates.io records the same SHA-256
          # checksum for every package in the release set.
          # shellcheck disable=SC2086
          cargo package ${published} --locked

          for crate in ${RELEASED_CRATES}; do
            local_archive="target/package/${crate}-${PACKAGE_VERSION}.crate"
            test -s "${local_archive}"
            local_sha="$(sha256sum "${local_archive}" | awk '{print $1}')"
            registry_sha="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
              --user-agent "oxide-batch-release-verifier/${PACKAGE_VERSION}" \
              "https://crates.io/api/v1/crates/${crate}/${PACKAGE_VERSION}" \
              | jq -er '.version.checksum')"
            echo "${crate} ${PACKAGE_VERSION}: local=${local_sha} crates.io=${registry_sha}"
            test "${local_sha}" = "${registry_sha}"
          done

      # OIDC Trusted Publishing can publish a new version of an existing
      # crate, but it cannot create a crate name (see
      # docs/release/m5-0.5.0-bootstrap.md). A crate the accepted release set
      # names but crates.io has never seen needs its own separately reviewed
      # first-publication bootstrap first (see
      # docs/release/m6-oxide-batch-test-bootstrap.md for oxide-batch-test
      # specifically) -- this step fails loudly and by name instead of
      # letting "Publish to crates.io" discover the same gap as an opaque
      # OIDC/crates.io error.
      - name: Verify every released crate already exists on crates.io
        if: github.event_name == 'release' && steps.release.outputs.bootstrap != 'true'
        run: |
          set -euo pipefail
          missing=""
          for crate in oxide-batch-core oxide-batch-repository oxide-batch-plan \
            oxide-batch oxide-batch-cli oxide-batch-test; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent "oxide-batch-release-verifier" \
              "https://crates.io/api/v1/crates/${crate}")"
            if test "${status}" != "200"; then
              missing="${missing} ${crate}"
            fi
          done
          if test -n "${missing}"; then
            echo "::error::the following crates have never been published and need a" \
              "separately reviewed first-publication bootstrap before this release can" \
              "use OIDC Trusted Publishing for them (see docs/release/):${missing}"
            exit 1
          fi

      - name: Authenticate to crates.io
        if: github.event_name == 'release' && steps.release.outputs.bootstrap != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # RFC-0011 and ADR-0010 publish the internal crates the facade
      # requires, plus the operator CLI, in dependency order and at the
      # facade version: core, repository, plan, oxide-batch, oxide-batch-cli.
      # #145 added oxide-batch-test as a sixth crate at the same version and
      # cadence, per the M6 Gate G decision; the pre-flight existence check
      # above guarantees it (and every other crate here) is already
      # registered on crates.io by the time this step runs, so OIDC Trusted
      # Publishing only ever publishes a new version of an existing crate,
      # never attempts to create one. Cargo resolves this order from the
      # dependency graph of the selected packages regardless of --package
      # argument order. v0.5.0 is the sole first-publication bootstrap
      # exception (docs/release/m5-0.5.0-bootstrap.md); later releases use
      # OIDC Trusted Publishing exclusively. Gated to the release.published
      # event only: workflow_dispatch manual recovery never authenticates to
      # or publishes on crates.io, verification only.
      - name: Publish to crates.io
        if: github.event_name == 'release' && steps.release.outputs.bootstrap != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: >-
          cargo publish --package oxide-batch-core
          --package oxide-batch-repository --package oxide-batch-plan
          --package oxide-batch --package oxide-batch-cli
          --package oxide-batch-test --locked
