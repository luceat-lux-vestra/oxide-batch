name: Research remaining ARM64 Rust CI - audit only
# Separate unprivileged research ref, never PR proof / trusted merge authority.
# Jobs checkout identical pinned protected main source. Compare PG16/18 design.
on:
  push:
    branches:
      - research/433-remaining-arm-audit-20261012
    paths:
      - .github/workflows/research-433-remaining-arm-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  audit-quality-integration-0:
    name: quality-integration-0-internal
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repo || github.repository }}
          ref: b287975787b87702d8cd895b4200bcdacbb09718
          persist-credentials: false

      - name: Research exact-source ARM and cache identity audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b287975787b87702d8cd895b4200bcdacbb09718"
          test "$(uname -m)" = aarch64
          test "${RUNNER_ARCH}" = ARM64
          echo "RESEARCH_ARCH=arm64"
          lscpu | grep -E '^(Model name|CPU\(s\)|Architecture)' || true
          rustc -vV
          sha256sum Cargo.lock rust-toolchain.toml


      - name: Resolve protected-main compiler cache identity
        id: integration-cache-id
        env:
          BASE_SHA: b287975787b87702d8cd895b4200bcdacbb09718
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          toolchain_hash="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
          lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          [[ "$toolchain_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]

          family="oxide-fast-sccache-v1-linux-arm64-${toolchain_hash}"
          lock_prefix="${family}-${lock_hash}-"
          key="${lock_prefix}${BASE_SHA}"

          {
            echo "family=${family}"
            echo "lock_prefix=${lock_prefix}"
            echo "key=${key}"
          } >> "$GITHUB_OUTPUT"

      - name: Install verified sccache 0.18.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sccache-v0.18.0-aarch64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v0.18.0"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-aarch64-unknown-linux-musl.tar.gz" \
            --output "$archive"

          echo "2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a  $archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Restore protected-main compiler cache read-only
        id: integration-restore-sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.integration-cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.integration-cache-id.outputs.lock_prefix }}
            ${{ steps.integration-cache-id.outputs.family }}-

      - name: Enable restore-only sccache
        id: integration-enable-sccache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_TERM_COLOR=never"
            echo "SCCACHE_DIR=$RUNNER_TEMP/oxide-fast-sccache"
            echo "SCCACHE_CACHE_SIZE=768M"
            echo "SCCACHE_LOCAL_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"

          echo "protected-main cache hit: ${{ steps.integration-restore-sccache.outputs.cache-hit }}"

      - name: Validate native sccache executable and cache separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sccache --version
          test "${SCCACHE_DIR:-}" = "$RUNNER_TEMP/oxide-fast-sccache"
          test "${CARGO_INCREMENTAL:-}" = 0

      - name: Zero compiler cache stats
        run: sccache --zero-stats

      - name: Run final-only integration shard 0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/run-integration-shard.py 0 4

      - name: Show integration compiler cache stats
        if: ${{ always() && steps.integration-enable-sccache.outcome == 'success' }}
        continue-on-error: true
        run: sccache --show-stats --stats-format=json

