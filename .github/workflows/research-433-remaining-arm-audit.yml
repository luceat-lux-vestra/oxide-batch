  audit-quality-contracts:
    name: quality-contracts-internal
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repo || github.repository }}
          ref: b287975787b87702d8cd895b4200bcdacbb09718
          persist-credentials: false

      - name: Research exact-source ARM and cache identity audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b287975787b87702d8cd895b4200bcdacbb09718"
          test "$(uname -m)" = aarch64
          test "${RUNNER_ARCH}" = ARM64
          echo "RESEARCH_ARCH=arm64"
          lscpu | grep -E '^(Model name|CPU\(s\)|Architecture)' || true
          rustc -vV
          sha256sum Cargo.lock rust-toolchain.toml


      - name: Check out exact trusted base for merge-gate verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b287975787b87702d8cd895b4200bcdacbb09718
          path: .merge-gate-trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Verify merge topology with trusted-base verifier
        env:
          RULESET_PATH: ${{ runner.temp }}/protect-main-ruleset.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/rulesets/19905142" \
            -o "$RULESET_PATH"
          ruby .merge-gate-trusted-base/.github/scripts/verify-merge-gates.rb \
            .github/merge-gate-policy.json "$RULESET_PATH"

      - name: Check facade without optional adapters
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo check -p oxide-batch --no-default-features

      - name: Check operator CLI without optional adapters
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo check -p oxide-batch-cli --no-default-features --all-targets

      - name: Check extraction boundaries and workspace cycles
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- deps

      - name: Inspect the facade surface for disclosed dependencies
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- surface

      - name: Verify the canonical publishable-crate release set
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- release-crates

