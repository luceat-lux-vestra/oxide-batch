name: Finalize PR 165 evidence retention

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  retain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/147-restartable-flat-file-components
          fetch-depth: 0

      - name: Verify, retain, and commit M5 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, urllib.request, zipfile

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch_head = "7126ce4d6242f9ffa3e3bd96786dd17fff9fad3f"
          execution_commit = "9556f3b8e5ed96e528b4aecfab8cb8992106f40a"
          root = pathlib.Path.cwd()
          out = root / "docs/engineering/campaigns/m5"
          tmp = root / "target/pr165-retention"
          tmp.mkdir(parents=True, exist_ok=True)

          campaigns = [
              ("soak", "M5 PostgreSQL soak", "M5 Soak", ".github/workflows/m5-soak.yml", 32581401378),
              ("cancellation", "M5 PostgreSQL cancellation", "M5 Cancellation", ".github/workflows/m5-cancellation.yml", 32581401355),
              ("performance", "M5 PostgreSQL performance", "M5 Performance", ".github/workflows/m5-performance.yml", 32581401352),
              ("conformance", "M5 PostgreSQL conformance", "M5 Conformance", ".github/workflows/m5-conformance.yml", 32581401303),
              ("crash-restore", "M5 crash and restore", "M5 Crash and Restore", ".github/workflows/m5-crash-restore.yml", 32581401380),
              ("upgrade", "M5 PostgreSQL upgrade", "M5 Upgrade", ".github/workflows/m5-upgrade.yml", 32581401308),
              ("security", "M5 PostgreSQL security", "M5 Security", ".github/workflows/m5-security.yml", 32581401375),
              ("resource-bounds", "M5 PostgreSQL resource bounds", "M5 Resource Bounds", ".github/workflows/m5-resource-bounds.yml", 32581401356),
          ]

          def request_json(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def find(value, key):
              if isinstance(value, dict):
                  if key in value:
                      return value[key]
                  for child in value.values():
                      found = find(child, key)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child, key)
                      if found is not None:
                          return found
              return None

          provenance_path = out / "evidence-provenance.json"
          provenance = json.loads(provenance_path.read_text())
          entries = {entry["report"]: entry for entry in provenance["evidence"]}
          verified_at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          for short, campaign, workflow, workflow_file, run_id in campaigns:
              run = request_json(f"/actions/runs/{run_id}")
              assert run["event"] == "pull_request"
              assert run["conclusion"] == "success"
              assert run["run_attempt"] == 1
              assert run["head_sha"] == branch_head

              jobs = request_json(f"/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
              artifacts = request_json(f"/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
              expected_artifacts = {f"{short}-campaign-postgres-15", f"{short}-campaign-postgres-18"}
              assert {artifact["name"] for artifact in artifacts} == expected_artifacts

              for major in ("15", "18"):
                  artifact_name = f"{short}-campaign-postgres-{major}"
                  report_name = f"{short}-campaign-postgres-{major}.json"
                  inner_name = f"{short}-campaign.json"
                  job_name = f"postgres-{major}-{short}-campaign"
                  artifact = next(item for item in artifacts if item["name"] == artifact_name)
                  job = next(item for item in jobs if item["name"] == job_name)
                  assert job["conclusion"] == "success"
                  assert artifact["workflow_run"]["id"] == run_id
                  assert artifact["workflow_run"]["head_sha"] == branch_head
                  digest = artifact["digest"]
                  assert digest.startswith("sha256:") and len(digest) == 71

                  archive = tmp / f"{artifact_name}.zip"
                  subprocess.run([
                      "curl", "-fsSL", "--retry", "3",
                      "-H", f"Authorization: Bearer {token}",
                      "-H", "Accept: application/vnd.github+json",
                      "-H", "X-GitHub-Api-Version: 2022-11-28",
                      f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip",
                      "-o", str(archive),
                  ], check=True)
                  assert "sha256:" + hashlib.sha256(archive.read_bytes()).hexdigest() == digest
                  assert archive.stat().st_size == artifact["size_in_bytes"]

                  with zipfile.ZipFile(archive) as zipped:
                      assert zipped.namelist() == [inner_name]
                      report_bytes = zipped.read(inner_name)
                  report = json.loads(report_bytes)
                  environment = report["environment"]
                  assert report["passed"] is True and report["violations"] == []
                  assert report["postgresql_major_version"] == major
                  assert environment["matrix"] == f"postgres-{major}"
                  assert environment["source_commit"] == execution_commit
                  assert environment["source_tree_clean"] is True

                  target = out / report_name
                  target.write_bytes(report_bytes)
                  retained_blob = subprocess.check_output(["git", "hash-object", str(target)], text=True).strip()
                  entry = entries[report_name]
                  assert entry["campaign"] == campaign
                  entry["matrix_point"] = f"postgres-{major}"
                  entry["postgres_major_version"] = major
                  server_version = find(report, "server_version")
                  if server_version is None:
                      entry.pop("server_version", None)
                  else:
                      entry["server_version"] = server_version
                  entry["producer"] = {
                      "execution_commit": execution_commit,
                      "execution_commit_note": "The tree the campaign actually executed against, as the run recorded it from inside its own checkout. This is the provenance root: the object identities the report carries are this tree's.",
                      "branch_head_sha": branch_head,
                      "branch_head_note": "The pull-request branch head the run was triggered from. Recorded as metadata and never used as a stand-in for the execution tree, which is a different commit.",
                      "source_tree_clean": True,
                      "rustc": environment["rustc"], "os": environment["os"], "arch": environment["arch"],
                  }
                  entry["workflow_run"] = {"workflow": workflow, "workflow_file": workflow_file, "id": run_id, "attempt": 1, "event": "pull_request", "conclusion": "success"}
                  entry["producing_job"] = {"name": job_name, "id": job["id"], "conclusion": "success"}
                  entry["artifact"] = {"name": artifact_name, "id": artifact["id"], "digest": digest, "size_bytes": artifact["size_in_bytes"]}
                  entry["retained_report_git_blob"] = retained_blob
                  entry["remote_verification"] = {
                      "verified": True, "verified_at": verified_at, "run_id": run_id,
                      "workflow_run_identity": True, "workflow_run_conclusion": True,
                      "producing_job_identity": True, "producing_job_conclusion": True,
                      "artifact_digest": True, "artifact_bytes_match_retained_report": True,
                      "execution_commit_matches_report": True,
                      "note": "Fresh retention for PR #165 after the final #147 corrective tree and performance health-check isolation fix; run, job, artifact digest/bytes, and execution tree were checked before retention.",
                  }

          provenance_path.write_text(json.dumps(provenance, indent=2) + "\n")

          evidence_path = root / "docs/project/m6-147-flat-file-evidence.md"
          evidence = evidence_path.read_text()
          evidence = evidence.replace(
              "`DelimitedReader` grows its record buffers one `csv_core` parser callback at a time and never past the configured bound; the instant growing further would exceed it, it stops copying that record's bytes into memory at all, draining the rest through small fixed discard buffers.",
              "`DelimitedReader` caps decoded record content directly by the configured raw-byte bound, while per-field end-offset storage is bounded by the number of field boundaries possible within that same span; record-dependent parser storage is therefore O(`max_record_bytes`), not literally limited to that many bytes. Once the raw span exceeds the bound, retained record-dependent buffers stop growing and the remainder is drained through small fixed discard buffers.",
          )
          assert "**Known gap — `cargo xtask evidence`:**" in evidence
          start = evidence.index("**Known gap — `cargo xtask evidence`:**")
          end = evidence.index("\n\n## Non-goals", start)
          replacement = "**M5 evidence retention:** all eight M5 campaigns were run for PostgreSQL 15 and 18 against the final semantic tree and all sixteen successful artifacts were re-retained byte-for-byte with run/job/artifact/digest and execution-tree provenance. The P-003 rerun also exposed a campaign-isolation defect: the service health check was connecting to the measured database. The workflow now probes the default `postgres` database instead; with the observer/assertion unchanged, PostgreSQL 15 records configured peak 2 / observed peak 2 and passes."
          evidence_path.write_text(evidence[:start] + replacement + evidence[end:])
          PY

          rm -f .github/workflows/retain-pr165-evidence.yml .github/workflows/retain-pr165-finalize.yml .github/retain-pr165-trigger
          cargo run --package oxide-batch-xtask -- evidence
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/engineering/campaigns/m5 docs/project/m6-147-flat-file-evidence.md .github
          git diff --cached --quiet && exit 1
          git commit -m "ci(m5): retain evidence for #147"
          git push origin HEAD:feat/147-restartable-flat-file-components
