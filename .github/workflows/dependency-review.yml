name: Dependency review

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0, Zlib
          # The crate ships canonical MIT and Apache-2.0 license files but its
          # manifest uses the legacy non-SPDX spelling `MIT/Apache-2.0`.
          # cargo-deny remains the authoritative full-graph license check.
          allow-dependencies-licenses: pkg:cargo/unicode-properties@0.1.4

  actions-security:
    name: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test deterministic Actions security policy
        id: policy-tests
        continue-on-error: true
        run: python3 .github/scripts/test_validate_actions_security.py

      - name: Install verified actionlint
        id: install-actionlint
        continue-on-error: true
        env:
          ACTIONLINT_VERSION: "1.7.12"
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actionlint"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "${tool_dir}"
          gh release download "v${ACTIONLINT_VERSION}" \
            --repo rhysd/actionlint \
            --pattern "${archive}" \
            --dir "${tool_dir}"
          gh attestation verify "${tool_dir}/${archive}" --repo rhysd/actionlint
          tar -xzf "${tool_dir}/${archive}" -C "${tool_dir}" actionlint
          "${tool_dir}/actionlint" -version
          printf 'ACTIONLINT=%s\n' "${tool_dir}/actionlint" >> "${GITHUB_ENV}"

      - name: Run actionlint
        id: actionlint
        if: always() && steps.install-actionlint.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          "${ACTIONLINT}" -color

      - name: Run zizmor
        id: zizmor
        if: always()
        continue-on-error: true
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          inputs: ./.github/workflows
          min-severity: low
          online-audits: false
          persona: auditor

      - name: Validate deterministic Actions security policy
        id: policy
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/validate_actions_security.py

      - name: Enforce complete static-audit result
        if: always()
        env:
          ACTIONLINT_INSTALL_OUTCOME: ${{ steps.install-actionlint.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          POLICY_TESTS_OUTCOME: ${{ steps.policy-tests.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "policy-tests:${POLICY_TESTS_OUTCOME}" \
            "actionlint-install:${ACTIONLINT_INSTALL_OUTCOME}" \
            "actionlint:${ACTIONLINT_OUTCOME}" \
            "zizmor:${ZIZMOR_OUTCOME}" \
            "deterministic-policy:${POLICY_OUTCOME}"
          do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "::error::${name} did not succeed (outcome=${outcome})" >&2
              failed=1
            fi
          done
          exit "${failed}"
