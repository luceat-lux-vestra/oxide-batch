name: Dependency review
run-name: pr-authority/dependency/pr-${{ inputs.pr_number }}/${{ inputs.head_sha }}/caller-${{ inputs.caller_run_id }}-${{ inputs.caller_run_attempt }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/ci-topology-v7-migration
  workflow_call:
  workflow_dispatch:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      caller_run_id:
        required: true
        type: string
      caller_run_attempt:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event_name }}-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.caller_run_id || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0, Zlib
          # The crate ships canonical MIT and Apache-2.0 license files but its
          # manifest uses the legacy non-SPDX spelling `MIT/Apache-2.0`.
          # cargo-deny remains the authoritative full-graph license check.
          allow-dependencies-licenses: pkg:cargo/unicode-properties@0.1.4

  actions-security:
    name: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "Actions security analysis is deferred until the pull request is ready for review"

      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repo || github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Test deterministic Actions security policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: policy-tests
        continue-on-error: true
        run: python3 .github/scripts/test_validate_actions_security.py

      - name: Test Rust CodeQL impact classifier
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: codeql-rust-impact-tests
        continue-on-error: true
        run: python3 .github/scripts/codeql-rust-impact.py --self-test

      - name: Test hardening drift audit orchestration and issue lifecycle
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: hardening-policy-tests
        continue-on-error: true
        run: python3 .github/scripts/test-hardening-drift-audit.py

      - name: Validate repository settings policy JSON
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: repository-settings-policy
        continue-on-error: true
        run: python3 -m json.tool .github/repository-settings-policy.json >/dev/null

      - name: Install pinned static-analysis binaries
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: install-scanners
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actions-security-tools"
          mkdir -p "${tool_dir}"

          # actionlint v1.7.12 Linux amd64 release artifact, verified before use.
          actionlint_archive="actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${actionlint_archive}" \
            --output "${tool_dir}/${actionlint_archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${tool_dir}/${actionlint_archive}" \
            | sha256sum --check --strict
          tar -xzf "${tool_dir}/${actionlint_archive}" -C "${tool_dir}" actionlint
          "${tool_dir}/actionlint" -version

          # zizmor v1.29.0 Linux amd64 release artifact, verified before use.
          zizmor_archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/${zizmor_archive}" \
            --output "${tool_dir}/${zizmor_archive}"
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  ${tool_dir}/${zizmor_archive}" \
            | sha256sum --check --strict
          tar -xzf "${tool_dir}/${zizmor_archive}" -C "${tool_dir}" zizmor
          "${tool_dir}/zizmor" --version

          printf 'ACTIONLINT=%s\n' "${tool_dir}/actionlint" >> "${GITHUB_ENV}"
          printf 'ZIZMOR=%s\n' "${tool_dir}/zizmor" >> "${GITHUB_ENV}"

      - name: Run actionlint
        id: actionlint
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() && steps.install-scanners.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          "${ACTIONLINT}" -color

      - name: Run zizmor full audit
        id: zizmor
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() && steps.install-scanners.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          # Low is deliberately binding: any scanner finding not explicitly
          # and narrowly suppressed must fail this stable PR context.
          # The checked-in config is the suppression inventory; repository-
          # specific policy independently proves its static trust boundaries.
          "${ZIZMOR}" --config .github/zizmor.yml --persona auditor --min-severity low .github/workflows

      - name: Validate deterministic Actions security policy
        id: policy
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        continue-on-error: true
        run: python3 .github/scripts/validate_actions_security.py

      - name: Enforce complete static-audit result
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          INSTALL_SCANNERS_OUTCOME: ${{ steps.install-scanners.outcome }}
          POLICY_TESTS_OUTCOME: ${{ steps.policy-tests.outcome }}
          HARDENING_POLICY_TESTS_OUTCOME: ${{ steps.hardening-policy-tests.outcome }}
          CODEQL_RUST_IMPACT_TESTS_OUTCOME: ${{ steps.codeql-rust-impact-tests.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          REPOSITORY_SETTINGS_POLICY_OUTCOME: ${{ steps.repository-settings-policy.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "policy-tests:${POLICY_TESTS_OUTCOME}" \
            "hardening-policy-tests:${HARDENING_POLICY_TESTS_OUTCOME}" \
            "codeql-rust-impact-tests:${CODEQL_RUST_IMPACT_TESTS_OUTCOME}" \
            "repository-settings-policy:${REPOSITORY_SETTINGS_POLICY_OUTCOME}" \
            "scanner-install:${INSTALL_SCANNERS_OUTCOME}" \
            "actionlint:${ACTIONLINT_OUTCOME}" \
            "zizmor:${ZIZMOR_OUTCOME}" \
            "deterministic-policy:${POLICY_OUTCOME}"
          do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "::error::${name} did not succeed (outcome=${outcome})" >&2
              failed=1
            fi
          done
          exit "${failed}"
