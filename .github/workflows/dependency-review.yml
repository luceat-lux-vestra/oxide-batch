name: Dependency review
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0, Zlib
          # The crate ships canonical MIT and Apache-2.0 license files but its
          # manifest uses the legacy non-SPDX spelling `MIT/Apache-2.0`.
          # cargo-deny remains the authoritative full-graph license check.
          # The MongoDB graph's two unusual licenses are separately reviewed in
          # .github/supply-chain-exceptions.json with an expiry of 2027-02-12.
          allow-dependencies-licenses: pkg:cargo/tiny-keccak@2.0.2, pkg:cargo/unicode-properties@0.1.4, pkg:cargo/webpki-roots@1.0.12

  actions-security:
    name: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "Actions security analysis is deferred until the pull request is ready for review"

      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test deterministic Actions security policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: policy-tests
        continue-on-error: true
        run: python3 .github/scripts/test_validate_actions_security.py

      - name: Test Rust CodeQL impact classifier
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: codeql-rust-impact-tests
        continue-on-error: true
        run: python3 .github/scripts/codeql-rust-impact.py --self-test

      - name: Test hardening drift audit orchestration and issue lifecycle
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: hardening-policy-tests
        continue-on-error: true
        run: python3 .github/scripts/test-hardening-drift-audit.py

      - name: Validate repository settings policy JSON
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: repository-settings-policy
        continue-on-error: true
        run: python3 -m json.tool .github/repository-settings-policy.json >/dev/null

      - name: Setup current Go stable for managed actionlint
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: setup-go
        continue-on-error: true
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Build managed actionlint
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() && steps.setup-go.outcome == 'success' }}
        id: actionlint-build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actions-security-tools"
          mkdir -p "${tool_dir}"
          (
            cd .github/tools/actionlint
            go build -mod=mod -o "${tool_dir}/actionlint" github.com/rhysd/actionlint/cmd/actionlint
          )
          "${tool_dir}/actionlint" -version
          printf 'ACTIONLINT=%s\n' "${tool_dir}/actionlint" >> "${GITHUB_ENV}"

      - name: Install managed zizmor
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: zizmor-install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actions-security-tools"
          venv="${tool_dir}/zizmor-venv"
          mkdir -p "${tool_dir}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            --require-hashes \
            -r .github/tools/zizmor/requirements.txt
          "${venv}/bin/zizmor" --version
          printf 'ZIZMOR=%s\n' "${venv}/bin/zizmor" >> "${GITHUB_ENV}"

      - name: Prepare scanner negative-control workflow
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: scanner-negative-fixture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/actions-security-negative/.github/workflows"
          mkdir -p "${fixture_dir}"
          fixture="${fixture_dir}/unsafe.yml"
          unsafe_key="u""ses:"
          unsafe_action="actions/checkout@v4"
          {
            printf '%s\n' 'name: Deliberately Unsafe'
            printf '%s\n' 'on: push'
            printf '%s\n' 'permissions: write-all'
            printf '%s\n' 'jobs:'
            printf '%s\n' '  unsafe:'
            printf '%s\n' '    runs-on: ubuntu-nonexistent-runner'
            printf '%s\n' '    steps:'
            printf '%s\n' "      - ${unsafe_key} ${unsafe_action}"
          } > "${fixture}"
          printf 'SCANNER_NEGATIVE_FIXTURE=%s\n' "${fixture}" >> "${GITHUB_ENV}"

      - name: Prove actionlint negative control
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() && steps.scanner-negative-fixture.outcome == 'success' }}
        id: actionlint-negative
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          output="$("${ACTIONLINT}" -no-color "${SCANNER_NEGATIVE_FIXTURE}" 2>&1)" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "::error::actionlint accepted the deliberately invalid workflow."
            exit 1
          fi
          if ! printf '%s' "${output}" | grep -q 'runner-label'; then
            echo "::error::actionlint failed without the expected runner-label finding."
            printf '%s\n' "${output}"
            exit 1
          fi

      - name: Prove zizmor negative control
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() && steps.zizmor-install.outcome == 'success' && steps.scanner-negative-fixture.outcome == 'success' }}
        id: zizmor-negative
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          output="$("${ZIZMOR}" \
            --config .github/zizmor.yml \
            --persona auditor \
            --min-severity low \
            --no-online-audits \
            "${SCANNER_NEGATIVE_FIXTURE}" 2>&1)" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "::error::zizmor accepted the deliberately unsafe workflow."
            exit 1
          fi
          if ! printf '%s' "${output}" | grep -q 'unpinned-uses'; then
            echo "::error::zizmor failed without the expected unpinned-uses finding."
            printf '%s\n' "${output}"
            exit 1
          fi

      - name: Run actionlint
        id: actionlint
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() && steps.actionlint-build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          # GitHub supports the documented cache-mode key, but managed actionlint
          # v1.7.12 predates that schema addition. Ignore only that exact
          # compatibility false positive; all other actionlint findings remain binding.
          "${ACTIONLINT}" -color \
            -config-file .github/actionlint.yaml \
            -ignore 'unexpected key "cache-mode" for "job" section'

      - name: Run zizmor full audit
        id: zizmor
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() && steps.zizmor-install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          # Low is deliberately binding: any scanner finding not explicitly
          # and narrowly suppressed must fail this stable PR context.
          # The checked-in config is the suppression inventory; repository-
          # specific policy independently proves its static trust boundaries.
          "${ZIZMOR}" \
            --config .github/zizmor.yml \
            --persona auditor \
            --min-severity low \
            --no-online-audits \
            .github/workflows

      - name: Validate deterministic Actions security policy
        id: policy
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        continue-on-error: true
        run: python3 .github/scripts/validate_actions_security.py

      - name: Enforce complete static-audit result
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          ACTIONLINT_BUILD_OUTCOME: ${{ steps.actionlint-build.outcome }}
          ACTIONLINT_NEGATIVE_OUTCOME: ${{ steps.actionlint-negative.outcome }}
          SETUP_GO_OUTCOME: ${{ steps.setup-go.outcome }}
          SCANNER_NEGATIVE_FIXTURE_OUTCOME: ${{ steps.scanner-negative-fixture.outcome }}
          ZIZMOR_INSTALL_OUTCOME: ${{ steps.zizmor-install.outcome }}
          ZIZMOR_NEGATIVE_OUTCOME: ${{ steps.zizmor-negative.outcome }}
          POLICY_TESTS_OUTCOME: ${{ steps.policy-tests.outcome }}
          HARDENING_POLICY_TESTS_OUTCOME: ${{ steps.hardening-policy-tests.outcome }}
          CODEQL_RUST_IMPACT_TESTS_OUTCOME: ${{ steps.codeql-rust-impact-tests.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          REPOSITORY_SETTINGS_POLICY_OUTCOME: ${{ steps.repository-settings-policy.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "policy-tests:${POLICY_TESTS_OUTCOME}" \
            "hardening-policy-tests:${HARDENING_POLICY_TESTS_OUTCOME}" \
            "codeql-rust-impact-tests:${CODEQL_RUST_IMPACT_TESTS_OUTCOME}" \
            "repository-settings-policy:${REPOSITORY_SETTINGS_POLICY_OUTCOME}" \
            "setup-go:${SETUP_GO_OUTCOME}" \
            "actionlint-build:${ACTIONLINT_BUILD_OUTCOME}" \
            "scanner-negative-fixture:${SCANNER_NEGATIVE_FIXTURE_OUTCOME}" \
            "actionlint-negative:${ACTIONLINT_NEGATIVE_OUTCOME}" \
            "zizmor-install:${ZIZMOR_INSTALL_OUTCOME}" \
            "zizmor-negative:${ZIZMOR_NEGATIVE_OUTCOME}" \
            "actionlint:${ACTIONLINT_OUTCOME}" \
            "zizmor:${ZIZMOR_OUTCOME}" \
            "deterministic-policy:${POLICY_OUTCOME}"
          do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "::error::${name} did not succeed (outcome=${outcome})" >&2
              failed=1
            fi
          done
          exit "${failed}"
