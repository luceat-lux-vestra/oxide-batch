name: Dependency review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0, Zlib
          # The crate ships canonical MIT and Apache-2.0 license files but its
          # manifest uses the legacy non-SPDX spelling `MIT/Apache-2.0`.
          # cargo-deny remains the authoritative full-graph license check.
          allow-dependencies-licenses: pkg:cargo/unicode-properties@0.1.4
