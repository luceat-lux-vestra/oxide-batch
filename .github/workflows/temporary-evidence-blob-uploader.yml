name: Temporary retained-evidence blob uploader

on:
  push:
    branches:
      - security/227-actions-static-audit

permissions:
  contents: read

concurrency:
  group: temporary-evidence-blob-uploader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-report-blobs:
    name: upload-report-blobs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Needed only to create dangling Git blobs; this job never updates a ref.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_EXECUTION_COMMIT: b1dd4f41f4eecc258e2da928c7374d67cbebbfc7
    steps:
      - name: Verify artifacts and create dangling report blobs
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          upload_blob() {
            label="$1"
            artifact_id="$2"
            expected_archive_sha="$3"
            expected_member="$4"
            expected_blob_sha="$5"
            work="${RUNNER_TEMP}/${label}"
            mkdir -p "${work}"

            curl --fail --silent --show-error --location \
              --header "${auth_header}" \
              --header "${accept_header}" \
              --header "${version_header}" \
              "${api}/actions/artifacts/${artifact_id}/zip" \
              --output "${work}/artifact.zip"
            printf '%s  %s\n' "${expected_archive_sha}" "${work}/artifact.zip" | sha256sum --check --strict

            python3 - "${work}/artifact.zip" "${work}/report.json" "${expected_member}" "${EXPECTED_EXECUTION_COMMIT}" <<'PY'
          import json
          import sys
          import zipfile

          archive, output, expected_member, expected_commit = sys.argv[1:]
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if names != [expected_member]:
                  raise SystemExit(f"unexpected artifact members: {names!r}, expected {expected_member!r}")
              data = bundle.read(names[0])
          report = json.loads(data)
          if report.get("passed") is not True or report.get("violations") != []:
              raise SystemExit("report is not a clean pass")
          environment = report.get("environment", {})
          manifest = report.get("observation", {}).get("execution_manifest", {})
          if environment.get("source_commit") != expected_commit:
              raise SystemExit("report source commit does not match the reviewed execution commit")
          if manifest.get("execution_commit") != expected_commit:
              raise SystemExit("report execution manifest does not match the reviewed execution commit")
          if environment.get("source_tree_clean") is not True or manifest.get("tree_clean") is not True:
              raise SystemExit("report does not record a clean execution tree")
          with open(output, "wb") as target:
              target.write(data)
          PY

            observed_blob_sha="$(git hash-object "${work}/report.json")"
            if [ "${observed_blob_sha}" != "${expected_blob_sha}" ]; then
              echo "::error::Local git blob identity mismatch for ${label}: ${observed_blob_sha} != ${expected_blob_sha}" >&2
              exit 1
            fi

            python3 - "${work}/report.json" "${work}/payload.json" <<'PY'
          import base64
          import json
          import sys

          source, target = sys.argv[1:]
          with open(source, "rb") as handle:
              encoded = base64.b64encode(handle.read()).decode("ascii")
          with open(target, "w", encoding="utf-8") as handle:
              json.dump({"content": encoded, "encoding": "base64"}, handle)
          PY

            response="$(curl --fail --silent --show-error \
              --request POST \
              --header "${auth_header}" \
              --header "${accept_header}" \
              --header "${version_header}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${work}/payload.json" \
              "${api}/git/blobs")"
            sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"${response}")"
            if [ "${sha}" != "${expected_blob_sha}" ]; then
              echo "::error::GitHub blob SHA mismatch for ${label}: ${sha} != ${expected_blob_sha}" >&2
              exit 1
            fi
            printf '%s_BLOB=%s\n' "${label}" "${sha}"
          }

          upload_blob CANCEL15 9966463968 4211a281aa67d4b5783525f1f90b708a9190eafb7dd27fd8353409086a28ee71 cancellation-campaign.json 535889116ea75176074d96466dd6766805e10c55
          upload_blob CANCEL18 9966462024 08dff1d7708708345e57b996ad8ccf468de518998171ba0d21d4b22db9e73067 cancellation-campaign.json c8d3074b36168fa35ff86605d46ef08289d17b74
