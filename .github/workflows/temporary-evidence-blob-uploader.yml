name: Temporary retained-evidence finalizer

on:
  push:
    branches:
      - security/227-actions-static-audit

jobs:
  finalize-evidence-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify retained artifacts and create final blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_EXECUTION_COMMIT: b1dd4f41f4eecc258e2da928c7374d67cbebbfc7
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          repository = os.environ["GITHUB_REPOSITORY"]
          api_root = os.environ["GITHUB_API_URL"] + "/repos/" + repository
          token = os.environ["GITHUB_TOKEN"]
          expected_execution = os.environ["EXPECTED_EXECUTION_COMMIT"]
          verified_at = "2026-09-05T09:07:25Z"
          specs = json.loads(r'''[["cancellation-campaign-postgres-15.json",33956177874,"cancellation-campaign-postgres-15","postgres-15-cancellation-campaign"],["cancellation-campaign-postgres-18.json",33956177874,"cancellation-campaign-postgres-18","postgres-18-cancellation-campaign"],["crash-restore-campaign-postgres-15.json",33956177939,"crash-restore-campaign-postgres-15","postgres-15-crash-restore-campaign"],["crash-restore-campaign-postgres-18.json",33956177939,"crash-restore-campaign-postgres-18","postgres-18-crash-restore-campaign"],["upgrade-campaign-postgres-15.json",33956177865,"upgrade-campaign-postgres-15","postgres-15-upgrade-campaign"],["upgrade-campaign-postgres-18.json",33956177865,"upgrade-campaign-postgres-18","postgres-18-upgrade-campaign"],["security-campaign-postgres-15.json",33956177778,"security-campaign-postgres-15","postgres-15-security-campaign"],["security-campaign-postgres-18.json",33956177778,"security-campaign-postgres-18","postgres-18-security-campaign"],["resource-bounds-campaign-postgres-15.json",33956177880,"resource-bounds-campaign-postgres-15","postgres-15-resource-bounds-campaign"],["resource-bounds-campaign-postgres-18.json",33956177880,"resource-bounds-campaign-postgres-18","postgres-18-resource-bounds-campaign"],["soak-campaign-postgres-15.json",33956177818,"soak-campaign-postgres-15","postgres-15-soak-campaign"],["soak-campaign-postgres-18.json",33956177818,"soak-campaign-postgres-18","postgres-18-soak-campaign"],["performance-campaign-postgres-15.json",33956177815,"performance-campaign-postgres-15","postgres-15-performance-campaign"],["performance-campaign-postgres-18.json",33956177815,"performance-campaign-postgres-18","postgres-18-performance-campaign"],["conformance-campaign-postgres-15.json",33956177847,"conformance-campaign-postgres-15","postgres-15-conformance-campaign"],["conformance-campaign-postgres-18.json",33956177847,"conformance-campaign-postgres-18","postgres-18-conformance-campaign"],["gate-b-campaign-postgres-15.json",33956177950,"gate-b-campaign-postgres-15","postgres-15-gate-b-campaign"],["gate-b-campaign-postgres-18.json",33956177950,"gate-b-campaign-postgres-18","postgres-18-gate-b-campaign"],["gate-h-campaign.json",33956177801,"gate-h-campaign","gate-h-campaign"],["m6-conformance-campaign-postgres-15.json",33956177894,"m6-conformance-campaign-postgres-15","postgres-15-m6-conformance"],["m6-conformance-campaign-postgres-18.json",33956177894,"m6-conformance-campaign-postgres-18","postgres-18-m6-conformance"]]''')

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def request_bytes(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return response.read()

          def upload_blob(data):
              result = request_json(
                  api_root + "/git/blobs",
                  "POST",
                  {"content": base64.b64encode(data).decode(), "encoding": "base64"},
              )
              sha = result["sha"]
              if len(sha) != 40:
                  raise SystemExit("invalid Git blob SHA returned")
              return sha

          def first_server_version(value):
              if isinstance(value, dict):
                  candidate = value.get("server_version")
                  if isinstance(candidate, str):
                      return candidate
                  for child in value.values():
                      found = first_server_version(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = first_server_version(child)
                      if found:
                          return found
              return None

          provenance_paths = [
              Path("docs/engineering/campaigns/m5/evidence-provenance.json"),
              Path("docs/engineering/campaigns/m6/evidence-provenance.json"),
          ]
          documents = {path: json.loads(path.read_text()) for path in provenance_paths}
          entries = {}
          for path, document in documents.items():
              for entry in document["evidence"]:
                  report = entry["report"]
                  if report in entries:
                      raise SystemExit("duplicate retained report in provenance: " + report)
                  entries[report] = (path, entry)

          expected_reports = {spec[0] for spec in specs}
          if set(entries) != expected_reports:
              raise SystemExit(
                  "retained provenance report set differs from finalizer specification"
              )

          for report_name, run_id, artifact_name, job_name in specs:
              run = request_json(api_root + f"/actions/runs/{run_id}")
              if run["event"] != "pull_request" or run["conclusion"] != "success":
                  raise SystemExit(f"run {run_id} is not a successful pull_request run")
              if run["run_attempt"] != 1:
                  raise SystemExit(f"unexpected run attempt for {run_id}")
              branch_head = run["head_sha"]

              jobs = request_json(api_root + f"/actions/runs/{run_id}/jobs?filter=latest&per_page=100")["jobs"]
              matching_jobs = [job for job in jobs if job["name"] == job_name]
              if len(matching_jobs) != 1 or matching_jobs[0]["conclusion"] != "success":
                  raise SystemExit(f"producing job {job_name} is missing, ambiguous, or not successful")
              job = matching_jobs[0]

              artifacts = request_json(api_root + f"/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
              matching_artifacts = [artifact for artifact in artifacts if artifact["name"] == artifact_name]
              if len(matching_artifacts) != 1:
                  raise SystemExit(f"artifact {artifact_name} is missing or ambiguous")
              artifact = matching_artifacts[0]
              archive = request_bytes(artifact["archive_download_url"])
              observed_digest = "sha256:" + hashlib.sha256(archive).hexdigest()
              if observed_digest != artifact["digest"]:
                  raise SystemExit(f"artifact digest mismatch for {artifact_name}")

              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  names = bundle.namelist()
                  if len(names) != 1:
                      raise SystemExit(f"artifact {artifact_name} contains {names!r}")
                  report_bytes = bundle.read(names[0])
              report = json.loads(report_bytes)
              environment = report.get("environment", {})
              manifest = report.get("observation", {}).get("execution_manifest", {})
              if report.get("passed") is not True or report.get("violations") != []:
                  raise SystemExit(f"report {report_name} is not a clean pass")
              if environment.get("source_commit") != expected_execution:
                  raise SystemExit(f"report {report_name} source commit mismatch")
              if manifest.get("execution_commit") != expected_execution:
                  raise SystemExit(f"report {report_name} execution manifest mismatch")
              if environment.get("source_tree_clean") is not True or manifest.get("tree_clean") is not True:
                  raise SystemExit(f"report {report_name} does not record a clean tree")

              report_blob = upload_blob(report_bytes)
              path, entry = entries[report_name]
              entry["matrix_point"] = environment["matrix"]
              entry["postgres_major_version"] = str(
                  report.get("postgresql_major_version", "not-applicable")
              )
              if "server_version" in entry:
                  entry["server_version"] = first_server_version(report)
              entry["producer"] = {
                  "execution_commit": expected_execution,
                  "execution_commit_note": "Fresh exact PR #254 campaign execution tree recorded from inside its own checkout; the report object manifest binds retained evidence to this reviewed candidate execution tree.",
                  "branch_head_sha": branch_head,
                  "branch_head_note": "The exact PR #254 branch head that triggered the run. It is recorded separately from the ephemeral execution tree and is never used as a stand-in for it.",
                  "source_tree_clean": True,
                  "rustc": environment["rustc"],
                  "os": environment["os"],
                  "arch": environment["arch"],
              }
              entry["workflow_run"] = {
                  "workflow": run["name"],
                  "workflow_file": run["path"],
                  "id": run_id,
                  "attempt": run["run_attempt"],
                  "event": run["event"],
                  "conclusion": run["conclusion"],
              }
              entry["producing_job"] = {
                  "name": job["name"],
                  "id": job["id"],
                  "conclusion": job["conclusion"],
              }
              entry["artifact"] = {
                  "name": artifact["name"],
                  "id": artifact["id"],
                  "digest": artifact["digest"],
                  "size_bytes": artifact["size_in_bytes"],
              }
              entry["retained_report_git_blob"] = report_blob
              entry["remote_verification"] = {
                  "verified": True,
                  "verified_at": verified_at,
                  "run_id": run_id,
                  "workflow_run_identity": True,
                  "workflow_run_conclusion": True,
                  "producing_job_identity": True,
                  "producing_job_conclusion": True,
                  "artifact_digest": True,
                  "artifact_bytes_match_retained_report": True,
                  "execution_commit_matches_report": True,
                  "note": "Exact PR #254 artifact downloaded from the successful workflow run; API archive digest, run/job identity, execution commit, clean passing report, and retained bytes were independently checked before this entry was recorded.",
              }
              print(f"REPORT_BLOB {report_name} {report_blob}")

          for path, document in documents.items():
              data = (json.dumps(document, indent=2) + "\n").encode()
              print(f"PROVENANCE_BLOB {path} {upload_blob(data)}")

          policy_path = Path(".github/merge-gate-policy.json")
          policy = json.loads(policy_path.read_text())
          policy["pending_ruleset_contexts"] = ["actions-security"]
          policy_bytes = (json.dumps(policy, indent=2) + "\n").encode()
          print(f"POLICY_BLOB {upload_blob(policy_bytes)}")
          PY
