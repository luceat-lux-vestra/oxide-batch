name: PostgreSQL Merge Gate

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows:
      - Rust
      - M5 Conformance
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: postgres-merge-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted merge-gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Reconcile canonical PostgreSQL child jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby .github/scripts/reconcile-aggregate-status.rb
