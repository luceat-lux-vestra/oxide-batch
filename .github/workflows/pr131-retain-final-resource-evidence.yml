name: PR131 Retain Final Resource Evidence

on:
  push:
    branches:
      - ci/m5-resource-bounds-provenance
    paths:
      - .github/workflows/pr131-retain-final-resource-evidence.yml

permissions:
  contents: write
  actions: read

jobs:
  retain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/m5-resource-bounds-provenance
          fetch-depth: 0
      - name: Download and verify final resource-bound artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9316533962/zip > /tmp/pg15.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9316535433/zip > /tmp/pg18.zip
          printf '%s  %s\n' '7c75c923129a1454ac753112adc536cab83ef030fb3d5a53227bee2b80623835' /tmp/pg15.zip | sha256sum -c -
          printf '%s  %s\n' '4b664bd447a5db7784cf718c4850f4fb59c55c1ba12618b9603ff5c3ca6ad6f9' /tmp/pg18.zip | sha256sum -c -
          rm -rf /tmp/pg15 /tmp/pg18
          mkdir /tmp/pg15 /tmp/pg18
          unzip -q /tmp/pg15.zip -d /tmp/pg15
          unzip -q /tmp/pg18.zip -d /tmp/pg18
          test "$(git hash-object /tmp/pg15/resource-bounds-campaign.json)" = '54c0973bd1c2101f9a40d4483b03634928c71bc6'
          test "$(git hash-object /tmp/pg18/resource-bounds-campaign.json)" = 'db682daff3f7dc5deb67a3dd0c39d4d24da21781'
          python3 - <<'PY'
          import json
          from pathlib import Path
          specs = [
              ('15', Path('/tmp/pg15/resource-bounds-campaign.json'), 'docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json', 95643695408, 9316533962, 'sha256:7c75c923129a1454ac753112adc536cab83ef030fb3d5a53227bee2b80623835', 13096, '54c0973bd1c2101f9a40d4483b03634928c71bc6'),
              ('18', Path('/tmp/pg18/resource-bounds-campaign.json'), 'docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json', 95643695406, 9316535433, 'sha256:4b664bd447a5db7784cf718c4850f4fb59c55c1ba12618b9603ff5c3ca6ad6f9', 13095, 'db682daff3f7dc5deb67a3dd0c39d4d24da21781'),
          ]
          execution = '2d9ab0ce976535fa3564159f70568c04e346c6a5'
          branch = '90fa7d0004f843fee77067c5af49d88200537332'
          run_id = 32115407707
          for major, src, dst, *_ in specs:
              report = json.loads(src.read_text())
              assert report['passed'] is True
              assert report['violations'] == []
              assert report['declared_resources'] == 36
              assert report['observed_resources'] == 36
              assert str(report['postgresql_major_version']) == major
              assert report['environment']['source_commit'] == execution
              assert report['environment']['source_tree_clean'] is True
              assert report['observation']['execution_manifest']['execution_commit'] == execution
              assert report['observation']['execution_manifest']['tree_clean'] is True
              Path(dst).write_bytes(src.read_bytes())
          p = Path('docs/engineering/campaigns/m5/evidence-provenance.json')
          provenance = json.loads(p.read_text())
          entries = {e['matrix_point']: e for e in provenance['evidence'] if e['campaign'] == 'M5 PostgreSQL resource bounds'}
          assert set(entries) == {'postgres-15', 'postgres-18'}
          for major, src, dst, job_id, artifact_id, digest, size_bytes, blob in specs:
              report = json.loads(src.read_text())
              e = entries[f'postgres-{major}']
              e['server_version'] = report['postgresql_version']
              e['producer']['execution_commit'] = execution
              e['producer']['branch_head_sha'] = branch
              e['producer']['source_tree_clean'] = True
              e['producer']['rustc'] = report['environment']['rustc']
              e['producer']['os'] = report['environment']['os']
              e['producer']['arch'] = report['environment']['arch']
              e['workflow_run'].update({'id': run_id, 'attempt': 1, 'event': 'pull_request', 'conclusion': 'success'})
              e['producing_job'].update({'id': job_id, 'conclusion': 'success'})
              e['artifact'].update({'id': artifact_id, 'digest': digest, 'size_bytes': size_bytes})
              e['retained_report_git_blob'] = blob
              rv = e['remote_verification']
              rv.update({
                  'verified': True,
                  'verified_at': '2026-08-18T08:18:00Z',
                  'run_id': run_id,
                  'workflow_run_identity': True,
                  'workflow_run_conclusion': True,
                  'producing_job_identity': True,
                  'producing_job_conclusion': True,
                  'artifact_digest': True,
                  'artifact_bytes_match_retained_report': True,
                  'execution_commit_matches_report': True,
                  'note': 'Final PR #131 retention after the lint/audit closure was repaired. Run, jobs, artifact IDs, API SHA-256 digests, downloaded ZIP bytes, extracted report bytes and git blobs were independently verified; both reports bind execution tree 2d9ab0ce to producer branch head 90fa7d00 on main 82f995f6.'
              })
          p.write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          test "$(git hash-object docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json)" = '54c0973bd1c2101f9a40d4483b03634928c71bc6'
          test "$(git hash-object docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json)" = 'db682daff3f7dc5deb67a3dd0c39d4d24da21781'
          cargo run --package oxide-batch-xtask -- evidence
          git diff --check
      - name: Commit retained evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json \
                  docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json \
                  docs/engineering/campaigns/m5/evidence-provenance.json
          git diff --cached --check
          git commit -m 'docs(m5): retain final resource-bound evidence'
          git push origin HEAD:ci/m5-resource-bounds-provenance
