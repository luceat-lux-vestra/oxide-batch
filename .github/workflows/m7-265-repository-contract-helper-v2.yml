name: M7 265 repository contract helper v2

on:
  push:
    branches:
      - issue-265-nested-job-durable-linkage

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-265-nested-job-durable-linkage
          fetch-depth: 0
          persist-credentials: true

      - name: Apply corrected repository contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/m7-265-repository-contract-helper.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          end = "          PY\n\n          cargo fmt --all"
          body = helper.split(begin, 1)[1].split(end, 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          namespace = {}
          exec(compile(body, '<repository-contract-helper>', 'exec'), namespace, namespace)

          path = Path('crates/oxide-batch-core/src/definition.rs')
          text = path.read_text()
          old = '''            Some("nested_job") => {\n                if !object.get("child").is_some_and(serde_json::Value::is_object)\n                    || !object\n                        .get("parameters")\n                        .is_some_and(serde_json::Value::is_array)\n                    || object\n                        .get("mapping_revision")\n                        .and_then(serde_json::Value::as_str)\n                        .is_none()\n                {\n                    return Err(ManifestError::MalformedGraph);\n                }\n            }\n'''
          new = '''            Some("nested_job") => validate_nested_job_manifest(object)?,\n'''
          if text.count(old) != 1:
              raise RuntimeError('nested-job reader block did not match exactly once')
          text = text.replace(old, new, 1)
          anchor = '''fn array_len(value: Option<&serde_json::Value>) -> Result<usize, ManifestError> {\n'''
          helper_fn = '''fn validate_nested_job_manifest(\n    object: &serde_json::Map<String, serde_json::Value>,\n) -> Result<(), ManifestError> {\n    if !object\n        .get("child")\n        .is_some_and(serde_json::Value::is_object)\n        || !object\n            .get("parameters")\n            .is_some_and(serde_json::Value::is_array)\n        || object\n            .get("mapping_revision")\n            .and_then(serde_json::Value::as_str)\n            .is_none()\n    {\n        return Err(ManifestError::MalformedGraph);\n    }\n    Ok(())\n}\n\n'''
          if text.count(anchor) != 1:
              raise RuntimeError('array_len anchor did not match exactly once')
          path.write_text(text.replace(anchor, helper_fn + anchor, 1))
          PY

          cargo fmt --all
          cargo check -p oxide-batch-repository
          cargo check -p oxide-batch
          cargo clippy -p oxide-batch-repository --all-targets --all-features -- -D warnings
          cargo clippy -p oxide-batch-core --all-targets --all-features -- -D warnings

      - name: Promote repository contract
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m7-265-repository-contract-helper.yml
          git rm .github/workflows/m7-265-repository-contract-helper-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(repository): add nested-job linkage contract"
          git push origin HEAD:issue-265-nested-job-durable-linkage
