name: Prepare release draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag to prepare"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-draft-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: prepare-release-draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      # ADR-0010 releases the facade together with the internal crates it
      # requires, so every published crate carries its own archive, SBOM,
      # checksum, and attestation.
      - name: Verify tag and package
        id: package
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oxide-batch") | .version')"
          test "v${package_version}" = "${RELEASE_TAG}"

          # Derived from the checked-out tag's own manifests rather than a
          # hardcoded list, so this works unchanged for an older tag that
          # predates a later-added released crate (e.g. v0.5.0, which
          # predates oxide-batch-test) as well as the current tag.
          RELEASED_CRATES="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select((.publish // []) | length > 0) | .name' \
            | tr '\n' ' ')"

          published=""
          for crate in ${RELEASED_CRATES}; do
            published="${published} --package ${crate}"
          done
          # shellcheck disable=SC2086
          cargo package ${published} --locked
          # shellcheck disable=SC2086
          cargo publish ${published} --locked --dry-run
          crate_paths=""
          for crate in ${RELEASED_CRATES}; do
            crate_path="target/package/${crate}-${package_version}.crate"
            test -s "${crate_path}"
            crate_paths="${crate_paths}${crate_path}"$'\n'
          done
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          {
            echo "crate_paths<<EOF"
            printf '%s' "${crate_paths}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate release SBOM and checksums
        id: evidence
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          # Derived from the checked-out tag's own manifests; see "Verify
          # tag and package" above for why this must not be a hardcoded list.
          RELEASED_CRATES="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select((.publish // []) | length > 0) | .name' \
            | tr '\n' ' ')"

          sbom_paths=""
          artifacts=""
          for crate in ${RELEASED_CRATES}; do
            sbom_name="${crate}-${PACKAGE_VERSION}.cdx"
            cargo cyclonedx \
              --manifest-path "crates/${crate}/Cargo.toml" \
              --format json \
              --all-features \
              --target all \
              --spec-version 1.5 \
              --override-filename "${sbom_name}"
            sbom_source="crates/${crate}/${sbom_name}.json"
            test -s "${sbom_source}"
            cp "${sbom_source}" "target/package/${sbom_name}.json"
            sbom_paths="${sbom_paths}target/package/${sbom_name}.json"$'\n'
            artifacts="${artifacts} ${crate}-${PACKAGE_VERSION}.crate"
            artifacts="${artifacts} ${sbom_name}.json"
          done
          checksum_path="target/package/oxide-batch-${PACKAGE_VERSION}.sha256"
          (
            cd target/package
            # shellcheck disable=SC2086
            sha256sum ${artifacts} > "oxide-batch-${PACKAGE_VERSION}.sha256"
          )
          test -s "${checksum_path}"
          {
            echo "sbom_paths<<EOF"
            printf '%s' "${sbom_paths}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${checksum_path}" >> "${GITHUB_OUTPUT}"

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.crate_paths }}

      - name: Attest oxide-batch-core SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/oxide-batch-core-${{ steps.package.outputs.version }}.crate
          sbom-path: target/package/oxide-batch-core-${{ steps.package.outputs.version }}.cdx.json

      - name: Attest oxide-batch-repository SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/oxide-batch-repository-${{ steps.package.outputs.version }}.crate
          sbom-path: target/package/oxide-batch-repository-${{ steps.package.outputs.version }}.cdx.json

      - name: Attest oxide-batch-plan SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/oxide-batch-plan-${{ steps.package.outputs.version }}.crate
          sbom-path: target/package/oxide-batch-plan-${{ steps.package.outputs.version }}.cdx.json

      - name: Attest oxide-batch SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/oxide-batch-${{ steps.package.outputs.version }}.crate
          sbom-path: target/package/oxide-batch-${{ steps.package.outputs.version }}.cdx.json

      - name: Attest oxide-batch-cli SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/oxide-batch-cli-${{ steps.package.outputs.version }}.crate
          sbom-path: target/package/oxide-batch-cli-${{ steps.package.outputs.version }}.cdx.json

      - name: Attest oxide-batch-test SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/oxide-batch-test-${{ steps.package.outputs.version }}.crate
          sbom-path: target/package/oxide-batch-test-${{ steps.package.outputs.version }}.cdx.json

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          CRATE_PATHS: ${{ steps.package.outputs.crate_paths }}
          SBOM_PATHS: ${{ steps.evidence.outputs.sbom_paths }}
          CHECKSUM_PATH: ${{ steps.evidence.outputs.checksum_path }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            printf '%s\n%s\n%s\n' \
              "${CRATE_PATHS}" "${SBOM_PATHS}" "${CHECKSUM_PATH}" \
              | grep -v '^$'
          )

          set +e
          release_response="$(gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)"
          release_status=$?
          set -e

          if [ "${release_status}" -eq 0 ]; then
            is_draft="$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq .isDraft)"
            test "${is_draft}" = "true"
            gh release upload "${RELEASE_TAG}" \
              "${assets[@]}" \
              --clobber
          elif printf '%s\n' "${release_response}" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
            gh release create "${RELEASE_TAG}" \
              "${assets[@]}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "OxideBatch ${PACKAGE_VERSION}"
          else
            printf '%s\n' "${release_response}" >&2
            exit "${release_status}"
          fi
