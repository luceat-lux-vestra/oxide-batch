name: PR131 final resource-bound retention

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  retain:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ci/m5-resource-bounds-provenance
      - name: Retain final verified artifact bytes and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf /tmp/pr131-final15 /tmp/pr131-final18
          mkdir -p /tmp/pr131-final15 /tmp/pr131-final18
          gh run download 32082276794 -n resource-bounds-campaign-postgres-15 -D /tmp/pr131-final15
          gh run download 32082276794 -n resource-bounds-campaign-postgres-18 -D /tmp/pr131-final18
          test "$(git hash-object /tmp/pr131-final15/resource-bounds-campaign.json)" = "2b1ae8892292156f54bd4b980f26b8f142755cde"
          test "$(git hash-object /tmp/pr131-final18/resource-bounds-campaign.json)" = "fcc7b3e3831c3920e128f721d38e7ae4c64a7ba1"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p,pg in [('/tmp/pr131-final15/resource-bounds-campaign.json','15'),('/tmp/pr131-final18/resource-bounds-campaign.json','18')]:
              d=json.loads(Path(p).read_text())
              assert d['passed'] is True and d['violations'] == []
              assert d['declared_resources'] == 36 and d['observed_resources'] == 36
              assert d['postgresql_major_version'] == pg
              assert d['environment']['source_tree_clean'] is True
              assert d['environment']['source_commit'] == 'fa559c5fcd6d9a7691fb18c92a7c08493d884ff3'
              assert d['observation']['execution_manifest']['execution_commit'] == 'fa559c5fcd6d9a7691fb18c92a7c08493d884ff3'
              assert len(d['reports']) == 4
          PY
          cp /tmp/pr131-final15/resource-bounds-campaign.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json
          cp /tmp/pr131-final18/resource-bounds-campaign.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('docs/engineering/campaigns/m5/evidence-provenance.json')
          doc=json.loads(path.read_text())
          now=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          u={
            'resource-bounds-campaign-postgres-15.json':('15','15.19 (Debian 15.19-1.pgdg13+2)',95547450015,9305531591,'resource-bounds-campaign-postgres-15',13098,'sha256:adeac6c94289bc6c9653c4f1ba2ac1844867ff0be39f1ce8606cf2c5476e3e9e','2b1ae8892292156f54bd4b980f26b8f142755cde'),
            'resource-bounds-campaign-postgres-18.json':('18','18.6 (Debian 18.6-1.pgdg13+2)',95547449953,9305532416,'resource-bounds-campaign-postgres-18',13099,'sha256:21947144cf4333587974fe6735e34b49ef2b7695cd34c91bae5665d162f0db98','fcc7b3e3831c3920e128f721d38e7ae4c64a7ba1')
          }
          seen=set()
          for e in doc['evidence']:
              if e['report'] not in u: continue
              seen.add(e['report'])
              pg,server,job,artifact,name,size,digest,blob=u[e['report']]
              e['postgres_major_version']=pg; e['server_version']=server
              e['producer'].update(execution_commit='fa559c5fcd6d9a7691fb18c92a7c08493d884ff3',branch_head_sha='343c38b3c7f2aa83aff99d4b5dfa81434d663981',source_tree_clean=True,rustc='rustc 1.97.1 (8bab26f4f 2026-07-14)',os='linux',arch='x86_64')
              e['workflow_run'].update(workflow='M5 Resource Bounds',workflow_file='.github/workflows/m5-resource-bounds.yml',id=32082276794,attempt=1,event='pull_request',conclusion='success')
              e['producing_job'].update(name=f'postgres-{pg}-resource-bounds-campaign',id=job,conclusion='success')
              e['artifact'].update(name=name,id=artifact,digest=digest,size_bytes=size)
              e['retained_report_git_blob']=blob
              e['remote_verification']={'verified':True,'verified_at':now,'run_id':32082276794,'workflow_run_identity':True,'workflow_run_conclusion':True,'producing_job_identity':True,'producing_job_conclusion':True,'artifact_digest':True,'artifact_bytes_match_retained_report':True,'execution_commit_matches_report':True,'note':'Final fresh retention after the lint-only verifier cleanup. The run/jobs/artifacts and API SHA-256 digests were verified; both ZIP archives were independently downloaded and hashed, extracted report bytes match these retained git blobs exactly, and both reports bind execution tree fa559c5f to producer branch head 343c38b3 on main 82f995f6.'}
          assert seen == set(u)
          path.write_text(json.dumps(doc,indent=2)+'\n')
          PY
          if ! grep -q '^### Final lint-clean resource-bound retention$' docs/project/m5-campaign-evidence.md; then
            cat >> docs/project/m5-campaign-evidence.md <<'EOF'

### Final lint-clean resource-bound retention

The final verifier shape keeps two audit-oriented functions explicit with narrow Clippy complexity exemptions; no proof semantics changed. Because `xtask/src/resource_bounds.rs` is part of the resource-bound semantic closure, the campaign was nevertheless re-produced rather than reusing earlier evidence. Producer branch head `343c38b3c7f2aa83aff99d4b5dfa81434d663981` executed as PR merge tree `fa559c5fcd6d9a7691fb18c92a7c08493d884ff3` against main `82f995f6fcc7a0ccf1bfc1c7e61453647065b331` in M5 Resource Bounds run `32082276794`. PostgreSQL 15 job `95547450015` retained artifact `9305531591`; PostgreSQL 18 job `95547449953` retained artifact `9305532416`. Both reports cover 36/36 resources with no violations.
EOF
          fi
          git add docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json docs/engineering/campaigns/m5/evidence-provenance.json docs/project/m5-campaign-evidence.md
          git diff --cached --check
          git commit -m "docs(m5): retain lint-clean resource-bound evidence"
          git push origin HEAD:ci/m5-resource-bounds-provenance
