name: PR131 Atomic Fix

on:
  push:
    branches:
      - ci/m5-resource-bounds-provenance
    paths:
      - .github/workflows/pr131-atomic-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/m5-resource-bounds-provenance
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('crates/oxide-batch-cli/tests/m5_resource_bound_shedding.rs')
          s=p.read_text()
          a='self.declared.or_else(|| match self.resource {'
          b='self.declared.or(match self.resource {'
          c='self.unit.or_else(|| match self.resource {'
          d='self.unit.or(match self.resource {'
          assert s.count(a)==1
          assert s.count(c)==1
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
          git rm .github/workflows/pr131-atomic-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/oxide-batch-cli/tests/m5_resource_bound_shedding.rs
          git diff --cached --check
          git commit -m 'ci(m5): satisfy resource-bound shedding lint gate'
          git push origin HEAD:ci/m5-resource-bounds-provenance
