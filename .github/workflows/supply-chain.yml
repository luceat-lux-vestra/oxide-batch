name: Supply chain
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Test supply-chain exception policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_validate_supply_chain_exceptions.py

      - name: Validate supply-chain exception registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate_supply_chain_exceptions.py

      - name: Test dependency update policy registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_validate_dependency_update_policy.py

      - name: Validate dependency update policy registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate_dependency_update_policy.py

      - name: Check advisories, licenses, bans, and sources
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "aarch64"
          target="aarch64-unknown-linux-musl"
          version="$(python3 .github/scripts/validate_dependency_update_policy.py --entry cargo-deny --field version)"
          url="$(python3 .github/scripts/validate_dependency_update_policy.py --entry cargo-deny --artifact "$target" --field url)"
          sha256="$(python3 .github/scripts/validate_dependency_update_policy.py --entry cargo-deny --artifact "$target" --field sha256)"
          dir="$(mktemp -d "$RUNNER_TEMP/cargo-deny.XXXXXX")"
          trap 'rm -rf "$dir"' EXIT
          archive="$dir/cargo-deny.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$url" \
            --output "$archive"
          echo "$sha256  $archive" | sha256sum --check --strict
          mkdir -p "$dir/bin"
          tar -xzf "$archive" -C "$dir/bin" --strip-components=1
          binary="$dir/bin/cargo-deny"
          test -x "$binary"
          test "$("$binary" --version)" = "cargo-deny $version"
          "$binary" --log-level warn --manifest-path ./Cargo.toml --all-features check

  release-tool-artifact:
    name: release-tool-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate dependency update policy registry
        run: python3 .github/scripts/validate_dependency_update_policy.py

      - name: Verify protected-release SBOM tool artifact
        shell: bash
        run: bash .github/scripts/install-cargo-cyclonedx-prebuilt.sh
