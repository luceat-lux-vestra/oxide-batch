name: Supply chain
run-name: pr-authority/supply/pr-${{ inputs.pr_number }}/${{ inputs.head_sha }}/caller-${{ inputs.caller_run_id }}-${{ inputs.caller_run_attempt }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/ci-topology-v7-migration
  workflow_call:
  workflow_dispatch:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      caller_run_id:
        required: true
        type: string
      caller_run_attempt:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event_name }}-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.caller_run_id || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repo || github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Test supply-chain exception policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_validate_supply_chain_exceptions.py

      - name: Validate supply-chain exception registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate_supply_chain_exceptions.py

      - name: Show repository Rust toolchain
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: rustup show

      - name: Install cargo-deny 0.20.2 for ARM64
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        shell: bash
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-deny"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-aarch64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          chmod +x "$install_dir/cargo-deny"
          "$install_dir/cargo-deny" --version
          echo "CARGO_DENY_BIN=$install_dir/cargo-deny" >> "$GITHUB_ENV"

      - name: Check advisories, licenses, bans, and sources
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_DENY_BIN" --log-level warn --manifest-path ./Cargo.toml --all-features check
