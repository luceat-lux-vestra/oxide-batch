name: Supply chain

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: supply-chain-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact trusted base for supply-chain applicability
        id: supply-trusted-base
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .supply-trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Classify supply-chain applicability from trusted base
        id: supply-impact
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_CHECKOUT: ${{ steps.supply-trusted-base.outcome }}
        shell: bash
        run: |
          echo 'impact=true' >> "$GITHUB_OUTPUT"
          set -euo pipefail
          test "$TRUSTED_CHECKOUT" = "success"

          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.base.sha == $base and .head.sha == $head and .base.repo.full_name == $repo and ((.changed_files | type) == "number" and .changed_files > 0)' \
            <<<"$pr_json" >/dev/null
          expected_count="$(jq -er '.changed_files' <<<"$pr_json")"

          pages="$(gh api --paginate --slurp -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          jq -e 'type == "array" and all(.[]; type == "array")' <<<"$pages" >/dev/null
          changed_file_records="$(mktemp)"
          trap 'rm -f "$changed_file_records"' EXIT
          jq -r '.[][] | [.status, .filename, (.previous_filename // "")] | @tsv' <<<"$pages" >"$changed_file_records"

          classification="$(
            python3 .supply-trusted-base/.github/scripts/pr-scope.py \
              --repo-root .supply-trusted-base \
              --policy .github/merge-gate-policy.json \
              --expected-count "$expected_count" \
              --trusted-base-sha "$BASE_SHA" \
              <"$changed_file_records"
          )"
          impact="$(
            jq -er '
              if .classification_valid == true and
                 (.supply_chain_impact | type) == "boolean"
              then .supply_chain_impact
              else error("invalid supply-chain applicability output")
              end
            ' <<<"$classification"
          )"
          echo "impact=$impact" >> "$GITHUB_OUTPUT"
          echo "supply-chain impact: $impact"

      - name: Documentation-only supply-chain fast path
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && steps.supply-impact.outcome == 'success' && steps.supply-impact.outputs.impact == 'false' }}
        run: echo "Trusted-base policy proves this documentation-only diff cannot affect dependency, license, advisory, source, or supply-chain exception authority."

      - name: Test supply-chain exception policy
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (steps.supply-impact.outcome != 'success' || steps.supply-impact.outputs.impact != 'false')) }}
        run: python3 .github/scripts/test_validate_supply_chain_exceptions.py

      - name: Validate supply-chain exception registry
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (steps.supply-impact.outcome != 'success' || steps.supply-impact.outputs.impact != 'false')) }}
        run: python3 .github/scripts/validate_supply_chain_exceptions.py

      - name: Check advisories, licenses, bans, and sources
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (steps.supply-impact.outcome != 'success' || steps.supply-impact.outputs.impact != 'false')) }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  report-failure:
    name: report-scheduled-failure
    needs:
      - supply-chain
    if: >-
      ${{ always() && github.event_name == 'schedule' &&
      needs.supply-chain.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # Read repository metadata needed to locate the owned report issue.
      issues: write # Create or update only the scheduled supply-chain failure issue.
    steps:
      - name: Create or update the owned failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'ci: scheduled supply-chain check is failing';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = [
              context.serverUrl,
              owner,
              repo,
              'actions',
              'runs',
              context.runId,
            ].join('/');
            const body = [
              'The scheduled supply-chain gate failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Triage advisories, licenses, bans, sources, and exception metadata according to',
              '`docs/engineering/dependency-policy.md`. Every active exception requires an',
              'owner, rationale, and unexpired date in `.github/supply-chain-exceptions.json`.',
            ].join('\n');

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                labels: 'type:security,area:ci',
                per_page: 100,
              },
            );
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [
                  'type:security',
                  'area:ci',
                  'priority:p1',
                  'status:needs-triage',
                ],
              });
            }
