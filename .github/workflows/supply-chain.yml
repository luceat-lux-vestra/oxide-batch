name: Supply chain

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test supply-chain exception policy
        run: python3 .github/scripts/test_validate_supply_chain_exceptions.py

      - name: Validate supply-chain exception registry
        run: python3 .github/scripts/validate_supply_chain_exceptions.py

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  report-failure:
    name: report-scheduled-failure
    needs:
      - supply-chain
    if: >-
      ${{ always() && github.event_name == 'schedule' &&
      needs.supply-chain.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      # The reporting job reads repository metadata and writes only its owned issue.
      contents: read
      issues: write
    steps:
      - name: Create or update the owned failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'ci: scheduled supply-chain check is failing';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = [
              context.serverUrl,
              owner,
              repo,
              'actions',
              'runs',
              context.runId,
            ].join('/');
            const body = [
              'The scheduled supply-chain gate failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Triage advisories, licenses, bans, sources, and exception metadata according to',
              '`docs/engineering/dependency-policy.md`. Every active exception requires an',
              'owner, rationale, and unexpired date in `.github/supply-chain-exceptions.json`.',
            ].join('\n');

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                labels: 'type:security,area:ci',
                per_page: 100,
              },
            );
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [
                  'type:security',
                  'area:ci',
                  'priority:p1',
                  'status:needs-triage',
                ],
              });
            }
