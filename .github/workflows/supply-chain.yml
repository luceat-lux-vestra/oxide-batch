name: Supply chain
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Test dependency-update lifecycle policy
        run: python3 .github/scripts/validate_dependency_update_lifecycle.py --self-test

      - name: Validate dependency-update lifecycle registry
        run: python3 .github/scripts/validate_dependency_update_lifecycle.py

      - name: Verify x64 compiler-cache tool artifact
        shell: bash
        run: bash .github/scripts/install-sccache.sh x86_64-unknown-linux-musl

      - name: Verify protected-release SBOM tool artifact
        shell: bash
        run: bash .github/scripts/install-cargo-cyclonedx-prebuilt.sh

      - name: Test supply-chain exception policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_validate_supply_chain_exceptions.py

      - name: Validate supply-chain exception registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate_supply_chain_exceptions.py

      - name: Check advisories, licenses, bans, and sources
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        shell: bash
        run: bash .github/scripts/run-cargo-deny.sh
