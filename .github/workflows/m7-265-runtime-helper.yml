name: M7 265 runtime compile helper

on:
  push:
    branches: [issue-265-nested-job-durable-linkage]
    paths:
      - .github/workflows/m7-265-runtime-helper.yml
      - .github/helpers/m7_265_stage_a.py

permissions:
  contents: write

jobs:
  implement-runtime-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply runtime foundation patch
        run: python3 .github/helpers/m7_265_stage_a.py
      - name: Format
        run: cargo fmt --all
      - name: Compile all oxide-batch targets
        run: cargo check -p oxide-batch --all-targets --locked
      - name: Strict clippy
        run: cargo clippy -p oxide-batch --all-targets --locked -- -D warnings
      - name: Diff check
        run: git diff --check
      - name: Promote green product changes
        run: |
          set -euo pipefail
          git config user.name "oxide-batch-ci"
          git config user.email "oxide-batch-ci@users.noreply.github.com"
          git add crates/oxide-batch/src/nested_job_runtime.rs crates/oxide-batch/src/lib.rs crates/oxide-batch/src/flow.rs crates/oxide-batch-repository/src/flow.rs
          git commit -m "feat(flow): add nested-job runtime foundation"
          git push origin HEAD:issue-265-nested-job-durable-linkage
