name: M7 265 runtime compile helper

on:
  push:
    branches: [issue-265-nested-job-durable-linkage]
    paths:
      - .github/workflows/m7-265-runtime-helper.yml
      - .github/helpers/m7_265_stage_a.py
      - .github/helpers/m7_265_stage_b.py
      - .github/helpers/m7_265_stage_c.py

permissions:
  contents: write

jobs:
  implement-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply runtime foundation patch
        run: python3 .github/helpers/m7_265_stage_a.py
      - name: Apply precreated child launcher patch
        run: python3 .github/helpers/m7_265_stage_b.py
      - name: Format
        run: cargo fmt --all
      - name: Compile library with PostgreSQL adapter
        run: cargo check -p oxide-batch --lib --features postgres --locked
      - name: Diff check
        run: git diff --check
