name: PR131 Trigger Closure Repair v7

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/pr131-final-closure
      - name: Apply repair and compiler-validate fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr131-close-gaps.yml').read_text().splitlines()
          i=src.index('        run: |')+1
          body=[line[10:] if line.startswith('          ') else line for line in src[i:]]
          script='\n'.join(body)+'\n'
          script=script.replace('cargo fmt --all --check','cargo fmt --all')
          fix=r'''python3 - <<'PYFIX'
          from pathlib import Path
          import re
          p=Path('xtask/src/resource_bounds.rs')
          s=p.read_text()
          marker='#[cfg(test)]\nmod tests {'
          a,b=s.split(marker,1)
          b,n=re.subn(r'(\n\s*report:\s*(?!String\b)[^,\n]+,\n)(\s*ceiling:)', r'\1            unit: "units".to_owned(),\n\2', b)
          print(f'patched Resource initializer fixtures: {n}')
          if not (10 <= n <= 12):
              raise SystemExit(f'unexpected Resource initializer count: {n}')
          p.write_text(a+marker+b)
          PYFIX
          cargo fmt --all
          cargo test --package oxide-batch-xtask resource_bounds'''
          script=script.replace('cargo test --package oxide-batch-xtask resource_bounds --lib',fix)
          Path('/tmp/pr131-close.sh').write_text(script)
          PY
          bash /tmp/pr131-close.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/pr131-trigger-close.yml .github/workflows/pr131-finalize.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove temporary PR131 repair workflows"
            git push origin HEAD:fix/pr131-final-closure
          fi
