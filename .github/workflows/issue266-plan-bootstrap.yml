name: Issue 266 custom-leaf plan bootstrap

on:
  push:
    branches: [issue-266-custom-leaf-lifecycle]
    paths: [.github/workflows/issue266-plan-bootstrap.yml]

concurrency:
  group: issue266-plan-bootstrap
  cancel-in-progress: false

permissions: {}

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the one-time development candidate commit.
    steps:
      - name: Fetch exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Add custom-leaf plan wiring and contract tests
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          lib = "crates/oxide-batch-plan/src/lib.rs"
          replace_one(lib, "mod advanced;\nmod nested_job;", "mod advanced;\nmod custom_leaf;\nmod nested_job;")
          replace_one(
              lib,
              "pub use nested_job::{\n",
              "pub use custom_leaf::{CustomLeafKind, CustomLeafNode};\n\npub use nested_job::{\n",
          )
          replace_one(
              lib,
              "    /// A separately durable child-job lifecycle boundary.\n    NestedJob(Box<NestedJobNode>),\n    /// A bounded set of linear branches and its structural join.",
              "    /// A separately durable child-job lifecycle boundary.\n    NestedJob(Box<NestedJobNode>),\n    /// A registered framework-owned custom leaf.\n    CustomLeaf(Box<CustomLeafNode>),\n    /// A bounded set of linear branches and its structural join.",
          )
          replace_one(
              lib,
              "    /// Declares a bounded split node.\n    #[must_use]\n    pub fn split(node: SplitNode) -> Self {",
              "    /// Declares a registered framework-owned custom leaf.\n    #[must_use]\n    pub fn custom_leaf(node: CustomLeafNode) -> Self {\n        Self::CustomLeaf(Box::new(node))\n    }\n\n    /// Declares a bounded split node.\n    #[must_use]\n    pub fn split(node: SplitNode) -> Self {",
          )
          replace_one(
              lib,
              "            Self::NestedJob(node) => node.id(),\n            Self::Split(node) => node.id(),",
              "            Self::NestedJob(node) => node.id(),\n            Self::CustomLeaf(node) => node.id(),\n            Self::Split(node) => node.id(),",
          )
          replace_one(
              lib,
              "            Self::NestedJob(node) => node.manifest_value(),\n            Self::Split(node) => node.manifest_value(),",
              "            Self::NestedJob(node) => node.manifest_value(),\n            Self::CustomLeaf(node) => node.manifest_value(),\n            Self::Split(node) => node.manifest_value(),",
          )
          replace_one(
              lib,
              "                FlowNode::NestedJob(_) => true,\n                FlowNode::Split(split) => {",
              "                FlowNode::NestedJob(_) | FlowNode::CustomLeaf(_) => true,\n                FlowNode::Split(split) => {",
          )

          advanced = "crates/oxide-batch-plan/src/advanced.rs"
          replace_one(
              advanced,
              "                FlowNode::Step(_)\n                | FlowNode::Decision(_)\n                | FlowNode::NestedJob(_)\n                | FlowNode::Join(_) => {}",
              "                FlowNode::Step(_)\n                | FlowNode::Decision(_)\n                | FlowNode::NestedJob(_)\n                | FlowNode::CustomLeaf(_)\n                | FlowNode::Join(_) => {}",
          )

          test = Path("crates/oxide-batch-plan/tests/custom_leaf.rs")
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(r'''use oxide_batch_core::{
              ComponentRevision, DefinitionRevision, FlowTarget, JobName, NodeId, StateSchemaId,
              StateSchemaVersion, StepName, TerminalKind, MANIFEST_FORMAT_ADVANCED_FLOW,
          };
          use oxide_batch_plan::{CustomLeafKind, CustomLeafNode, FlowGraph, FlowNode};

          fn compiled(
              kind: &str,
              revision: &str,
              schema: &str,
              schema_version: u32,
          ) -> oxide_batch_plan::CompiledExecutionPlan {
              let id = NodeId::new("custom").expect("node");
              let leaf = CustomLeafNode::new(
                  id.clone(),
                  StepName::new("custom").expect("step"),
                  CustomLeafKind::new(kind).expect("kind"),
                  ComponentRevision::new(revision).expect("revision"),
                  StateSchemaId::new(schema).expect("schema"),
                  StateSchemaVersion::new(schema_version).expect("schema version"),
              );
              FlowGraph::new(id.clone())
                  .with_node(FlowNode::custom_leaf(leaf))
                  .with_sequence(id, FlowTarget::Terminal(TerminalKind::Complete))
                  .expect("sequence")
                  .compile(
                      &JobName::new("custom_job").expect("job"),
                      DefinitionRevision::new("r1").expect("definition revision"),
                  )
                  .expect("compile")
          }

          #[test]
          fn custom_leaf_forces_format_four() {
              assert_eq!(compiled("example", "handler-v1", "state", 1).manifest_format(), MANIFEST_FORMAT_ADVANCED_FLOW);
          }

          #[test]
          fn handler_revision_changes_definition_fingerprint() {
              assert_ne!(
                  compiled("example", "handler-v1", "state", 1).fingerprint(),
                  compiled("example", "handler-v2", "state", 1).fingerprint(),
              );
          }

          #[test]
          fn state_schema_identity_changes_definition_fingerprint() {
              assert_ne!(
                  compiled("example", "handler-v1", "state", 1).fingerprint(),
                  compiled("example", "handler-v1", "state", 2).fingerprint(),
              );
              assert_ne!(
                  compiled("example", "handler-v1", "state-a", 1).fingerprint(),
                  compiled("example", "handler-v1", "state-b", 1).fingerprint(),
              );
          }

          #[test]
          fn custom_kind_changes_definition_fingerprint() {
              assert_ne!(
                  compiled("example-a", "handler-v1", "state", 1).fingerprint(),
                  compiled("example-b", "handler-v1", "state", 1).fingerprint(),
              );
          }
          ''')
          PY
          cargo fmt --all
          cargo check -p oxide-batch-plan --all-targets
          cargo test -p oxide-batch-plan

      - name: Commit candidate and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/issue266-plan-bootstrap.yml
          git add crates/oxide-batch-plan
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(plan): add registered custom-leaf declaration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
