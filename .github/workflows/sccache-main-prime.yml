name: Fast compiler cache prime

on:
  # Protected-main dependency/toolchain changes are the only automatic cache-write authority.
  # This avoids privileged workflow_run cache writes entirely.
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - '**/.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.github/dependency-update-policy.json'
      - '.github/scripts/ensure-stable-rust.sh'
      - '.github/scripts/install-mold-arm64.sh'
      - '.github/scripts/rust-cache-identity.sh'
      - '.github/scripts/validate_dependency_update_policy.py'
      - '.github/workflows/sccache-main-prime.yml'
  # Manual dispatch repairs evicted protected-main cache entries.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-sccache-main-prime
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  SCCACHE_CACHE_SIZE: 768M
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  prime:
    name: main ${{ matrix.arch }} compiler cache prime
    cache-mode: write
    # Automatic writes run only from protected-main push; manual dispatch is owner-triggered.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-26.04-arm
            runner_arch: ARM64
            uname_arch: aarch64
            artifact_triple: aarch64-unknown-linux-musl
          - arch: x64
            runner: ubuntu-26.04
            runner_arch: X64
            uname_arch: x86_64
            artifact_triple: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_UNAME_ARCH: ${{ matrix.uname_arch }}
      SCCACHE_ARTIFACT_TRIPLE: ${{ matrix.artifact_triple }}
    permissions:
      actions: write # Prune older protected-main Fast compiler-cache entries after a successful save.
      contents: read # Check out the exact protected default-branch source being cached.
    steps:
      - name: Check out protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify protected-main authority
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -1 --check
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(uname -m)" = "$EXPECTED_UNAME_ARCH"

      - name: Resolve latest Rust Stable
        run: bash .github/scripts/ensure-stable-rust.sh

      - name: Resolve bounded compiler-cache identity
        id: cache-id
        shell: bash
        run: |
          set -euo pipefail
          toolchain_hash="$(bash .github/scripts/rust-cache-identity.sh)"
          lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          [[ "$toolchain_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          sccache_version="$(python3 .github/scripts/validate_dependency_update_policy.py --entry sccache --field version)"
          case "$RUNNER_ARCH" in
            ARM64)
              mold_version="$(python3 .github/scripts/validate_dependency_update_policy.py --entry mold-arm64 --field version)"
              cache_prefix="oxide-fast-sccache-linux-arm64-sccache-${sccache_version}-mold-${mold_version}-"
              ;;
            X64)
              cache_prefix="oxide-fast-sccache-linux-x64-sccache-${sccache_version}-"
              ;;
            *)
              echo "::error::unsupported cache architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          family="${cache_prefix}${toolchain_hash}"
          # Match a complete toolchain identity, so the x64 cleanup cannot select ARM64 caches.
          root_prefix="${family}-"
          lock_prefix="${family}-${lock_hash}-"
          key="${lock_prefix}${GITHUB_SHA}"

          {
            echo "root_prefix=$root_prefix"
            echo "family=$family"
            echo "lock_prefix=$lock_prefix"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"

          echo "Fast compiler-cache key: $key"

      - name: Restore newest compatible main compiler cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.cache-id.outputs.lock_prefix }}
            ${{ steps.cache-id.outputs.family }}-

      - name: Protected-main compiler cache already current
        if: ${{ steps.restore-cache.outputs.cache-hit == 'true' }}
        run: echo "Exact protected-main Fast compiler cache already exists; no prime work is needed."

      - name: Install verified sccache
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/validate_dependency_update_policy.py --entry sccache --field version)"
          url="$(python3 .github/scripts/validate_dependency_update_policy.py --entry sccache --artifact "$SCCACHE_ARTIFACT_TRIPLE" --field url)"
          sha256="$(python3 .github/scripts/validate_dependency_update_policy.py --entry sccache --artifact "$SCCACHE_ARTIFACT_TRIPLE" --field sha256)"
          archive="$RUNNER_TEMP/sccache-${version}-${SCCACHE_ARTIFACT_TRIPLE}.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-${version}"

          curl --fail --location --retry 3 --retry-delay 2 \
            "$url" \
            --output "$archive"

          echo "$sha256  $archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          test "$("$install_dir/sccache" --version)" = "sccache $version"
          # The Rust toolchain bin directory is already on PATH; do not write a privileged GITHUB_PATH.
          cargo_bin_dir="$(dirname "$(command -v cargo)")"
          test -d "$cargo_bin_dir"
          install -m 0755 "$install_dir/sccache" "$cargo_bin_dir/sccache"

      - name: Install verified mold for ARM64 Rust linking
        if: ${{ matrix.arch == 'arm64' && steps.restore-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: bash .github/scripts/install-mold-arm64.sh

      # Explicit, scoped env avoids privileged GITHUB_ENV writes. This is
      # the FIRST invocation of sccache; it starts the server on the
      # restored directory before any Cargo subprocess.
      - name: Verify running compiler cache uses restored directory
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        env:
          SCCACHE_DIR: ${{ runner.temp }}/oxide-fast-sccache
        shell: bash
        run: |
          set -euo pipefail
          test "$SCCACHE_DIR" = "$RUNNER_TEMP/oxide-fast-sccache"
          mkdir -p "$SCCACHE_DIR"
          sccache --show-stats --stats-format=json > "$RUNNER_TEMP/sccache-initial-stats.json"
          python3 - "$RUNNER_TEMP/sccache-initial-stats.json" "$SCCACHE_DIR" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              details = json.load(stream)
          expected = f'Local disk: "{sys.argv[2]}"'
          actual = details.get("cache_location")
          print(f"main-prime server_cache_location={actual}")
          if actual != expected:
              raise SystemExit(f"cache path mismatch: expected {expected}, got {actual}")
          PY

      - name: Fetch locked dependencies
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        env:
          SCCACHE_DIR: ${{ runner.temp }}/oxide-fast-sccache
        run: cargo fetch --locked

      - name: Prime exact Fast Rust compiler outputs
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        env:
          SCCACHE_DIR: ${{ runner.temp }}/oxide-fast-sccache
        shell: bash
        run: |
          set -euo pipefail
          sccache --zero-stats

          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::too_many_lines

          cargo test --workspace --all-features --lib

          # quality-fast runs one additional xtask Clippy pass to verify that
          # the two documented audit-shape exceptions remain narrowly scoped.
          # Prime its compiler outputs too so read-only PR consumers do not
          # incur the otherwise repeatable three Rust misses.
          cargo clippy -p oxide-batch-xtask --all-targets --all-features --message-format=json -- \
            -W clippy::too_many_arguments -W clippy::too_many_lines \
            > /tmp/xtask-clippy-prime.json

          sccache --show-stats --stats-format=json | tee /tmp/sccache-main-prime-stats.json
          python3 - /tmp/sccache-main-prime-stats.json "$SCCACHE_DIR" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              details = json.load(stream)
          expected_location = f'Local disk: "{sys.argv[2]}"'
          actual_location = details.get("cache_location")
          if actual_location != expected_location:
              raise SystemExit(
                  f"compiler cache must match restored/saved path: "
                  f"expected {expected_location}, got {actual_location}"
              )
          stats = details.get("stats", {})
          rust_hits = stats.get("cache_hits", {}).get("counts", {}).get("Rust", 0)
          rust_misses = stats.get("cache_misses", {}).get("counts", {}).get("Rust", 0)
          read_errors = stats.get("cache_read_errors", 0)
          write_errors = stats.get("cache_write_errors", 0)

          print(
              f"main-prime rust_hits={rust_hits} rust_misses={rust_misses} "
              f"read_errors={read_errors} write_errors={write_errors}"
          )
          if read_errors != 0 or write_errors != 0:
              raise SystemExit("main compiler-cache prime recorded cache I/O errors")
          PY

      # Do not publish a stale cache if another PR was merged while compiling.
      - name: Recheck protected main before cache publication
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" --jq '.commit.sha')"
          test "$current_main" = "$GITHUB_SHA"

      - name: Save exact protected-main compiler cache
        id: save-cache
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.cache-id.outputs.key }}

      - name: Verify exact protected-main compiler cache was published
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' && steps.save-cache.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.cache-id.outputs.key }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/heads/$DEFAULT_BRANCH"
          found=0
          for _ in 1 2 3 4 5; do
            response="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/caches?ref=$ref&key=$CURRENT_KEY&per_page=100")"
            count="$(jq -r --arg key "$CURRENT_KEY" --arg ref "$ref" \
              '[.actions_caches[] | select(.key == $key and .ref == $ref)] | length' \
              <<<"$response")"
            if [ "$count" -ge 1 ]; then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" -eq 1
          echo "Verified published protected-main compiler cache: $CURRENT_KEY"

      - name: Keep only current and one previous Fast compiler cache
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' && steps.save-cache.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.cache-id.outputs.key }}
          ROOT_PREFIX: ${{ steps.cache-id.outputs.root_prefix }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/heads/$DEFAULT_BRANCH"

          list_caches() {
            gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100"
          }

          caches="$(list_caches)"
          mapfile -t delete_ids < <(
            jq -r \
              --arg prefix "$ROOT_PREFIX" \
              --arg current "$CURRENT_KEY" \
              --arg ref "$ref" '
                [
                  .[].actions_caches[]
                  | select(
                      .ref == $ref
                      and (.key | startswith($prefix))
                      and .key != $current
                    )
                ]
                | sort_by(.created_at)
                | reverse
                | .[1:][]
                | .id
              ' <<<"$caches"
          )

          for cache_id in "${delete_ids[@]}"; do
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
          done

          remaining="$(
            list_caches | jq \
              --arg prefix "$ROOT_PREFIX" \
              --arg ref "$ref" '
                [
                  .[].actions_caches[]
                  | select(.ref == $ref and (.key | startswith($prefix)))
                ]
                | length
              '
          )"
          test "$remaining" -le 2
          echo "Retained $remaining protected-main Fast compiler cache entries."
