name: Fast compiler cache prime

on:
  # Trigger only after the read-only merged-PR signal has completed.
  # workflow_run executes the protected default-branch workflow, never PR-head code.
  workflow_run:
    workflows: ["Protected main merge signal"]
    types: [completed]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-sccache-main-prime
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  SCCACHE_CACHE_SIZE: 768M
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  prime:
    name: main ${{ matrix.arch }} compiler cache prime
    # The successful merged-main signal job is verified again below against the
    # exact upstream workflow run; closed-without-merge cannot populate caches.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            uname_arch: aarch64
            cache_prefix: oxide-fast-sccache-v1-linux-arm64-
            artifact_triple: aarch64-unknown-linux-musl
            artifact_sha256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a
          - arch: x64
            runner: ubuntu-24.04
            runner_arch: X64
            uname_arch: x86_64
            cache_prefix: oxide-fast-sccache-v1-linux-
            artifact_triple: x86_64-unknown-linux-musl
            artifact_sha256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CACHE_PREFIX: ${{ matrix.cache_prefix }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_UNAME_ARCH: ${{ matrix.uname_arch }}
      SCCACHE_ARTIFACT_TRIPLE: ${{ matrix.artifact_triple }}
      SCCACHE_ARTIFACT_SHA256: ${{ matrix.artifact_sha256 }}
    permissions:
      actions: write # Prune older protected-main Fast compiler-cache entries after a successful save.
      contents: read # Check out the exact protected default-branch source being cached.
    steps:
      - name: Verify completed trusted merge signal
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ ]]
          test "$UPSTREAM_EVENT" = pull_request
          test "$UPSTREAM_CONCLUSION" = success
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$UPSTREAM_HEAD_SHA" = "$GITHUB_SHA"
          current_main="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" --jq '.commit.sha')"
          test "$current_main" = "$GITHUB_SHA"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100" |
            jq -e '
              .total_count == 1 and
              (.jobs | length) == 1 and
              .jobs[0].name == "merged-main-signal" and
              .jobs[0].conclusion == "success"
            ' >/dev/null

      - name: Check out protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify protected-main authority
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -1 --check
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(uname -m)" = "$EXPECTED_UNAME_ARCH"

      - name: Resolve bounded compiler-cache identity
        id: cache-id
        shell: bash
        run: |
          set -euo pipefail
          toolchain_hash="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
          lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          [[ "$toolchain_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          family="${CACHE_PREFIX}${toolchain_hash}"
          # Match a complete toolchain identity, so the x64 cleanup cannot select ARM64 caches.
          root_prefix="${family}-"
          lock_prefix="${family}-${lock_hash}-"
          key="${lock_prefix}${GITHUB_SHA}"

          {
            echo "root_prefix=$root_prefix"
            echo "family=$family"
            echo "lock_prefix=$lock_prefix"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"

          echo "Fast compiler-cache key: $key"

      - name: Restore newest compatible main compiler cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.cache-id.outputs.lock_prefix }}
            ${{ steps.cache-id.outputs.family }}-

      - name: Protected-main compiler cache already current
        if: ${{ steps.restore-cache.outputs.cache-hit == 'true' }}
        run: echo "Exact protected-main Fast compiler cache already exists; no prime work is needed."

      - name: Install verified sccache 0.18.0
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sccache-v0.18.0-${SCCACHE_ARTIFACT_TRIPLE}.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v0.18.0"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-${SCCACHE_ARTIFACT_TRIPLE}.tar.gz" \
            --output "$archive"

          echo "$SCCACHE_ARTIFACT_SHA256  $archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Configure local sccache directory
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/oxide-fast-sccache" >> "$GITHUB_ENV"

      - name: Fetch locked dependencies
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        run: cargo fetch --locked

      - name: Prime exact Fast Rust compiler outputs
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sccache --zero-stats

          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::too_many_lines

          cargo test --workspace --all-features --lib

          sccache --show-stats --stats-format=json | tee /tmp/sccache-main-prime-stats.json
          python3 - /tmp/sccache-main-prime-stats.json <<'PY'
          import json
          import sys

          stats = json.load(open(sys.argv[1], encoding="utf-8")).get("stats", {})
          rust_hits = stats.get("cache_hits", {}).get("counts", {}).get("Rust", 0)
          rust_misses = stats.get("cache_misses", {}).get("counts", {}).get("Rust", 0)
          read_errors = stats.get("cache_read_errors", 0)
          write_errors = stats.get("cache_write_errors", 0)

          print(
              f"main-prime rust_hits={rust_hits} rust_misses={rust_misses} "
              f"read_errors={read_errors} write_errors={write_errors}"
          )
          if read_errors != 0 or write_errors != 0:
              raise SystemExit("main compiler-cache prime recorded cache I/O errors")
          PY

      - name: Save exact protected-main compiler cache
        id: save-cache
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.cache-id.outputs.key }}

      - name: Keep only current and one previous Fast compiler cache
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' && steps.save-cache.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.cache-id.outputs.key }}
          ROOT_PREFIX: ${{ steps.cache-id.outputs.root_prefix }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/heads/$DEFAULT_BRANCH"

          list_caches() {
            gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100"
          }

          caches="$(list_caches)"
          mapfile -t delete_ids < <(
            jq -r \
              --arg prefix "$ROOT_PREFIX" \
              --arg current "$CURRENT_KEY" \
              --arg ref "$ref" '
                [
                  .[].actions_caches[]
                  | select(
                      .ref == $ref
                      and (.key | startswith($prefix))
                      and .key != $current
                    )
                ]
                | sort_by(.created_at)
                | reverse
                | .[1:][]
                | .id
              ' <<<"$caches"
          )

          for cache_id in "${delete_ids[@]}"; do
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
          done

          remaining="$(
            list_caches | jq \
              --arg prefix "$ROOT_PREFIX" \
              --arg ref "$ref" '
                [
                  .[].actions_caches[]
                  | select(.ref == $ref and (.key | startswith($prefix)))
                ]
                | length
              '
          )"
          test "$remaining" -le 2
          echo "Retained $remaining protected-main Fast compiler cache entries."
