name: PR131 Final Audit Fix

on:
  push:
    branches:
      - ci/m5-resource-bounds-provenance
    paths:
      - .github/workflows/pr131-final-audit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/m5-resource-bounds-provenance
          fetch-depth: 0
      - name: Remove source-level lint suppression and verify both gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('xtask/src/resource_bounds.rs')
          s = p.read_text()
          a = '#[allow(clippy::too_many_arguments)]\nfn reconcile_exact_cell('
          b = '#[allow(clippy::too_many_lines)]\nfn reconcile_search_bounded_construction('
          assert s.count(a) == 1, s.count(a)
          assert s.count(b) == 1, s.count(b)
          s = s.replace(a, 'fn reconcile_exact_cell(', 1)
          s = s.replace(b, 'fn reconcile_search_bounded_construction(', 1)
          p.write_text(s)
          PY
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::too_many_lines
          cargo clippy -p oxide-batch-xtask --all-targets --all-features --message-format=json -- -W clippy::too_many_arguments -W clippy::too_many_lines > /tmp/xtask-clippy.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {('clippy::too_many_arguments','reconcile_exact_cell'),('clippy::too_many_lines','reconcile_search_bounded_construction')}
          seen=set(); source={}
          for raw in Path('/tmp/xtask-clippy.json').read_text().splitlines():
              try: item=json.loads(raw)
              except json.JSONDecodeError: continue
              if item.get('reason')!='compiler-message': continue
              m=item.get('message') or {}; code=(m.get('code') or {}).get('code')
              if code not in {'clippy::too_many_arguments','clippy::too_many_lines'}: continue
              primary=next((x for x in m.get('spans',[]) if x.get('is_primary')),None)
              assert primary is not None
              path=primary['file_name']; lines=source.setdefault(path,Path(path).read_text().splitlines())
              context='\n'.join(lines[max(0,primary['line_start']-2):min(len(lines),primary['line_end']+3)])
              names=[name for lint,name in expected if lint==code and f'fn {name}(' in context]
              assert len(names)==1,(code,path,context)
              seen.add((code,names[0]))
          assert seen==expected,(seen,expected)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xtask/src/resource_bounds.rs
          git diff --cached --check
          git commit -m 'ci(m5): align lint exceptions with audit gate'
          git push origin HEAD:ci/m5-resource-bounds-provenance
