name: M5 post-merge cache signal

# Advisory, read-only M5 lifecycle signal for protected-main compiler cache maintenance.
# No checkout, secrets, artifacts, or PR-head code execution.
on:
  pull_request:
    types: [closed]
    branches: [main]
    # Dependency/toolchain and cache-contract changes only. General source-only
    # merges reuse the last compatible default-branch sccache archive.
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - '**/.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.github/workflows/m5-post-merge-cache-signal.yml'
      - '.github/workflows/sccache-main-prime.yml'

permissions: {}

concurrency:
  group: protected-main-merge-signal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merged-main-signal:
    name: merged-main-signal
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.pull_request.merge_commit_sha == github.sha }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Confirm merged-main event
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_SHA" = "$MERGE_SHA"
          echo "Trusted protected-main merge event accepted at $MERGE_SHA"
