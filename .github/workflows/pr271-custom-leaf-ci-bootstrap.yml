name: PR 271 custom-leaf crash CI bootstrap

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wire crash matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/ci.yml"); s=p.read_text(); a="          cargo test -p oxide-batch --features postgres \\\n            --test postgres_nested_job_crash_recovery \\\n            -- --nocapture --test-threads=1\n"; b=a+"          cargo test -p oxide-batch --features postgres \\\n            --test postgres_custom_leaf_crash_recovery \\\n            -- --nocapture --test-threads=1\n"; assert s.count(a)==1, s.count(a); p.write_text(s.replace(a,b,1))'
          cargo fmt --all
          git diff --check
          cargo check --workspace --all-targets --all-features --locked
          cargo test -p oxide-batch --features postgres --test postgres_custom_leaf_crash_recovery --no-run --locked
          cargo test -p oxide-batch --test custom_leaf_binding --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_runtime --all-features --locked

      - name: Commit candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/pr271-custom-leaf-ci-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(flow): wire custom-leaf crash matrix"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
