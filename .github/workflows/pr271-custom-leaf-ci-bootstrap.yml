name: PR 271 custom-leaf crash CI bootstrap

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

concurrency:
  group: pr271-custom-leaf-ci-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wire PostgreSQL 15/18 crash matrix and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          anchor = '''          cargo test -p oxide-batch --features postgres \\
            --test postgres_nested_job_crash_recovery \\
            -- --nocapture --test-threads=1
'''
          addition = anchor + '''          cargo test -p oxide-batch --features postgres \\
            --test postgres_custom_leaf_crash_recovery \\
            -- --nocapture --test-threads=1
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one nested-job crash-matrix anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition, 1))
          PY
          cargo fmt --all
          git diff --check
          cargo check --workspace --all-targets --all-features --locked
          cargo test -p oxide-batch --features postgres --test postgres_custom_leaf_crash_recovery --no-run --locked
          cargo test -p oxide-batch --test custom_leaf_binding --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_runtime --all-features --locked

      - name: Commit candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/pr271-custom-leaf-ci-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(flow): wire custom-leaf crash matrix"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
