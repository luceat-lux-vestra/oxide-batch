name: PR 271 custom-leaf crash CI bootstrap

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply review fixes and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/pr271-review-fix.py
          cargo fmt --all
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::too_many_lines
          cargo check --workspace --all-targets --all-features --locked
          cargo test -p oxide-batch --features postgres --test postgres_custom_leaf_crash_recovery --no-run --locked
          cargo test -p oxide-batch --test custom_leaf_binding --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_runtime --all-features --locked

      - name: Commit candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/pr271-custom-leaf-ci-bootstrap.yml
          rm .github/scripts/pr271-review-fix.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(flow): close custom-leaf restart proof gaps"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
