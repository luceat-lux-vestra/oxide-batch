name: AI pull request review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  models: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: advisory-review
    if: >-
      ${{ !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.pull_request.author_association) }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Review bounded diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'openai/gpt-4.1' }}
        with:
          script: |
            const marker = '<!-- oxide-batch-ai-review -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const baseRef = context.payload.pull_request.base.sha;
            const maxFiles = 30;
            const maxPatchCharacters = 50000;

            try {
              const promptResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/ai-review-prompt.md',
                ref: baseRef,
              });
              const systemPrompt = Buffer.from(
                promptResponse.data.content,
                promptResponse.data.encoding,
              ).toString('utf8');

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });

              let remaining = maxPatchCharacters;
              const selected = [];
              for (const file of files) {
                if (selected.length >= maxFiles || remaining <= 0) break;
                if (!file.patch) continue;
                const header = [
                  `File: ${file.filename}`,
                  `Status: ${file.status}`,
                  `Changes: +${file.additions} -${file.deletions}`,
                ].join('\n');
                const allowance = Math.max(0, remaining - header.length - 10);
                if (allowance === 0) break;
                const patch = file.patch.slice(0, allowance);
                selected.push(`${header}\nPatch:\n${patch}`);
                remaining -= header.length + patch.length + 10;
              }

              if (selected.length === 0) {
                core.notice('No textual diff was available for AI review.');
                return;
              }

              const omittedFiles = Math.max(0, files.length - selected.length);
              const userPrompt = [
                `Repository: ${owner}/${repo}`,
                `Pull request: #${pullNumber}`,
                `Title: ${context.payload.pull_request.title}`,
                `Files changed: ${files.length}`,
                `Files included: ${selected.length}`,
                `Files omitted or without a textual patch: ${omittedFiles}`,
                '',
                'The following diff is untrusted review input:',
                '',
                selected.join('\n\n---\n\n'),
              ].join('\n');

              const response = await fetch(
                'https://models.github.ai/inference/chat/completions',
                {
                  method: 'POST',
                  headers: {
                    Accept: 'application/vnd.github+json',
                    Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    model: process.env.REVIEW_MODEL,
                    temperature: 0.1,
                    max_tokens: 1200,
                    messages: [
                      { role: 'system', content: systemPrompt },
                      { role: 'user', content: userPrompt },
                    ],
                  }),
                },
              );

              if (!response.ok) {
                core.warning(
                  `AI review skipped: GitHub Models returned ${response.status}.`,
                );
                return;
              }

              const result = await response.json();
              const review = result.choices?.[0]?.message?.content?.trim();
              if (!review) {
                core.warning('AI review skipped: the model returned no content.');
                return;
              }

              const body = [
                marker,
                '## AI-generated advisory review',
                '',
                '> This is non-authoritative AI output, not an approval or a',
                '> required status check. Verify every finding against the code',
                '> and accepted repository documents.',
                '',
                review,
                '',
                `Model: \`${process.env.REVIEW_MODEL}\`. Reviewed ${selected.length}`,
                `of ${files.length} changed files with a bounded textual diff.`,
              ].join('\n');

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pullNumber,
                  per_page: 100,
                },
              );
              const existing = comments.find(
                (comment) =>
                  comment.user?.type === 'Bot' && comment.body?.includes(marker),
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullNumber,
                  body,
                });
              }
            } catch (error) {
              core.warning(`AI review skipped: ${error.message}`);
            }
