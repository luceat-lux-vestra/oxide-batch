name: PR270 evidence promotion

on:
  push:
    branches:
      - issue-265-nested-job-durable-linkage
    paths:
      - .github/workflows/pr270-evidence-promotion.yml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    if: github.repository == 'luceat-lux-vestra/oxide-batch'
    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Verify bootstrap parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f2b2658d6e043f62081eb6ef5ae9965d1ce1f7d8"

      - name: Re-verify and promote exact producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          producer_head = "f2b2658d6e043f62081eb6ef5ae9965d1ce1f7d8"
          expected_execution_commit = "43d9c4392cace8f3fd1201670c9ba25b36c7b04f"
          manifest = json.loads(r'''[{"report":"cancellation-campaign-postgres-15.json","milestone":"m5","inner":"cancellation-campaign.json","run_id":34746342757,"workflow":"M5 Cancellation","workflow_file":".github/workflows/m5-cancellation.yml","job_id":103694864332,"job_name":"postgres-15-cancellation-campaign","artifact_id":10314600682,"artifact_name":"cancellation-campaign-postgres-15","digest":"sha256:5a6d3ec94af0c404a033e3e5324b00faa25f58051dc0dab0e095fcf82da2456e","size":5740},{"report":"cancellation-campaign-postgres-18.json","milestone":"m5","inner":"cancellation-campaign.json","run_id":34746342757,"workflow":"M5 Cancellation","workflow_file":".github/workflows/m5-cancellation.yml","job_id":103694864281,"job_name":"postgres-18-cancellation-campaign","artifact_id":10313843326,"artifact_name":"cancellation-campaign-postgres-18","digest":"sha256:70b978ef0d18726717c7dd86b24e0b8ea5b930aa4db70d816b0e4dd956df3c1c","size":5750},{"report":"conformance-campaign-postgres-15.json","milestone":"m5","inner":"conformance-campaign.json","run_id":34746342833,"workflow":"M5 Conformance","workflow_file":".github/workflows/m5-conformance.yml","job_id":103694864474,"job_name":"postgres-15-conformance-campaign","artifact_id":10314422021,"artifact_name":"conformance-campaign-postgres-15","digest":"sha256:100ddbf2721821aa13d939ce3f2b039b34adeecb68097d24056c903bcdaa8aff","size":7134},{"report":"conformance-campaign-postgres-18.json","milestone":"m5","inner":"conformance-campaign.json","run_id":34746342833,"workflow":"M5 Conformance","workflow_file":".github/workflows/m5-conformance.yml","job_id":103694864563,"job_name":"postgres-18-conformance-campaign","artifact_id":10314750518,"artifact_name":"conformance-campaign-postgres-18","digest":"sha256:1e7ff72ef6827fd8007501f372c53fa36975b93d2fd39ec5de00f3da68fda67b","size":7134},{"report":"crash-restore-campaign-postgres-15.json","milestone":"m5","inner":"crash-restore-campaign.json","run_id":34746342759,"workflow":"M5 Crash and Restore","workflow_file":".github/workflows/m5-crash-restore.yml","job_id":103694864469,"job_name":"postgres-15-crash-restore-campaign","artifact_id":10314715455,"artifact_name":"crash-restore-campaign-postgres-15","digest":"sha256:47c392247af6cfdc5dbe3cb2f555c6405a8eef1499f79f12e5cc780f24fb3f2e","size":6688},{"report":"crash-restore-campaign-postgres-18.json","milestone":"m5","inner":"crash-restore-campaign.json","run_id":34746342759,"workflow":"M5 Crash and Restore","workflow_file":".github/workflows/m5-crash-restore.yml","job_id":103694864408,"job_name":"postgres-18-crash-restore-campaign","artifact_id":10314092714,"artifact_name":"crash-restore-campaign-postgres-18","digest":"sha256:230c400b2de24e59defa6255b53c9b2e3d81c77950be891d6bb609326d746d5d","size":6679},{"report":"performance-campaign-postgres-15.json","milestone":"m5","inner":"performance-campaign.json","run_id":34746342789,"workflow":"M5 Performance","workflow_file":".github/workflows/m5-performance.yml","job_id":103694864663,"job_name":"postgres-15-performance-campaign","artifact_id":10314047754,"artifact_name":"performance-campaign-postgres-15","digest":"sha256:9f16aff3e6815f46e3258316a37e82202a24a916655d3f37cf5473484cd58eb3","size":6606},{"report":"performance-campaign-postgres-18.json","milestone":"m5","inner":"performance-campaign.json","run_id":34746342789,"workflow":"M5 Performance","workflow_file":".github/workflows/m5-performance.yml","job_id":103694864560,"job_name":"postgres-18-performance-campaign","artifact_id":10313907977,"artifact_name":"performance-campaign-postgres-18","digest":"sha256:38f9ab3018c28db64aab8fef146fe9603d7ffecc8ba9556fc7158b3dccc40cbd","size":6607},{"report":"resource-bounds-campaign-postgres-15.json","milestone":"m5","inner":"resource-bounds-campaign.json","run_id":34746342808,"workflow":"M5 Resource Bounds","workflow_file":".github/workflows/m5-resource-bounds.yml","job_id":103694864705,"job_name":"postgres-15-resource-bounds-campaign","artifact_id":10313743710,"artifact_name":"resource-bounds-campaign-postgres-15","digest":"sha256:ad26c0b9efcd2b2331e0ce0bd8c254274e7b9e781e6acb16826d4e207fa618ea","size":14183},{"report":"resource-bounds-campaign-postgres-18.json","milestone":"m5","inner":"resource-bounds-campaign.json","run_id":34746342808,"workflow":"M5 Resource Bounds","workflow_file":".github/workflows/m5-resource-bounds.yml","job_id":103694864589,"job_name":"postgres-18-resource-bounds-campaign","artifact_id":10314471700,"artifact_name":"resource-bounds-campaign-postgres-18","digest":"sha256:f2d7991cc2b52ade757ac55320a66ab290547e2200bcfd9506ecf14ca80ff76e","size":14182},{"report":"security-campaign-postgres-15.json","milestone":"m5","inner":"security-campaign.json","run_id":34746342783,"workflow":"M5 Security","workflow_file":".github/workflows/m5-security.yml","job_id":103694864437,"job_name":"postgres-15-security-campaign","artifact_id":10314550914,"artifact_name":"security-campaign-postgres-15","digest":"sha256:027f3eafd2b1455528ada4894527d515684e185313eefdd18097fdd9ca206324","size":7580},{"report":"security-campaign-postgres-18.json","milestone":"m5","inner":"security-campaign.json","run_id":34746342783,"workflow":"M5 Security","workflow_file":".github/workflows/m5-security.yml","job_id":103694864345,"job_name":"postgres-18-security-campaign","artifact_id":10314545843,"artifact_name":"security-campaign-postgres-18","digest":"sha256:d237be0e1d527df1e6b2589a471a7a82a9ead65e1b04ac3a9a42b7fcc406a0d4","size":7579},{"report":"soak-campaign-postgres-15.json","milestone":"m5","inner":"soak-campaign.json","run_id":34746342794,"workflow":"M5 Soak","workflow_file":".github/workflows/m5-soak.yml","job_id":103694864675,"job_name":"postgres-15-soak-campaign","artifact_id":10314342370,"artifact_name":"soak-campaign-postgres-15","digest":"sha256:5d4bb9ec24b914c447a03306e81c4d383f44ad234bcc2b763b417d6c43745ec3","size":88811},{"report":"soak-campaign-postgres-18.json","milestone":"m5","inner":"soak-campaign.json","run_id":34746342794,"workflow":"M5 Soak","workflow_file":".github/workflows/m5-soak.yml","job_id":103694864562,"job_name":"postgres-18-soak-campaign","artifact_id":10313958076,"artifact_name":"soak-campaign-postgres-18","digest":"sha256:65c52b37be56b6eb52631e16dc577a12b4de2ad9084d414b91b45c10b787a60d","size":88851},{"report":"upgrade-campaign-postgres-15.json","milestone":"m5","inner":"upgrade-campaign.json","run_id":34746342752,"workflow":"M5 Upgrade","workflow_file":".github/workflows/m5-upgrade.yml","job_id":103694864607,"job_name":"postgres-15-upgrade-campaign","artifact_id":10314267277,"artifact_name":"upgrade-campaign-postgres-15","digest":"sha256:c812891ff99358b3e031777b5a17d8dde612b3fef4f69f2ec05dbd309c88bb60","size":5758},{"report":"upgrade-campaign-postgres-18.json","milestone":"m5","inner":"upgrade-campaign.json","run_id":34746342752,"workflow":"M5 Upgrade","workflow_file":".github/workflows/m5-upgrade.yml","job_id":103694864457,"job_name":"postgres-18-upgrade-campaign","artifact_id":10314077677,"artifact_name":"upgrade-campaign-postgres-18","digest":"sha256:bb8eca45b690f453aef82c0c0506a0041f2a429c36f3d9e2b4a1c2617a8402d1","size":5755},{"report":"gate-b-campaign-postgres-15.json","milestone":"m6","inner":"gate-b-campaign.json","run_id":34746342777,"workflow":"M6 Gate B Transaction/Restart Equivalence","workflow_file":".github/workflows/m6-gate-b.yml","job_id":103694864498,"job_name":"postgres-15-gate-b-campaign","artifact_id":10314850211,"artifact_name":"gate-b-campaign-postgres-15","digest":"sha256:da255434143cd3146b789dcf22bb828fa3e246d0b7df74b957f2b5fbcb95ece6","size":2334},{"report":"gate-b-campaign-postgres-18.json","milestone":"m6","inner":"gate-b-campaign.json","run_id":34746342777,"workflow":"M6 Gate B Transaction/Restart Equivalence","workflow_file":".github/workflows/m6-gate-b.yml","job_id":103694864577,"job_name":"postgres-18-gate-b-campaign","artifact_id":10314740446,"artifact_name":"gate-b-campaign-postgres-18","digest":"sha256:0fc8dba2832e6e902f6d41e735cf510750b1cf6383112a319e81573ef9683f58","size":2334},{"report":"gate-h-campaign.json","milestone":"m6","inner":"gate-h-campaign.json","run_id":34746342776,"workflow":"M6 Gate H P-002 Performance","workflow_file":".github/workflows/m6-gate-h.yml","job_id":103694864340,"job_name":"gate-h-campaign","artifact_id":10314022757,"artifact_name":"gate-h-campaign","digest":"sha256:2c7a2ee005bb4b25af9fc68c8bb8f0a92bae5b8e593f63bb23660004461c2758","size":3133},{"report":"m6-conformance-campaign-postgres-15.json","milestone":"m6","inner":"m6-conformance-campaign.json","run_id":34746342763,"workflow":"M6 Full Component Conformance","workflow_file":".github/workflows/m6-conformance.yml","job_id":103694864516,"job_name":"postgres-15-m6-conformance","artifact_id":10314422023,"artifact_name":"m6-conformance-campaign-postgres-15","digest":"sha256:391d01c42070d2895ffee142f2a1638c97cb5634c366cf7e8afec851534c1786","size":10428},{"report":"m6-conformance-campaign-postgres-18.json","milestone":"m6","inner":"m6-conformance-campaign.json","run_id":34746342763,"workflow":"M6 Full Component Conformance","workflow_file":".github/workflows/m6-conformance.yml","job_id":103694864325,"job_name":"postgres-18-m6-conformance","artifact_id":10313778456,"artifact_name":"m6-conformance-campaign-postgres-18","digest":"sha256:6a4a8581fc7498951a8ea382f8228ec9d1e265ce2ba4a057f106623140f73c16","size":10428}]''')
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repo}"

          def api_json(path):
              req = urllib.request.Request(
                  api_root + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "oxide-batch-pr270-evidence-promotion",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def api_bytes(path):
              req = urllib.request.Request(
                  api_root + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "oxide-batch-pr270-evidence-promotion",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return response.read()

          def git_blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          provenance = {}
          entries = {}
          for milestone in ("m5", "m6"):
              path = Path(f"docs/engineering/campaigns/{milestone}/evidence-provenance.json")
              document = json.loads(path.read_text())
              provenance[milestone] = (path, document)
              for entry in document["evidence"]:
                  key = (milestone, entry["report"])
                  if key in entries:
                      raise SystemExit(f"duplicate provenance entry: {key}")
                  entries[key] = entry

          expected_inventory = {(item["milestone"], item["report"]) for item in manifest}
          if set(entries) != expected_inventory:
              missing = set(entries) - expected_inventory
              extra = expected_inventory - set(entries)
              raise SystemExit(f"manifest/provenance inventory mismatch missing={missing} extra={extra}")

          verified_at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          for item in manifest:
              entry = entries[(item["milestone"], item["report"])]

              run = api_json(f"/actions/runs/{item['run_id']}")
              assert run["id"] == item["run_id"]
              assert run["name"] == item["workflow"], (run["name"], item["workflow"])
              assert run["path"] == item["workflow_file"], (run["path"], item["workflow_file"])
              assert run["event"] == "pull_request"
              assert run["conclusion"] == "success"
              assert run["run_attempt"] == 1
              assert run["head_sha"] == producer_head, (run["head_sha"], producer_head)

              job = api_json(f"/actions/jobs/{item['job_id']}")
              assert job["id"] == item["job_id"]
              assert job["run_id"] == item["run_id"]
              assert job["name"] == item["job_name"], (job["name"], item["job_name"])
              assert job["status"] == "completed"
              assert job["conclusion"] == "success"

              artifact = api_json(f"/actions/artifacts/{item['artifact_id']}")
              assert artifact["id"] == item["artifact_id"]
              assert artifact["name"] == item["artifact_name"]
              assert artifact["size_in_bytes"] == item["size"]
              assert artifact["digest"] == item["digest"], (artifact["digest"], item["digest"])
              assert not artifact["expired"]
              assert artifact["workflow_run"]["id"] == item["run_id"]
              assert artifact["workflow_run"]["head_sha"] == producer_head

              archive = api_bytes(f"/actions/artifacts/{item['artifact_id']}/zip")
              observed_digest = "sha256:" + hashlib.sha256(archive).hexdigest()
              assert observed_digest == item["digest"], (observed_digest, item["digest"])

              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  names = [name for name in zipped.namelist() if not name.endswith("/")]
                  assert names == [item["inner"]], names
                  report_bytes = zipped.read(item["inner"])

              report = json.loads(report_bytes)
              env = report["environment"]
              assert env["source_commit"] == expected_execution_commit
              assert env["source_tree_clean"] is True
              assert env["matrix"] == entry["matrix_point"]
              assert str(report["postgresql_major_version"]) == entry["postgres_major_version"]
              assert report["passed"] is True
              assert report["violations"] == []

              destination = Path("docs/engineering/campaigns") / item["milestone"] / item["report"]
              destination.write_bytes(report_bytes)
              retained_blob = git_blob(report_bytes)

              producer = entry["producer"]
              producer["execution_commit"] = env["source_commit"]
              producer["branch_head_sha"] = producer_head
              producer["source_tree_clean"] = True
              producer["rustc"] = env["rustc"]
              producer["os"] = env["os"]
              producer["arch"] = env["arch"]

              entry["workflow_run"].update({
                  "workflow": item["workflow"],
                  "workflow_file": item["workflow_file"],
                  "id": item["run_id"],
                  "attempt": 1,
                  "event": "pull_request",
                  "conclusion": "success",
              })
              entry["producing_job"].update({
                  "name": item["job_name"],
                  "id": item["job_id"],
                  "conclusion": "success",
              })
              entry["artifact"].update({
                  "name": item["artifact_name"],
                  "id": item["artifact_id"],
                  "digest": item["digest"],
                  "size_bytes": item["size"],
              })
              entry["retained_report_git_blob"] = retained_blob
              entry["remote_verification"] = {
                  "verified": True,
                  "verified_at": verified_at,
                  "run_id": item["run_id"],
                  "workflow_run_identity": True,
                  "workflow_run_conclusion": True,
                  "producing_job_identity": True,
                  "producing_job_conclusion": True,
                  "artifact_digest": True,
                  "artifact_bytes_match_retained_report": True,
                  "execution_commit_matches_report": True,
                  "note": "PR #270 successful Actions artifact independently fetched through the GitHub API; run/job identity and success, archive SHA-256, exact report bytes, canonical report identity, runtime axis when declared, and execution commit were verified before retention.",
              }

          for path, document in provenance.values():
              path.write_text(json.dumps(document, indent=2, ensure_ascii=False) + "\n")

          print(f"promoted {len(manifest)} reports from exact producer head {producer_head}")
          PY

      - name: Verify promoted retained evidence locally
        shell: bash
        run: |
          set -euo pipefail
          cargo run --package oxide-batch-xtask --bin retained_evidence_policy
          cargo run --package oxide-batch-xtask -- evidence

      - name: Commit promoted evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/engineering/campaigns/m5 docs/engineering/campaigns/m6

          changed="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^docs/engineering/campaigns/(m5|m6)/' || true)"
          test -z "$unexpected" || { echo "unexpected staged paths:"; echo "$unexpected"; exit 1; }

          git commit -m "chore(evidence): promote PR #270 gate artifacts"
          git push origin HEAD:issue-265-nested-job-durable-linkage
