name: PR270 evidence promotion

on:
  push:
    branches:
      - issue-265-nested-job-durable-linkage
    paths:
      - .github/workflows/pr270-evidence-promotion.yml

concurrency:
  group: pr270-evidence-promotion
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-24.04
    if: github.repository == 'luceat-lux-vestra/oxide-batch'
    permissions:
      actions: read # Read exact producer run/job/artifact metadata and artifact bytes.
      contents: write # Push one verified evidence-only promotion commit to this PR branch.
    steps:
      - name: Check out exact bootstrap commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git fetch --no-tags --prune --depth=2 origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git checkout --detach "refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "375c5d29a426dfb441b2f2d6c33f68b2936806de"

      - name: Re-verify and promote exact producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          producer_head = "f2b2658d6e043f62081eb6ef5ae9965d1ce1f7d8"
          expected_execution_commit = "43d9c4392cace8f3fd1201670c9ba25b36c7b04f"
          records = r'''          m5|cancellation-campaign-postgres-15.json|cancellation-campaign.json|34746342757|M5 Cancellation|.github/workflows/m5-cancellation.yml|103694864332|postgres-15-cancellation-campaign|10314600682|cancellation-campaign-postgres-15|sha256:5a6d3ec94af0c404a033e3e5324b00faa25f58051dc0dab0e095fcf82da2456e|5740
          m5|cancellation-campaign-postgres-18.json|cancellation-campaign.json|34746342757|M5 Cancellation|.github/workflows/m5-cancellation.yml|103694864281|postgres-18-cancellation-campaign|10313843326|cancellation-campaign-postgres-18|sha256:70b978ef0d18726717c7dd86b24e0b8ea5b930aa4db70d816b0e4dd956df3c1c|5750
          m5|conformance-campaign-postgres-15.json|conformance-campaign.json|34746342833|M5 Conformance|.github/workflows/m5-conformance.yml|103694864474|postgres-15-conformance-campaign|10314422021|conformance-campaign-postgres-15|sha256:100ddbf2721821aa13d939ce3f2b039b34adeecb68097d24056c903bcdaa8aff|7134
          m5|conformance-campaign-postgres-18.json|conformance-campaign.json|34746342833|M5 Conformance|.github/workflows/m5-conformance.yml|103694864563|postgres-18-conformance-campaign|10314750518|conformance-campaign-postgres-18|sha256:1e7ff72ef6827fd8007501f372c53fa36975b93d2fd39ec5de00f3da68fda67b|7134
          m5|crash-restore-campaign-postgres-15.json|crash-restore-campaign.json|34746342759|M5 Crash and Restore|.github/workflows/m5-crash-restore.yml|103694864469|postgres-15-crash-restore-campaign|10314715455|crash-restore-campaign-postgres-15|sha256:47c392247af6cfdc5dbe3cb2f555c6405a8eef1499f79f12e5cc780f24fb3f2e|6688
          m5|crash-restore-campaign-postgres-18.json|crash-restore-campaign.json|34746342759|M5 Crash and Restore|.github/workflows/m5-crash-restore.yml|103694864408|postgres-18-crash-restore-campaign|10314092714|crash-restore-campaign-postgres-18|sha256:230c400b2de24e59defa6255b53c9b2e3d81c77950be891d6bb609326d746d5d|6679
          m5|performance-campaign-postgres-15.json|performance-campaign.json|34746342789|M5 Performance|.github/workflows/m5-performance.yml|103694864663|postgres-15-performance-campaign|10314047754|performance-campaign-postgres-15|sha256:9f16aff3e6815f46e3258316a37e82202a24a916655d3f37cf5473484cd58eb3|6606
          m5|performance-campaign-postgres-18.json|performance-campaign.json|34746342789|M5 Performance|.github/workflows/m5-performance.yml|103694864560|postgres-18-performance-campaign|10313907977|performance-campaign-postgres-18|sha256:38f9ab3018c28db64aab8fef146fe9603d7ffecc8ba9556fc7158b3dccc40cbd|6607
          m5|resource-bounds-campaign-postgres-15.json|resource-bounds-campaign.json|34746342808|M5 Resource Bounds|.github/workflows/m5-resource-bounds.yml|103694864705|postgres-15-resource-bounds-campaign|10313743710|resource-bounds-campaign-postgres-15|sha256:ad26c0b9efcd2b2331e0ce0bd8c254274e7b9e781e6acb16826d4e207fa618ea|14183
          m5|resource-bounds-campaign-postgres-18.json|resource-bounds-campaign.json|34746342808|M5 Resource Bounds|.github/workflows/m5-resource-bounds.yml|103694864589|postgres-18-resource-bounds-campaign|10314471700|resource-bounds-campaign-postgres-18|sha256:f2d7991cc2b52ade757ac55320a66ab290547e2200bcfd9506ecf14ca80ff76e|14182
          m5|security-campaign-postgres-15.json|security-campaign.json|34746342783|M5 Security|.github/workflows/m5-security.yml|103694864437|postgres-15-security-campaign|10314550914|security-campaign-postgres-15|sha256:027f3eafd2b1455528ada4894527d515684e185313eefdd18097fdd9ca206324|7580
          m5|security-campaign-postgres-18.json|security-campaign.json|34746342783|M5 Security|.github/workflows/m5-security.yml|103694864345|postgres-18-security-campaign|10314545843|security-campaign-postgres-18|sha256:d237be0e1d527df1e6b2589a471a7a82a9ead65e1b04ac3a9a42b7fcc406a0d4|7579
          m5|soak-campaign-postgres-15.json|soak-campaign.json|34746342794|M5 Soak|.github/workflows/m5-soak.yml|103694864675|postgres-15-soak-campaign|10314342370|soak-campaign-postgres-15|sha256:5d4bb9ec24b914c447a03306e81c4d383f44ad234bcc2b763b417d6c43745ec3|88811
          m5|soak-campaign-postgres-18.json|soak-campaign.json|34746342794|M5 Soak|.github/workflows/m5-soak.yml|103694864562|postgres-18-soak-campaign|10313958076|soak-campaign-postgres-18|sha256:65c52b37be56b6eb52631e16dc577a12b4de2ad9084d414b91b45c10b787a60d|88851
          m5|upgrade-campaign-postgres-15.json|upgrade-campaign.json|34746342752|M5 Upgrade|.github/workflows/m5-upgrade.yml|103694864607|postgres-15-upgrade-campaign|10314267277|upgrade-campaign-postgres-15|sha256:c812891ff99358b3e031777b5a17d8dde612b3fef4f69f2ec05dbd309c88bb60|5758
          m5|upgrade-campaign-postgres-18.json|upgrade-campaign.json|34746342752|M5 Upgrade|.github/workflows/m5-upgrade.yml|103694864457|postgres-18-upgrade-campaign|10314077677|upgrade-campaign-postgres-18|sha256:bb8eca45b690f453aef82c0c0506a0041f2a429c36f3d9e2b4a1c2617a8402d1|5755
          m6|gate-b-campaign-postgres-15.json|gate-b-campaign.json|34746342777|M6 Gate B Transaction/Restart Equivalence|.github/workflows/m6-gate-b.yml|103694864498|postgres-15-gate-b-campaign|10314850211|gate-b-campaign-postgres-15|sha256:da255434143cd3146b789dcf22bb828fa3e246d0b7df74b957f2b5fbcb95ece6|2334
          m6|gate-b-campaign-postgres-18.json|gate-b-campaign.json|34746342777|M6 Gate B Transaction/Restart Equivalence|.github/workflows/m6-gate-b.yml|103694864577|postgres-18-gate-b-campaign|10314740446|gate-b-campaign-postgres-18|sha256:0fc8dba2832e6e902f6d41e735cf510750b1cf6383112a319e81573ef9683f58|2334
          m6|gate-h-campaign.json|gate-h-campaign.json|34746342776|M6 Gate H P-002 Performance|.github/workflows/m6-gate-h.yml|103694864340|gate-h-campaign|10314022757|gate-h-campaign|sha256:2c7a2ee005bb4b25af9fc68c8bb8f0a92bae5b8e593f63bb23660004461c2758|3133
          m6|m6-conformance-campaign-postgres-15.json|m6-conformance-campaign.json|34746342763|M6 Full Component Conformance|.github/workflows/m6-conformance.yml|103694864516|postgres-15-m6-conformance|10314422023|m6-conformance-campaign-postgres-15|sha256:391d01c42070d2895ffee142f2a1638c97cb5634c366cf7e8afec851534c1786|10428
          m6|m6-conformance-campaign-postgres-18.json|m6-conformance-campaign.json|34746342763|M6 Full Component Conformance|.github/workflows/m6-conformance.yml|103694864325|postgres-18-m6-conformance|10313778456|m6-conformance-campaign-postgres-18|sha256:6a4a8581fc7498951a8ea382f8228ec9d1e265ce2ba4a057f106623140f73c16|10428'''
          manifest = []
          for line in records.splitlines():
              milestone, report, inner, run_id, workflow, workflow_file, job_id, job_name, artifact_id, artifact_name, digest, size = line.strip().split("|")
              manifest.append({
                  "milestone": milestone,
                  "report": report,
                  "inner": inner,
                  "run_id": int(run_id),
                  "workflow": workflow,
                  "workflow_file": workflow_file,
                  "job_id": int(job_id),
                  "job_name": job_name,
                  "artifact_id": int(artifact_id),
                  "artifact_name": artifact_name,
                  "digest": digest,
                  "size": int(size),
              })

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repo}"

          def request(path):
              return urllib.request.Request(
                  api_root + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "oxide-batch-pr270-evidence-promotion",
                  },
              )

          def api_json(path):
              with urllib.request.urlopen(request(path)) as response:
                  return json.load(response)

          def api_bytes(path):
              with urllib.request.urlopen(request(path)) as response:
                  return response.read()

          def git_blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          provenance = {}
          entries = {}
          for milestone in ("m5", "m6"):
              path = Path(f"docs/engineering/campaigns/{milestone}/evidence-provenance.json")
              document = json.loads(path.read_text())
              provenance[milestone] = (path, document)
              for entry in document["evidence"]:
                  key = (milestone, entry["report"])
                  if key in entries:
                      raise SystemExit(f"duplicate provenance entry: {key}")
                  entries[key] = entry

          expected_inventory = {(item["milestone"], item["report"]) for item in manifest}
          if set(entries) != expected_inventory:
              raise SystemExit(
                  f"manifest/provenance inventory mismatch missing={set(entries) - expected_inventory} "
                  f"extra={expected_inventory - set(entries)}"
              )

          verified_at = (
              datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )

          for item in manifest:
              entry = entries[(item["milestone"], item["report"])]

              run = api_json(f"/actions/runs/{item['run_id']}")
              assert run["id"] == item["run_id"]
              assert run["name"] == item["workflow"]
              assert run["path"] == item["workflow_file"]
              assert run["event"] == "pull_request"
              assert run["conclusion"] == "success"
              assert run["run_attempt"] == 1
              assert run["head_sha"] == producer_head

              job = api_json(f"/actions/jobs/{item['job_id']}")
              assert job["id"] == item["job_id"]
              assert job["run_id"] == item["run_id"]
              assert job["name"] == item["job_name"]
              assert job["status"] == "completed"
              assert job["conclusion"] == "success"

              artifact = api_json(f"/actions/artifacts/{item['artifact_id']}")
              assert artifact["id"] == item["artifact_id"]
              assert artifact["name"] == item["artifact_name"]
              assert artifact["size_in_bytes"] == item["size"]
              assert artifact["digest"] == item["digest"]
              assert not artifact["expired"]
              assert artifact["workflow_run"]["id"] == item["run_id"]
              assert artifact["workflow_run"]["head_sha"] == producer_head

              archive = api_bytes(f"/actions/artifacts/{item['artifact_id']}/zip")
              observed_digest = "sha256:" + hashlib.sha256(archive).hexdigest()
              assert observed_digest == item["digest"]

              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  names = [name for name in zipped.namelist() if not name.endswith("/")]
                  assert names == [item["inner"]], names
                  report_bytes = zipped.read(item["inner"])

              report = json.loads(report_bytes)
              env = report["environment"]
              assert env["source_commit"] == expected_execution_commit
              assert env["source_tree_clean"] is True
              assert env["matrix"] == entry["matrix_point"]
              assert str(report["postgresql_major_version"]) == entry["postgres_major_version"]
              assert report["passed"] is True
              assert report["violations"] == []

              destination = Path("docs/engineering/campaigns") / item["milestone"] / item["report"]
              destination.write_bytes(report_bytes)
              retained_blob = git_blob(report_bytes)

              producer = entry["producer"]
              producer["execution_commit"] = env["source_commit"]
              producer["branch_head_sha"] = producer_head
              producer["source_tree_clean"] = True
              producer["rustc"] = env["rustc"]
              producer["os"] = env["os"]
              producer["arch"] = env["arch"]

              entry["workflow_run"].update({
                  "workflow": item["workflow"],
                  "workflow_file": item["workflow_file"],
                  "id": item["run_id"],
                  "attempt": 1,
                  "event": "pull_request",
                  "conclusion": "success",
              })
              entry["producing_job"].update({
                  "name": item["job_name"],
                  "id": item["job_id"],
                  "conclusion": "success",
              })
              entry["artifact"].update({
                  "name": item["artifact_name"],
                  "id": item["artifact_id"],
                  "digest": item["digest"],
                  "size_bytes": item["size"],
              })
              entry["retained_report_git_blob"] = retained_blob
              entry["remote_verification"] = {
                  "verified": True,
                  "verified_at": verified_at,
                  "run_id": item["run_id"],
                  "workflow_run_identity": True,
                  "workflow_run_conclusion": True,
                  "producing_job_identity": True,
                  "producing_job_conclusion": True,
                  "artifact_digest": True,
                  "artifact_bytes_match_retained_report": True,
                  "execution_commit_matches_report": True,
                  "note": (
                      "PR #270 successful Actions artifact independently fetched through the GitHub API; "
                      "run/job identity and success, archive SHA-256, exact report bytes, canonical report identity, "
                      "runtime axis when declared, and execution commit were verified before retention."
                  ),
              }

          for path, document in provenance.values():
              path.write_text(json.dumps(document, indent=2, ensure_ascii=False) + "\n")

          print(f"promoted {len(manifest)} reports from exact producer head {producer_head}")
          PY

      - name: Verify promoted retained evidence locally
        shell: bash
        run: |
          set -euo pipefail
          cargo run --package oxide-batch-xtask --bin retained_evidence_policy
          cargo run --package oxide-batch-xtask -- evidence

      - name: Commit promoted evidence and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/pr270-evidence-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/engineering/campaigns/m5 docs/engineering/campaigns/m6 .github/workflows/pr270-evidence-promotion.yml

          changed="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^docs/engineering/campaigns/(m5|m6)/|^\.github/workflows/pr270-evidence-promotion\.yml$' || true)"
          test -z "$unexpected" || { echo "unexpected staged paths:"; echo "$unexpected"; exit 1; }
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^docs/engineering/campaigns/')" -eq 23
          test "$(printf '%s\n' "$changed" | grep -c '^\.github/workflows/pr270-evidence-promotion\.yml$')" -eq 1

          git commit -m "chore(evidence): promote PR #270 gate artifacts"
          git push origin HEAD:refs/heads/issue-265-nested-job-durable-linkage
