name: PR132 evidence refresh

on:
  push:
    branches:
      - fix/pr132-evidence-refresh

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refresh retained evidence from already-successful PR producers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request, zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = os.environ['GITHUB_API_URL']
          root = pathlib.Path.cwd()
          out = root / 'docs/engineering/campaigns/m5'
          execution = '977528e1a85332ddc807843c22ffc4592886a049'
          branch_head = '9fc6a3006ef95fc2d50e76799e4060fb8a0f5e87'

          items = [
            ('soak-campaign-postgres-15.json','M5 PostgreSQL soak','M5 Soak','.github/workflows/m5-soak.yml',31981456640,95248844977,'postgres-15-soak-campaign',9272534835,'soak-campaign-postgres-15','acffc7700242dd330b95f85e0198594cc2b361f19f43b5a0510aff55a3366f2b',88193,'15'),
            ('soak-campaign-postgres-18.json','M5 PostgreSQL soak','M5 Soak','.github/workflows/m5-soak.yml',31981456640,95248845086,'postgres-18-soak-campaign',9272533614,'soak-campaign-postgres-18','4637d2862e05ae5681ad550bb32bd33659f744bd419f3693e2bfe3cfdd8dd531',88351,'18'),
            ('cancellation-campaign-postgres-15.json','M5 PostgreSQL cancellation','M5 Cancellation','.github/workflows/m5-cancellation.yml',31981456476,95248843969,'postgres-15-cancellation-campaign',9272484017,'cancellation-campaign-postgres-15','0253c3c7230c76cec05c6e8ebc8ae24b8124263f9570d09664f3ca4491fb49ba',5754,'15'),
            ('cancellation-campaign-postgres-18.json','M5 PostgreSQL cancellation','M5 Cancellation','.github/workflows/m5-cancellation.yml',31981456476,95248844049,'postgres-18-cancellation-campaign',9272484122,'cancellation-campaign-postgres-18','a0ab11920f6a461418f62ff9a57817c5ada68be70ff9a3aa5ab7fadef3852b15',5758,'18'),
            ('performance-campaign-postgres-15.json','M5 PostgreSQL performance','M5 Performance','.github/workflows/m5-performance.yml',31981456588,95248844607,'postgres-15-performance-campaign',9272507072,'performance-campaign-postgres-15','6ee0c1abe450493e1c6e1ef1fbc9a030ff71502eb61a31667ffe091bcccc31ee',6462,'15'),
            ('performance-campaign-postgres-18.json','M5 PostgreSQL performance','M5 Performance','.github/workflows/m5-performance.yml',31981456588,95248844587,'postgres-18-performance-campaign',9272508826,'performance-campaign-postgres-18','ad9420409db6bda80be583ee84f6edae7c18518d0e8525b9bb22bc6b0516a055',6467,'18'),
            ('conformance-campaign-postgres-15.json','M5 PostgreSQL conformance','M5 Conformance','.github/workflows/m5-conformance.yml',31981456650,95248844685,'postgres-15-conformance-campaign',9272499396,'conformance-campaign-postgres-15','86d5e1e5577f0bf2de80120356c0bc04aa62ee49f643496ad04ae3d4283f0a76',7135,'15'),
            ('conformance-campaign-postgres-18.json','M5 PostgreSQL conformance','M5 Conformance','.github/workflows/m5-conformance.yml',31981456650,95248844762,'postgres-18-conformance-campaign',9272502643,'conformance-campaign-postgres-18','33c35d64da8f3a7a674374245ac743932446a03720798fc635daa4b22b0c0592',7135,'18'),
            ('crash-restore-campaign-postgres-15.json','M5 crash and restore','M5 Crash and Restore','.github/workflows/m5-crash-restore.yml',31981456522,95248844445,'postgres-15-crash-restore-campaign',9272481597,'crash-restore-campaign-postgres-15','074272ffd98595084d5e4b6c36f1de7fb76dd1cc88f410647394d816327c27b0',6691,'15'),
            ('crash-restore-campaign-postgres-18.json','M5 crash and restore','M5 Crash and Restore','.github/workflows/m5-crash-restore.yml',31981456522,95248844387,'postgres-18-crash-restore-campaign',9272481817,'crash-restore-campaign-postgres-18','3f77513b46b36eecb3072c4bdabe571d835ae2d38dc1355e23c4a9ef7bc8e5d8',6698,'18'),
            ('upgrade-campaign-postgres-15.json','M5 PostgreSQL upgrade','M5 Upgrade','.github/workflows/m5-upgrade.yml',31981456510,95248844228,'postgres-15-upgrade-campaign',9272486260,'upgrade-campaign-postgres-15','087caa2934295fd3420f4dfd9346fa4279c4849cafb2bc97a56961192dd33917',5170,'15'),
            ('upgrade-campaign-postgres-18.json','M5 PostgreSQL upgrade','M5 Upgrade','.github/workflows/m5-upgrade.yml',31981456510,95248844299,'postgres-18-upgrade-campaign',9272485512,'upgrade-campaign-postgres-18','7ac77c44d59b5a5c923761eb26e4218e1b87e99917fc009843c6f4024fec6efc',5168,'18'),
            ('security-campaign-postgres-15.json','M5 PostgreSQL security','M5 Security','.github/workflows/m5-security.yml',31981456639,95248844787,'postgres-15-security-campaign',9272478665,'security-campaign-postgres-15','e750400ccf994440112351c2498ec901617c4cd789835f1a596ec91efa9a5381',6949,'15'),
            ('security-campaign-postgres-18.json','M5 PostgreSQL security','M5 Security','.github/workflows/m5-security.yml',31981456639,95248844775,'postgres-18-security-campaign',9272480308,'security-campaign-postgres-18','b620de94f443a514794530f26b0f050897834d035ed4ce103be4f2dd7029e0ab',6949,'18'),
          ]

          prov_path = out / 'evidence-provenance.json'
          prov = json.loads(prov_path.read_text())
          by_report = {e['report']: e for e in prov['evidence']}
          opener = urllib.request.build_opener()
          opener.addheaders = [('Authorization', f'Bearer {token}'), ('Accept','application/vnd.github+json')]

          for report,campaign,wf,wffile,run,jobid,jobname,aid,aname,digest,size,pg in items:
            url = f'{api}/repos/{repo}/actions/artifacts/{aid}/zip'
            data = opener.open(url).read()
            got = hashlib.sha256(data).hexdigest()
            if got != digest:
              raise SystemExit(f'{report}: artifact digest {got} != {digest}')
            zpath = root / f'.tmp-{aid}.zip'
            zpath.write_bytes(data)
            with zipfile.ZipFile(zpath) as z:
              names = [n for n in z.namelist() if n.endswith('.json')]
              if len(names) != 1:
                raise SystemExit(f'{report}: expected one JSON in artifact, got {names}')
              body = z.read(names[0])
            zpath.unlink()
            doc = json.loads(body)
            if doc.get('passed') is not True or doc.get('violations') != []:
              raise SystemExit(f'{report}: producer report did not pass cleanly')
            if doc['environment']['source_commit'] != execution:
              raise SystemExit(f'{report}: wrong execution commit')
            if doc['environment']['source_tree_clean'] is not True:
              raise SystemExit(f'{report}: producer tree not clean')
            if doc['environment']['matrix'] != f'postgres-{pg}':
              raise SystemExit(f'{report}: wrong matrix')
            if str(doc.get('postgresql_major_version')) != pg:
              raise SystemExit(f'{report}: wrong PostgreSQL major')

            target = out / report
            target.write_bytes(body)
            blob = subprocess.check_output(['git','hash-object',str(target)], text=True).strip()
            entry = by_report[report]
            entry['producer']['execution_commit'] = execution
            entry['producer']['branch_head_sha'] = branch_head
            entry['producer']['source_tree_clean'] = True
            entry['workflow_run'].update({'workflow':wf,'workflow_file':wffile,'id':run,'attempt':1,'event':'pull_request','conclusion':'success'})
            entry['producing_job'].update({'name':jobname,'id':jobid,'conclusion':'success'})
            entry['artifact'].update({'name':aname,'id':aid,'digest':'sha256:'+digest,'size_bytes':size})
            entry['retained_report_git_blob'] = blob
            entry['remote_verification'] = {
              'verified': True,
              'verified_at': '2026-08-17T21:43:00Z',
              'run_id': run,
              'workflow_run_identity': True,
              'workflow_run_conclusion': True,
              'producing_job_identity': True,
              'producing_job_conclusion': True,
              'artifact_digest': True,
              'artifact_bytes_match_retained_report': True,
              'execution_commit_matches_report': True,
              'note': 'Fresh retention after the Cargo.lock dependency update changed a declared campaign-semantics object. The successful PR producer run and exact producing job were verified through the GitHub Actions API; the artifact ZIP was downloaded by artifact ID, its sha256 matched the API digest, and the extracted report bytes and execution commit were verified before retention.'
            }
            if isinstance(doc.get('postgresql_version'), str):
              entry['server_version'] = doc['postgresql_version']

          prov_path.write_text(json.dumps(prov, indent=2, ensure_ascii=False) + '\n')
          PY

          cargo run --package oxide-batch-xtask -- evidence

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr132-evidence-refresh.yml
          git add docs/engineering/campaigns/m5 .github/workflows/pr132-evidence-refresh.yml
          git commit -m "docs(m5): refresh evidence for dependency lockfile update"
          git push origin HEAD:fix/pr132-evidence-refresh
