    if: >-
      ${{ always() && github.event.pull_request.draft == false && (needs.route.result != 'success' || needs.route.outputs.classification_outcome != 'success' || contains(needs.route.outputs.direct_workflows, '.github/workflows/m5-upgrade.yml')) }}
    uses: ./.github/workflows/m5-upgrade.yml

  m6_conformance:
    needs: route
    if: >-
      ${{ always() && github.event.pull_request.draft == false && (needs.route.result != 'success' || needs.route.outputs.classification_outcome != 'success' || contains(needs.route.outputs.direct_workflows, '.github/workflows/m6-conformance.yml')) }}
    uses: ./.github/workflows/m6-conformance.yml

  m6_gate_b:
    needs: route
    if: >-
      ${{ always() && github.event.pull_request.draft == false && (needs.route.result != 'success' || needs.route.outputs.classification_outcome != 'success' || contains(needs.route.outputs.direct_workflows, '.github/workflows/m6-gate-b.yml')) }}
