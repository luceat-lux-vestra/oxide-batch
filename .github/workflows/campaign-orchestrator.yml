  m6_gate_h:
    needs: route
    if: >-
      ${{ always() && github.event.pull_request.draft == false && (needs.route.result != 'success' || needs.route.outputs.classification_outcome != 'success' || contains(needs.route.outputs.direct_workflows, '.github/workflows/m6-gate-h.yml')) }}
