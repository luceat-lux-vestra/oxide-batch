name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git log -1 --check
          fi

      - name: Show toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Check facade without optional adapters
        run: cargo check -p oxide-batch --no-default-features

      - name: Check operator CLI without optional adapters
        run: cargo check -p oxide-batch-cli --no-default-features --all-targets

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check workspace on minimum supported Rust
        run: cargo +1.95.0 check --workspace --all-targets --all-features --locked

  postgres-spike:
    name: postgres-spike
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_spike"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_SPIKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_spike
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run real-PostgreSQL architecture spike
        run: cargo test -p oxide-batch-m0-spikes --test postgres -- --nocapture --test-threads=1

  postgres-design-gate:
    name: postgres-${{ matrix.postgres }}-design-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17", "18"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run TLS, roles, schema, and restore fixture
        run: ./tests/fixtures/postgres/run-design-gate.sh ${{ matrix.postgres }}

  postgres-repository:
    name: postgres-${{ matrix.postgres }}-repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_repository
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_repository"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_ADMIN_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_repository
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_repository
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply and reapply immutable migrations
        run: >-
          cargo test -p oxide-batch --features postgres
          --test postgres_repository
          migration_is_idempotent_when_migrator_fixture_is_available
          -- --nocapture --test-threads=1

      - name: Run shared PostgreSQL repository contract
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            shared_repository_contract_passes_on_postgres \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            concurrent_launch_creates_single_instance \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            committed_chunk_advances_checkpoint \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            writer_failure_rolls_back_business_and_checkpoint \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            optimistic_conflict_has_one_winner \
            -- --nocapture --test-threads=1

      - name: Run shared PostgreSQL operator, explorer, and retention contract
        run: >-
          cargo test -p oxide-batch --features postgres
          --test postgres_repository
          shared_service_contract_passes_on_postgres
          -- --nocapture --test-threads=1

      - name: Verify durable fault-tolerance state
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            retry_reservation_is_a_durable_compare_and_swap \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            skips_counters_and_fault_state_commit_with_the_chunk \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            corrupt_fault_state_fails_before_component_work \
            -- --nocapture --test-threads=1

      - name: Verify durable flow traversal
        run: >-
          cargo test -p oxide-batch --features postgres
          --test postgres_flow
          -- --nocapture --test-threads=1

      - name: Verify disconnect and schema-version classifications
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            disconnect_during_commit_never_guesses_outcome \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            postgres_chunk_disconnect_is_known_not_committed_before_commit \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            newer_schema_is_rejected_without_guessing_compatibility \
            -- --nocapture --test-threads=1

      - name: Run process-kill crash and restart matrix
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_crash_recovery \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_fault_crash_recovery \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_flow_crash_recovery \
            -- --nocapture --test-threads=1
