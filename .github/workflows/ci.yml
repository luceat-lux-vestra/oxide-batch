name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git log -1 --check
          fi

      - name: Show toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Check facade without optional adapters
        run: cargo check -p oxide-batch --no-default-features

      - name: Check operator CLI without optional adapters
        run: cargo check -p oxide-batch-cli --no-default-features --all-targets

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Check extraction boundaries and workspace cycles
        run: cargo run --package oxide-batch-xtask -- deps

      - name: Inspect the facade surface for disclosed dependencies
        run: cargo run --package oxide-batch-xtask -- surface

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package and dry-run every publishable crate
        run: cargo run --package oxide-batch-xtask -- package

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check workspace on minimum supported Rust
        run: cargo +1.95.0 check --workspace --all-targets --all-features --locked

  postgres-spike:
    name: postgres-spike
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_spike"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_SPIKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_spike
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run real-PostgreSQL architecture spike
        run: cargo test -p oxide-batch-m0-spikes --test postgres -- --nocapture --test-threads=1

  conformance-campaign:
    name: postgres-${{ matrix.postgres }}-conformance-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_campaign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_campaign"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_ADMIN_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_campaign
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_campaign
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_campaign
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the full embedded conformance suite over the accepted scope
        run: cargo run --package oxide-batch-xtask -- conformance

      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/conformance-campaign.json
          if-no-files-found: error

  crash-restore-campaign:
    name: postgres-${{ matrix.postgres }}-crash-restore-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_crash_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_crash_restore"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_ADMIN_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_crash_restore
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_crash_restore
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_crash_restore
      # The backup and restore report creates and drops the database it restores
      # into, which cannot be done from inside that database or from the one
      # being dumped, so it connects through the maintenance database instead.
      OXIDEBATCH_POSTGRES_BACKUP_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the matching PostgreSQL client tools
        # The logical backup is taken with the real pg_dump and loaded with the
        # real pg_restore, so the client must match the matrix point. The runner
        # image ships a different major version and its wrapper would silently
        # select that one, which would make the retained report name a tool the
        # campaign did not intend.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes "postgresql-client-${{ matrix.postgres }}"
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "${GITHUB_PATH}"

      - name: Show the client tools the campaign will use
        run: |
          pg_dump --version
          pg_restore --version

      - name: Run the crash, restart, and logical restore campaign
        run: cargo run --package oxide-batch-xtask -- crash-restore

      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-restore-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/crash-restore-campaign.json
          if-no-files-found: error

  upgrade-campaign:
    name: postgres-${{ matrix.postgres }}-upgrade-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_upgrade"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The campaign never migrates this database. It reads the server, the
      # role, and the connection parameters off it, and creates every database
      # it reports on, because a report that ran against a database something
      # else had already migrated would not be a report about an upgrade.
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_upgrade
      # Creating and dropping a database cannot be done from inside the database
      # being created, dropped, or dumped, so the campaign does it through the
      # maintenance database instead.
      OXIDEBATCH_POSTGRES_BACKUP_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        # The rejection report builds the runtime that shipped against schema 2
        # from the revision before schema 3 was added, so the campaign needs the
        # history that contains it. The default shallow checkout does not have
        # it, and the report fails rather than skipping without it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the matching PostgreSQL client tools
        # The rollback report takes its pre-upgrade backup with the real pg_dump
        # and loads it with the real pg_restore, so the client must match the
        # matrix point. The runner image ships a different major version and its
        # wrapper would silently select that one, which would make the retained
        # report name a tool the campaign did not intend.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes "postgresql-client-${{ matrix.postgres }}"
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "${GITHUB_PATH}"

      - name: Show the client tools the campaign will use
        run: |
          pg_dump --version
          pg_restore --version

      - name: Run the schema upgrade, rejection, and rollback campaign
        run: cargo run --package oxide-batch-xtask -- upgrade

      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/upgrade-campaign.json
          if-no-files-found: error

  security-campaign:
    name: postgres-${{ matrix.postgres }}-security-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    # This job deliberately declares no `services:` block. The campaign needs a
    # server whose certificate was signed by an authority generated for this
    # run, and a service container starts before any step has run and therefore
    # before that certificate exists. The fixture script starts both servers it
    # needs — one with TLS, one without — after generating the material.
    env:
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the TLS, least-privilege, and redaction campaign
        run: ./tests/fixtures/security/provision.sh ${{ matrix.postgres }}

      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/security-campaign.json
          if-no-files-found: error

  resource-bound-campaign:
    name: postgres-${{ matrix.postgres }}-resource-bound-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_resource
        ports:
          - 5432:5432
        # The worker report saturates a partition budget of 64, which needs 65
        # connections plus the parent's own pool and the fixture's. The default
        # of 100 is enough; raising it here would make the campaign prove a
        # ceiling the image does not otherwise offer.
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_resource"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_resource
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_resource
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove every declared ceiling holds and is reached under stress
        run: cargo run --package oxide-batch-xtask -- resource-bounds

      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-bound-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/resource-bounds-campaign.json
          if-no-files-found: error

  soak-campaign:
    name: postgres-${{ matrix.postgres }}-soak-campaign
    runs-on: ubuntu-latest
    # The declared window is 32 warmup and 600 measured cycles, each a launch,
    # a fault, a restart, and a drain. That is minutes rather than seconds, so
    # the ceiling is higher than the other campaigns' — and it is still a
    # ceiling, because a soak that stopped making progress must fail rather
    # than occupy a runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_soak
        ports:
          - 5432:5432
        # The campaign holds one pool of 5 connections for its whole run, which
        # is the derived requirement for a worker budget of 4. The image's
        # default of 100 is ample; raising it would let a checkout leak be
        # absorbed instead of exhausting the pool.
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_soak"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_soak
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_soak
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The workflow provisions and calls; how the campaign is executed lives
      # in the contract beside the campaign, which is inside its semantic
      # closure. Changing the command, the environment, or the database the
      # soak runs against therefore invalidates retained evidence, while
      # adding an unrelated job to this file does not.
      - name: Run the declared P-015 soak window and judge its growth
        run: ./tests/fixtures/soak/run-ci-campaign.sh ${{ matrix.postgres }}

      # Retained on failure as well as on success, and that is the case this
      # exists for: what a failed soak needs is the resource trajectory that
      # led to it, and a job that uploaded only green reports would discard
      # exactly the evidence worth reading.
      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/soak-campaign.json
          if-no-files-found: error

  postgres-design-gate:
    name: postgres-${{ matrix.postgres }}-design-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17", "18"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run TLS, roles, schema, and restore fixture
        run: ./tests/fixtures/postgres/run-design-gate.sh ${{ matrix.postgres }}

  postgres-repository:
    name: postgres-${{ matrix.postgres }}-repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_repository
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_repository"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_ADMIN_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_repository
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_repository
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply and reapply immutable migrations
        run: >-
          cargo test -p oxide-batch --features postgres
          --test postgres_repository
          migration_is_idempotent_when_migrator_fixture_is_available
          -- --nocapture --test-threads=1

      - name: Run shared PostgreSQL repository contract
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            shared_repository_contract_passes_on_postgres \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            concurrent_launch_creates_single_instance \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            committed_chunk_advances_checkpoint \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            writer_failure_rolls_back_business_and_checkpoint \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            optimistic_conflict_has_one_winner \
            -- --nocapture --test-threads=1

      - name: Run shared PostgreSQL operator, explorer, and retention contract
        run: >-
          cargo test -p oxide-batch --features postgres
          --test postgres_repository
          shared_service_contract_passes_on_postgres
          -- --nocapture --test-threads=1

      - name: Verify durable fault-tolerance state
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            retry_reservation_is_a_durable_compare_and_swap \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            skips_counters_and_fault_state_commit_with_the_chunk \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            corrupt_fault_state_fails_before_component_work \
            -- --nocapture --test-threads=1

      - name: Verify durable flow traversal
        run: >-
          cargo test -p oxide-batch --features postgres
          --test postgres_flow
          -- --nocapture --test-threads=1

      - name: Verify disconnect and schema-version classifications
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            disconnect_during_commit_never_guesses_outcome \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            postgres_chunk_disconnect_is_known_not_committed_before_commit \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_repository \
            newer_schema_is_rejected_without_guessing_compatibility \
            -- --nocapture --test-threads=1

      - name: Run process-kill crash and restart matrix
        run: |
          cargo test -p oxide-batch --features postgres \
            --test postgres_crash_recovery \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_fault_crash_recovery \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_flow_crash_recovery \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_local_partition_crash_recovery \
            -- --nocapture --test-threads=1
          cargo test -p oxide-batch --features postgres \
            --test postgres_local_split_crash_recovery \
            -- --nocapture --test-threads=1
