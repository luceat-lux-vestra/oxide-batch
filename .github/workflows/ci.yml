name: Rust
on:
  workflow_call:

permissions:
  actions: read # Needed to inspect the canonical exact-SHA Fast workflow run.
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-fast:
    name: quality-fast-internal
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Verify release CodeQL SARIF and provenance negative controls
        run: |
          python3 .github/scripts/check_codeql_sarif.py --self-test
          python3 .github/scripts/check_release_codeql.py --self-test
          python3 .github/scripts/test_release_codeql_policy.py

      - name: Resolve protected-main compiler cache identity
        id: fast-cache-id
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          toolchain_hash="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
          lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          [[ "$toolchain_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]
          family="oxide-fast-sccache-v1-linux-arm64-${toolchain_hash}"
          lock_prefix="${family}-${lock_hash}-"
          key="${lock_prefix}${BASE_SHA}"
          {
            echo "family=$family"
            echo "lock_prefix=$lock_prefix"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"

      - name: Install verified sccache 0.18.0
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          archive="$RUNNER_TEMP/sccache-v0.18.0-aarch64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v0.18.0"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-aarch64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a  $archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Restore protected-main compiler cache read-only
        id: fast-restore-sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.fast-cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.fast-cache-id.outputs.lock_prefix }}
            ${{ steps.fast-cache-id.outputs.family }}-

      - name: Enable restore-only sccache
        id: fast-enable-sccache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_TERM_COLOR=never"
            echo "SCCACHE_DIR=$RUNNER_TEMP/oxide-fast-sccache"
            echo "SCCACHE_CACHE_SIZE=768M"
            echo "SCCACHE_LOCAL_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
          echo "protected-main cache hit: ${{ steps.fast-restore-sccache.outputs.cache-hit }}"

      - name: Zero compiler cache stats
        run: sccache --zero-stats

      - name: Show toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::too_many_lines

      - name: Run workspace unit tests
        run: cargo test --workspace --all-features --lib

      - name: Verify narrow audit-shape Clippy exceptions
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p oxide-batch-xtask --all-targets --all-features --message-format=json -- \
            -W clippy::too_many_arguments -W clippy::too_many_lines \
            > /tmp/xtask-clippy.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              ("clippy::too_many_arguments", "reconcile_exact_cell"),
              ("clippy::too_many_lines", "reconcile_search_bounded_construction"),
          }
          seen = set()
          source_cache = {}
          for raw in Path('/tmp/xtask-clippy.json').read_text().splitlines():
              try:
                  item = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if item.get('reason') != 'compiler-message':
                  continue
              message = item.get('message') or {}
              code = (message.get('code') or {}).get('code')
              if code not in {'clippy::too_many_arguments', 'clippy::too_many_lines'}:
                  continue
              primary = next((s for s in message.get('spans', []) if s.get('is_primary')), None)
              if primary is None:
                  raise SystemExit(f'{code}: no primary span')
              path = primary['file_name']
              lines = source_cache.setdefault(path, Path(path).read_text().splitlines())
              start = max(0, primary['line_start'] - 2)
              end = min(len(lines), primary['line_end'] + 3)
              context = '\n'.join(lines[start:end])
              names = [
                  name for lint, name in expected
                  if lint == code and f'fn {name}(' in context
              ]
              if len(names) != 1:
                  raise SystemExit(f'unapproved {code} at {path}:{primary["line_start"]}: {context}')
              seen.add((code, names[0]))
          if seen != expected:
              raise SystemExit(f'expected only {sorted(expected)}, observed {sorted(seen)}')
          PY

      - name: Show compiler cache stats
        if: ${{ always() && steps.fast-enable-sccache.outcome == 'success' }}
        continue-on-error: true
        run: sccache --show-stats --stats-format=json

