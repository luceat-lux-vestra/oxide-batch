name: Rust
run-name: pr-authority/rust/pr-${{ inputs.pr_number }}/${{ inputs.head_sha }}/caller-${{ inputs.caller_run_id }}-${{ inputs.caller_run_attempt }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/ci-topology-v7-migration
  workflow_call:
  workflow_dispatch:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      caller_run_id:
        required: true
        type: string
      caller_run_attempt:
        required: true
        type: string

permissions:
  actions: read # Needed to inspect the canonical exact-SHA Fast workflow run.
  contents: read

concurrency:
  group: rust-${{ github.event_name }}-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.caller_run_id || github.ref }}
  cancel-in-progress: true

jobs:
  quality-fast:
    name: quality-fast-internal
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: fast
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          echo "mode=none" >> "$GITHUB_OUTPUT"
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "Fork PR has no trusted base-repository branch Fast run; Final will execute local Fast obligations when needed."
            exit 0
          fi

          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "Fast producer workflow changed on this PR; Final will execute local Fast obligations instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/fast-branch.yml/runs?event=push&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "push")]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Fast workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; classify/remediate it instead of overwriting it in Final."
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Fast run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job="$(jq -c --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name)' <<<"$jobs")"
            job_status="$(jq -r '.status' <<<"$job")"
            job_conclusion="$(jq -r '.conclusion // ""' <<<"$job")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical Fast job for exact HEAD $EXPECTED_SHA is not completed/success (status=$job_status conclusion=$job_conclusion)."
              exit 1
            fi

            step_conclusion() {
              local name="$1"
              local count
              count="$(jq --arg name "$name" '[.steps[] | select(.name == $name)] | length' <<<"$job")"
              if [ "$count" != "1" ]; then
                echo "::error::Canonical Fast job must contain exactly one '$name' step; found $count." >&2
                return 2
              fi
              jq -r --arg name "$name" '.steps[] | select(.name == $name) | (.conclusion // "")' <<<"$job"
            }

            docs_conclusion="$(step_conclusion 'Documentation-only fast path')"
            fmt_conclusion="$(step_conclusion 'Check formatting')"
            clippy_conclusion="$(step_conclusion 'Run Clippy')"
            unit_conclusion="$(step_conclusion 'Run workspace unit tests')"

            if [ "$fmt_conclusion" = "success" ] && [ "$clippy_conclusion" = "success" ] && [ "$unit_conclusion" = "success" ] && [ "$docs_conclusion" = "skipped" ]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "Reusing canonical full Fast evidence for exact HEAD $EXPECTED_SHA."
              exit 0
            fi
            if [ "$docs_conclusion" = "success" ] && [ "$fmt_conclusion" = "skipped" ] && [ "$clippy_conclusion" = "skipped" ] && [ "$unit_conclusion" = "skipped" ]; then
              echo "mode=docs-only" >> "$GITHUB_OUTPUT"
              echo "Canonical Fast evidence for exact HEAD $EXPECTED_SHA is documentation-only; a routed Rust authority will execute its local full Fast obligations."
              exit 0
            fi

            echo "::error::Canonical Fast job for exact HEAD $EXPECTED_SHA has an invalid mixed execution mode (docs=$docs_conclusion fmt=$fmt_conclusion clippy=$clippy_conclusion unit=$unit_conclusion)."
            exit 1
          done
          echo "::error::Timed out waiting for canonical exact-SHA Fast evidence at $EXPECTED_SHA; refusing duplicate fallback on a same-repository PR."
          exit 1
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repo || github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false


      - name: Check diff hygiene
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git log -1 --check
          fi

      - name: Show toolchain
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: rustup show


      - name: Check formatting
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && steps.fast-evidence.outputs.mode != 'full' }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && steps.fast-evidence.outputs.mode != 'full' }}
        run: >-
          cargo clippy --workspace --all-targets --all-features --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::too_many_lines

      - name: Run workspace unit tests
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && steps.fast-evidence.outputs.mode != 'full' }}
        run: cargo test --workspace --all-features --lib

      - name: Verify narrow audit-shape Clippy exceptions
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p oxide-batch-xtask --all-targets --all-features --message-format=json -- \
            -W clippy::too_many_arguments -W clippy::too_many_lines \
            > /tmp/xtask-clippy.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              ("clippy::too_many_arguments", "reconcile_exact_cell"),
              ("clippy::too_many_lines", "reconcile_search_bounded_construction"),
          }
          seen = set()
          source_cache = {}
          for raw in Path('/tmp/xtask-clippy.json').read_text().splitlines():
              try:
                  item = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if item.get('reason') != 'compiler-message':
                  continue
              message = item.get('message') or {}
              code = (message.get('code') or {}).get('code')
              if code not in {'clippy::too_many_arguments', 'clippy::too_many_lines'}:
                  continue
              primary = next((s for s in message.get('spans', []) if s.get('is_primary')), None)
              if primary is None:
                  raise SystemExit(f'{code}: no primary span')
              path = primary['file_name']
              lines = source_cache.setdefault(path, Path(path).read_text().splitlines())
              start = max(0, primary['line_start'] - 2)
              end = min(len(lines), primary['line_end'] + 3)
              context = '\n'.join(lines[start:end])
              names = [
                  name for lint, name in expected
                  if lint == code and f'fn {name}(' in context
              ]
              if len(names) != 1:
                  raise SystemExit(f'unapproved {code} at {path}:{primary["line_start"]}: {context}')
              seen.add((code, names[0]))
          if seen != expected:
              raise SystemExit(f'expected only {sorted(expected)}, observed {sorted(seen)}')
          PY


  quality-integration-0:
    name: quality-integration-0-internal
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repo || github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          persist-credentials: false


      - name: Resolve protected-main compiler cache identity
        id: integration-cache-id
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          toolchain_hash="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
          lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          [[ "$toolchain_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]

          family="oxide-fast-sccache-v1-linux-${toolchain_hash}"
          lock_prefix="${family}-${lock_hash}-"
          key="${lock_prefix}${BASE_SHA}"

          {
            echo "family=${family}"
            echo "lock_prefix=${lock_prefix}"
            echo "key=${key}"
          } >> "$GITHUB_OUTPUT"

      - name: Install verified sccache 0.18.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v0.18.0"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"

          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Restore protected-main compiler cache read-only
        id: integration-restore-sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.integration-cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.integration-cache-id.outputs.lock_prefix }}
            ${{ steps.integration-cache-id.outputs.family }}-

      - name: Enable restore-only sccache
        id: integration-enable-sccache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_TERM_COLOR=never"
            echo "SCCACHE_DIR=$RUNNER_TEMP/oxide-fast-sccache"
            echo "SCCACHE_CACHE_SIZE=768M"
            echo "SCCACHE_LOCAL_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"

          echo "protected-main cache hit: ${{ steps.integration-restore-sccache.outputs.cache-hit }}"

      - name: Zero compiler cache stats
        run: sccache --zero-stats

      - name: Run final-only integration shard 0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/run-integration-shard.py 0 4

      - name: Show integration compiler cache stats
        if: ${{ always() && steps.integration-enable-sccache.outcome == 'success' }}
        continue-on-error: true
        run: sccache --show-stats --stats-format=json

