      - name: Zero compiler cache stats
        run: sccache --zero-stats

      - name: Run final-only integration shard 1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/run-integration-shard.py 1 4

      - name: Show integration compiler cache stats
        if: ${{ always() && steps.integration-enable-sccache.outcome == 'success' }}
