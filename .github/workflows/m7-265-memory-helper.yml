name: M7 265 memory helper

on:
  push:
    branches:
      - issue-265-nested-job-durable-linkage

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-265-nested-job-durable-linkage
          fetch-depth: 0
          persist-credentials: true

      - name: Implement and verify in-memory reference semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          helper = subprocess.check_output(
              ["git", "show", "58559c137b449b2606d27ac78a557d8cef402863:.github/workflows/m7-265-memory-helper.yml"],
              text=True,
          )
          begin = "          python3 - <<'PY'\n"
          end = "          PY\n\n          cargo fmt --all"
          body = helper.split(begin, 1)[1].split(end, 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          first = "                        BatchStatus::Abandoned => {\n                            return Err(RepositoryError::NestedJobStateCorrupt);\n                        }\n                    }\n"
          first_fixed = "                        BatchStatus::Abandoned => {\n                            return Err(RepositoryError::NestedJobStateCorrupt);\n                        }\n                        _ => {\n                            return Err(RepositoryError::NestedJobStateCorrupt);\n                        }\n                    }\n"
          second = "                BatchStatus::Abandoned => {\n                    return Err(RepositoryError::NestedJobStateCorrupt);\n                }\n            };\n"
          second_fixed = "                BatchStatus::Abandoned => {\n                    return Err(RepositoryError::NestedJobStateCorrupt);\n                }\n                _ => {\n                    return Err(RepositoryError::NestedJobStateCorrupt);\n                }\n            };\n"
          if body.count(first) != 1 or body.count(second) != 1:
              raise RuntimeError('expected nested-job BatchStatus match arms were not found')
          body = body.replace(first, first_fixed, 1).replace(second, second_fixed, 1)
          namespace = {}
          exec(compile(body, '<m7-265-memory-helper>', 'exec'), namespace, namespace)
          PY

          cargo fmt --all
          cargo check -p oxide-batch
          cargo clippy -p oxide-batch --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::too_many_lines

      - name: Promote in-memory implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m7-265-memory-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(repository): implement in-memory nested-job linkage"
          git push origin HEAD:issue-265-nested-job-durable-linkage
