name: M7 265 memory helper

on:
  push:
    branches:
      - issue-265-nested-job-durable-linkage

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-265-nested-job-durable-linkage
          fetch-depth: 0
          persist-credentials: true

      - name: Implement in-memory reference semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          path = 'crates/oxide-batch/src/repository/memory.rs'
          replace(
              path,
              '    JobExecution, JobExecutionId, JobExecutionProjection, JobInstance, JobInstanceId,\n    JobInstanceKey, JobInstanceProjection, JobName, LifecycleError, LifecycleTransition,\n',
              '    JobExecution, JobExecutionId, JobExecutionProjection, JobInstance, JobInstanceId,\n    JobInstanceKey, JobInstanceProjection, JobName, JobParameters, LifecycleError,\n    LifecycleTransition,\n',
          )
          replace(
              path,
              '    MAX_PARTITIONS, NodeId, OperationId, OperatorAction, OperatorRecord, OperatorRecordDraft,\n',
              '    MAX_PARTITIONS, NestedJobLink, NestedJobLinkRequest, NestedJobTerminalObservation, NodeId,\n    OperationId, OperatorAction, OperatorRecord, OperatorRecordDraft,\n',
          )
          replace(
              path,
              '                RepositoryCapability::InstanceHolds,\n                RepositoryCapability::OperatorRequests,\n',
              '                RepositoryCapability::InstanceHolds,\n                RepositoryCapability::NestedJobs,\n                RepositoryCapability::OperatorRequests,\n',
          )
          replace(
              path,
              '    job_executions_by_instance: BTreeMap<JobInstanceId, Vec<JobExecutionId>>,\n    step_executions: BTreeMap<StepExecutionId, StepExecution>,\n',
              '    job_executions_by_instance: BTreeMap<JobInstanceId, Vec<JobExecutionId>>,\n    job_parameters: BTreeMap<JobExecutionId, JobParameters>,\n    nested_job_links: BTreeMap<(JobExecutionId, NodeId), NestedJobLink>,\n    nested_job_links_by_instance: BTreeMap<(JobInstanceId, NodeId), Vec<JobExecutionId>>,\n    step_executions: BTreeMap<StepExecutionId, StepExecution>,\n',
          )

          anchor = '    fn create_step_partition_plan<\'a>(\n'
          methods = r'''    fn nested_job_link<'a>(
        &'a mut self,
        parent_job_execution_id: JobExecutionId,
        node_id: &'a NodeId,
    ) -> BoxFuture<'a, Result<Option<NestedJobLink>, RepositoryError>> {
        Box::pin(async move {
            self.instance_for_execution(parent_job_execution_id)?;
            Ok(self
                .staged
                .nested_job_links
                .get(&(parent_job_execution_id, node_id.clone()))
                .cloned())
        })
    }

    fn latest_nested_job_link<'a>(
        &'a mut self,
        parent_job_instance_id: JobInstanceId,
        node_id: &'a NodeId,
    ) -> BoxFuture<'a, Result<Option<NestedJobLink>, RepositoryError>> {
        Box::pin(async move {
            if !self.staged.instances_by_id.contains_key(&parent_job_instance_id) {
                return Err(RepositoryError::JobInstanceNotFound {
                    id: parent_job_instance_id,
                });
            }
            let Some(parent_execution_id) = self
                .staged
                .nested_job_links_by_instance
                .get(&(parent_job_instance_id, node_id.clone()))
                .and_then(|ids| ids.last())
                .copied()
            else {
                return Ok(None);
            };
            self.staged
                .nested_job_links
                .get(&(parent_execution_id, node_id.clone()))
                .cloned()
                .map(Some)
                .ok_or(RepositoryError::NestedJobStateCorrupt)
        })
    }

    fn create_nested_job_link<'a>(
        &'a mut self,
        request: &'a NestedJobLinkRequest,
    ) -> BoxFuture<'a, Result<NestedJobLink, RepositoryError>> {
        Box::pin(async move {
            let parent_instance = self.instance_for_execution(request.parent_job_execution_id())?;
            if parent_instance != request.parent_job_instance_id() {
                return Err(RepositoryError::NestedJobStateCorrupt);
            }
            let link_key = (
                request.parent_job_execution_id(),
                request.node_id().clone(),
            );
            if let Some(existing) = self.staged.nested_job_links.get(&link_key).cloned() {
                let parameters = self
                    .staged
                    .job_parameters
                    .get(&existing.child_job_execution_id())
                    .ok_or(RepositoryError::NestedJobStateCorrupt)?;
                if existing.child_definition() != request.child_definition()
                    || parameters != request.child_parameters()
                {
                    return Err(RepositoryError::NestedJobStateCorrupt);
                }
                return Ok(existing);
            }

            let child_name = request
                .child_definition()
                .job_name()
                .cloned()
                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
            let child_key = JobInstanceKey::new(child_name, request.child_parameters());
            let child_instance = self
                .select_or_create_job_instance(&child_key)
                .await?
                .instance()
                .clone();
            let latest = self.latest_job_execution(child_instance.id())?.cloned();
            let child_execution = match latest {
                None => {
                    self.create_job_execution_with_definition(
                        child_instance.id(),
                        request.child_definition(),
                    )
                    .await?
                }
                Some(latest) => {
                    let definition = self
                        .staged
                        .execution_definitions
                        .get(&latest.id())
                        .ok_or(RepositoryError::NestedJobStateCorrupt)?;
                    if definition != request.child_definition() {
                        return Err(RepositoryError::NestedJobStateCorrupt);
                    }
                    match latest.metadata().status() {
                        BatchStatus::Completed => {
                            let parameters = self
                                .staged
                                .job_parameters
                                .get(&latest.id())
                                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
                            if parameters != request.child_parameters() {
                                return Err(RepositoryError::NestedJobStateCorrupt);
                            }
                            latest
                        }
                        BatchStatus::Failed | BatchStatus::Stopped => {
                            self.create_job_execution_with_definition(
                                child_instance.id(),
                                request.child_definition(),
                            )
                            .await?
                        }
                        BatchStatus::Starting
                        | BatchStatus::Started
                        | BatchStatus::Stopping
                        | BatchStatus::Unknown => {
                            return Err(RepositoryError::NestedJobChildUnresolved {
                                child_execution_id: latest.id(),
                                status: latest.metadata().status(),
                            });
                        }
                        BatchStatus::Abandoned => {
                            return Err(RepositoryError::NestedJobStateCorrupt);
                        }
                    }
                }
            };
            match self.staged.job_parameters.get(&child_execution.id()) {
                Some(existing) if existing != request.child_parameters() => {
                    return Err(RepositoryError::NestedJobStateCorrupt);
                }
                Some(_) => {}
                None => {
                    self.staged
                        .job_parameters
                        .insert(child_execution.id(), request.child_parameters().clone());
                }
            }

            let link = NestedJobLink::new(
                parent_instance,
                request.parent_job_execution_id(),
                request.node_id().clone(),
                request.child_definition().clone(),
                child_instance.id(),
                child_execution.id(),
                request.linked_at(),
                None,
            );
            self.staged.nested_job_links.insert(link_key, link.clone());
            self.staged
                .nested_job_links_by_instance
                .entry((parent_instance, request.node_id().clone()))
                .or_default()
                .push(request.parent_job_execution_id());
            Ok(link)
        })
    }

    fn continue_nested_job_link<'a>(
        &'a mut self,
        parent_job_execution_id: JobExecutionId,
        node_id: &'a NodeId,
        prior_parent_job_execution_id: JobExecutionId,
        linked_at: SystemTime,
    ) -> BoxFuture<'a, Result<NestedJobLink, RepositoryError>> {
        Box::pin(async move {
            let parent_instance = self.instance_for_execution(parent_job_execution_id)?;
            if let Some(existing) = self
                .staged
                .nested_job_links
                .get(&(parent_job_execution_id, node_id.clone()))
                .cloned()
            {
                return Ok(existing);
            }
            let prior = self
                .staged
                .nested_job_links
                .get(&(prior_parent_job_execution_id, node_id.clone()))
                .cloned()
                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
            if prior.parent_job_instance_id() != parent_instance {
                return Err(RepositoryError::NestedJobStateCorrupt);
            }
            let prior_parameters = self
                .staged
                .job_parameters
                .get(&prior.child_job_execution_id())
                .cloned()
                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
            let prior_child = self
                .staged
                .job_executions
                .get(&prior.child_job_execution_id())
                .cloned()
                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
            let child_execution = match prior_child.metadata().status() {
                BatchStatus::Completed => prior_child,
                BatchStatus::Failed | BatchStatus::Stopped => {
                    self.create_job_execution_with_definition(
                        prior.child_job_instance_id(),
                        prior.child_definition(),
                    )
                    .await?
                }
                BatchStatus::Starting
                | BatchStatus::Started
                | BatchStatus::Stopping
                | BatchStatus::Unknown => {
                    return Err(RepositoryError::NestedJobChildUnresolved {
                        child_execution_id: prior_child.id(),
                        status: prior_child.metadata().status(),
                    });
                }
                BatchStatus::Abandoned => {
                    return Err(RepositoryError::NestedJobStateCorrupt);
                }
            };
            match self.staged.job_parameters.get(&child_execution.id()) {
                Some(existing) if existing != &prior_parameters => {
                    return Err(RepositoryError::NestedJobStateCorrupt);
                }
                Some(_) => {}
                None => {
                    self.staged
                        .job_parameters
                        .insert(child_execution.id(), prior_parameters);
                }
            }
            let link = NestedJobLink::new(
                parent_instance,
                parent_job_execution_id,
                node_id.clone(),
                prior.child_definition().clone(),
                prior.child_job_instance_id(),
                child_execution.id(),
                linked_at,
                if child_execution.id() == prior.child_job_execution_id() {
                    prior.terminal().cloned()
                } else {
                    None
                },
            );
            self.staged
                .nested_job_links
                .insert((parent_job_execution_id, node_id.clone()), link.clone());
            self.staged
                .nested_job_links_by_instance
                .entry((parent_instance, node_id.clone()))
                .or_default()
                .push(parent_job_execution_id);
            Ok(link)
        })
    }

    fn nested_job_parameters<'a>(
        &'a mut self,
        parent_job_execution_id: JobExecutionId,
        node_id: &'a NodeId,
    ) -> BoxFuture<'a, Result<JobParameters, RepositoryError>> {
        Box::pin(async move {
            let link = self
                .staged
                .nested_job_links
                .get(&(parent_job_execution_id, node_id.clone()))
                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
            self.staged
                .job_parameters
                .get(&link.child_job_execution_id())
                .cloned()
                .ok_or(RepositoryError::NestedJobStateCorrupt)
        })
    }

    fn job_execution_context(
        &mut self,
        job_execution_id: JobExecutionId,
    ) -> BoxFuture<'_, Result<Option<crate::ExecutionContext>, RepositoryError>> {
        Box::pin(async move {
            self.instance_for_execution(job_execution_id)?;
            Ok(None)
        })
    }

    fn observe_nested_job_terminal<'a>(
        &'a mut self,
        parent_job_execution_id: JobExecutionId,
        node_id: &'a NodeId,
        observed_at: SystemTime,
    ) -> BoxFuture<'a, Result<NestedJobLink, RepositoryError>> {
        Box::pin(async move {
            let key = (parent_job_execution_id, node_id.clone());
            let link = self
                .staged
                .nested_job_links
                .get(&key)
                .cloned()
                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
            let child = self
                .staged
                .job_executions
                .get(&link.child_job_execution_id())
                .ok_or(RepositoryError::NestedJobStateCorrupt)?;
            let status = child.metadata().status();
            if !matches!(
                status,
                BatchStatus::Completed
                    | BatchStatus::Failed
                    | BatchStatus::Stopped
                    | BatchStatus::Unknown
            ) {
                return Err(RepositoryError::NestedJobChildUnresolved {
                    child_execution_id: child.id(),
                    status,
                });
            }
            if let Some(existing) = link.terminal() {
                if existing.status() != status
                    || existing.exit_status() != child.metadata().exit_status()
                {
                    return Err(RepositoryError::NestedJobStateCorrupt);
                }
                return Ok(link);
            }
            let observed = NestedJobTerminalObservation::new(
                status,
                child.metadata().exit_status().clone(),
                observed_at,
            );
            let link = link.with_terminal(observed);
            self.staged.nested_job_links.insert(key, link.clone());
            Ok(link)
        })
    }

'''
          target = Path(path)
          text = target.read_text()
          if text.count(anchor) != 1:
              raise RuntimeError('partition-plan anchor did not match exactly once')
          target.write_text(text.replace(anchor, methods + anchor, 1))
          PY

          cargo fmt --all
          cargo check -p oxide-batch
          cargo clippy -p oxide-batch --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::too_many_lines

      - name: Promote in-memory implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m7-265-memory-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(repository): implement in-memory nested-job linkage"
          git push origin HEAD:issue-265-nested-job-durable-linkage
