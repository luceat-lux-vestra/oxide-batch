name: PR131 close remaining proof gaps

on:
  push:
    branches:
      - fix/pr131-final-closure

permissions:
  contents: write

jobs:
  edit-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/pr131-final-closure
      - name: Apply fail-closed semantic hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          import re

          def text(path): return Path(path).read_text()
          def write(path,s): Path(path).write_text(s)
          def once(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              return s.replace(old,new,1)

          # 1. Scope: repository-connection-capacity is fully proved by its
          # end-to-end derived-capacity + rejected-before-any-durable-write raw detail.
          p='tests/fixtures/resource-bounds/campaign-scope.json'
          s=text(p)
          s=once(s,
              '"proofs": ["derived-capacity", "stress-saturation", "fail-closed-residue"],',
              '"proofs": ["derived-capacity", "stress-saturation"],',
              'connection proof list')
          s=s.replace(' fail-closed-residue is the separate, construction-level refusal — a pool one short of the derivation refused by the in-memory budget constructor itself, distinct from the stress-saturation requirement\'s database-level residue check, which is why this resource carries both.',
                      ' The stress-saturation rejection is itself the fail-closed proof: the runner re-derives required_connections from concurrent_children + parent_connections, requires short_pool to be exactly one less, requires the adapter capacity to equal that short pool, and requires zero durable residue.')
          write(p,s)

          # 2. Worker producer: delete the unrelated synthetic 64-value residue cell;
          # retain only the real end-to-end short-pool observation.
          p='crates/oxide-batch/tests/postgres_resource_bound_workers.rs'
          s=text(p)
          block='''    cells.push(Cell::new(\n        "repository-connection-capacity",\n        "a declared pool one short of the derivation",\n        u64::from(MAX_PARTITION_WORKERS),\n        PartitionBudget::new(MAX_PARTITION_WORKERS, u32::from(MAX_PARTITION_WORKERS)).is_ok(),\n        false,\n    ));\n'''
          s=once(s,block,'','remove synthetic connection residue cell')
          old='''        json!({\n            "resource": self.resource,\n            "case": self.case,\n            "value": self.value,\n            "expected": if self.expected { "accepted" } else { "refused" },\n            "observed": if self.accepted { "accepted" } else { "refused" },\n        })'''
          new='''        let (declared, unit) = match self.resource {\n            "partitions-per-step" => (Some(u64::from(MAX_PARTITIONS)), Some("partitions")),\n            "concurrent-partition-workers" => (Some(u64::from(MAX_PARTITION_WORKERS)), Some("concurrent workers")),\n            "split-branches-per-node" => (Some(MAX_SPLIT_BRANCHES as u64), Some("branches")),\n            "concurrent-split-branches" => (Some(MAX_SPLIT_BRANCHES as u64), Some("concurrent branches")),\n            "steps-per-split-branch" => (Some(MAX_BRANCH_STEPS as u64), Some("steps")),\n            "repository-pool-size" => (Some(1024), Some("connections")),\n            _ => (None, None),\n        };\n        json!({\n            "resource": self.resource,\n            "case": self.case,\n            "declared_ceiling": declared,\n            "unit": unit,\n            "value": self.value,\n            "expected": if self.expected { "accepted" } else { "refused" },\n            "observed": if self.accepted { "accepted" } else { "refused" },\n        })'''
          s=once(s,old,new,'worker cell evidence metadata')
          write(p,s)

          # 3. Query producer: every generic construction cell names its declared bound/unit.
          p='crates/oxide-batch/tests/postgres_resource_bound_queries.rs'
          s=text(p)
          old='''        json!({\n            "resource": self.resource,\n            "case": self.case,\n            "value": self.value,\n            "expected": if self.expected { "accepted" } else { "refused" },\n            "observed": if self.accepted { "accepted" } else { "refused" },\n        })'''
          new='''        let (declared, unit) = match self.resource {\n            "explorer-page-size" => (u64::from(MAX_PAGE_SIZE), "rows"),\n            "explorer-cursor" => (MAX_CURSOR_BYTES as u64, "bytes"),\n            "retention-purge-batch" => (u64::from(MAX_PURGE_BATCH), "candidates"),\n            _ => (0, "unknown"),\n        };\n        json!({\n            "resource": self.resource,\n            "case": self.case,\n            "declared_ceiling": declared,\n            "unit": unit,\n            "value": self.value,\n            "expected": if self.expected { "accepted" } else { "refused" },\n            "observed": if self.accepted { "accepted" } else { "refused" },\n        })'''
          s=once(s,old,new,'query cell evidence metadata')
          write(p,s)

          # 4. Payload producer: generic cells already carry the actual ceiling;
          # supply the dimension unit, including definition-manifest's refused chain in nodes.
          p='crates/oxide-batch/tests/postgres_resource_bound_payloads.rs'
          s=text(p)
          old='''            "declared_ceiling": self.ceiling,\n            "unit": self.unit,'''
          new='''            "declared_ceiling": self.ceiling,\n            "unit": self.unit.or_else(|| match self.resource {\n                "partition-key" | "partition-context" | "retry-cache-bytes" | "ca-certificate" => Some("bytes"),\n                "retry-cache-entries" => Some("unresolved retry keys"),\n                "definition-nodes" => Some("nodes"),\n                "definition-transitions" | "outgoing-transitions-per-node" => Some("transitions"),\n                "definition-manifest" if self.case.contains("one node past") => Some("nodes"),\n                "definition-manifest" => Some("bytes"),\n                "state-upgrade-chain" => Some("upgrade edges"),\n                "item-listeners" => Some("listeners"),\n                _ => None,\n            }),'''
          s=once(s,old,new,'payload cell units')
          write(p,s)

          # 5. Shedding producer: generic cells get the same mandatory metadata.
          p='crates/oxide-batch-cli/tests/m5_resource_bound_shedding.rs'
          s=text(p)
          old='''            "declared_ceiling": self.declared,\n            "unit": self.unit,'''
          new='''            "declared_ceiling": self.declared.or_else(|| match self.resource {\n                "retained-incident-events" => Some(MAX_RETAINED_EVENTS_PER_EXECUTION as u64),\n                "metric-name-allowlist" => Some(MAX_METRIC_NAME_ALLOWLIST as u64),\n                "diagnostic-bundle" => Some(BUNDLE_CEILING as u64),\n                _ => None,\n            }),\n            "unit": self.unit.or_else(|| match self.resource {\n                "retained-incident-events" => Some("events per execution"),\n                "metric-name-allowlist" => Some("names"),\n                "diagnostic-bundle" => Some("bytes"),\n                _ => None,\n            }),'''
          s=once(s,old,new,'shedding generic metadata')
          write(p,s)

          # 6. Independent verifier.
          p='xtask/src/resource_bounds.rs'
          s=text(p)
          # Resource.unit is part of the machine-readable denominator.
          s=once(s,
              '        policy: suite::string(resource, "policy")?,\n        report: suite::string(resource, "report")?,',
              '        policy: suite::string(resource, "policy")?,\n        report: suite::string(resource, "report")?,\n        unit: suite::string(resource, "unit")?,',
              'read resource unit')
          s=once(s,
              '    /// The report that proves it.\n    report: String,\n    /// The declared ceiling, when it is a number.',
              '    /// The report that proves it.\n    report: String,\n    /// Canonical unit the denominator states this resource in.\n    unit: String,\n    /// The declared ceiling, when it is a number.',
              'resource unit field')
          s=once(s,
              '            report: report.to_owned(),\n            ceiling,',
              '            report: report.to_owned(),\n            unit: "units".to_owned(),\n            ceiling,',
              'test resource helper unit')

          # Construction-boundary now uses the same strict declared/unit check as dimensional cells.
          s=s.replace('''        declared,\n        "accepted exactly at it",\n    ));''','''        declared,\n        &resource.unit,\n        "accepted exactly at it",\n    ));''',1)
          s=s.replace('''        declared,\n        &format!("refused at exactly {past}"),\n    ));''','''        declared,\n        &resource.unit,\n        &format!("refused at exactly {past}"),\n    ));''',1)
          old='''            declared,\n            &extra.label,\n        ));'''
          new='''            declared,\n            &resource.unit,\n            &extra.label,\n        ));'''
          s=once(s,old,new,'additional boundary unit')
          old_sig='''fn reconcile_exact_cell(\n    resource: &str,\n    report: &str,\n    cells: &[Value],\n    value: i64,\n    side: &str,\n    declared: i64,\n    label: &str,\n) -> Vec<String> {'''
          new_sig='''fn reconcile_exact_cell(\n    resource: &str,\n    report: &str,\n    cells: &[Value],\n    value: i64,\n    side: &str,\n    declared: i64,\n    unit: &str,\n    label: &str,\n) -> Vec<String> {'''
          s=once(s,old_sig,new_sig,'strict exact cell signature')
          old_body='''        1 => {\n            if let Some(observed) = matches[0].get("declared_ceiling").and_then(Value::as_i64)\n                && observed != declared\n            {\n                violations.push(format!(\n                    "{resource}'s {label} cell in the {report} report recorded a declared \\\n                     ceiling of {observed}, and the denominator declares {declared}",\n                ));\n            }\n        }'''
          new_body='''        1 => {\n            match matches[0].get("declared_ceiling").and_then(Value::as_i64) {\n                Some(observed) if observed != declared => violations.push(format!(\n                    "{resource}'s {label} cell in the {report} report recorded a declared bound of {observed}, and the denominator declares {declared}",\n                )),\n                Some(_) => {}\n                None => violations.push(format!(\n                    "{resource}'s {label} cell in the {report} report recorded no declared bound to check against {declared}",\n                )),\n            }\n            match matches[0].get("unit").and_then(Value::as_str) {\n                Some(observed) if observed != unit => violations.push(format!(\n                    "{resource}'s {label} cell in the {report} report recorded a unit of {observed}, and the denominator declares {unit}",\n                )),\n                Some(_) => {}\n                None => violations.push(format!(\n                    "{resource}'s {label} cell in the {report} report recorded no unit to check against {unit}",\n                )),\n            }\n        }'''
          s=once(s,old_body,new_body,'mandatory generic bound and unit')

          # Any malformed/contradictory raw residue is itself a violation rather than skipped.
          old='''    for cell in cells {\n        let Some(value) = cell.get("value").and_then(Value::as_i64) else {\n            continue;\n        };\n        let Some(side) = cell.get("expected").and_then(Value::as_str) else {\n            continue;\n        };\n        if !allowed'''
          new='''    for cell in cells {\n        let Some(value) = cell.get("value").and_then(Value::as_i64) else {\n            violations.push(format!("the {report} report recorded a malformed construction cell for {resource} with no numeric value"));\n            continue;\n        };\n        let Some(side) = cell.get("expected").and_then(Value::as_str) else {\n            violations.push(format!("the {report} report recorded a malformed construction cell for {resource} with no expected side"));\n            continue;\n        };\n        let Some(observed) = cell.get("observed").and_then(Value::as_str) else {\n            violations.push(format!("the {report} report recorded a malformed construction cell for {resource} with no observed side"));\n            continue;\n        };\n        if cell.get("case").and_then(Value::as_str).is_none() {\n            violations.push(format!("the {report} report recorded a construction cell for {resource} with no boundary case identity"));\n        }\n        if observed != side {\n            violations.push(format!("the {report} report recorded a construction cell for {resource} expected {side} but observed {observed}"));\n        }\n        if !allowed'''
          s=once(s,old,new,'malformed raw cell rejection')

          # Unattributed construction entries are violations too.
          old='''        for entry in constructions {\n            let Some(resource) = entry.get("resource").and_then(Value::as_str) else {\n                continue;\n            };'''
          new='''        for entry in constructions {\n            let Some(resource) = entry.get("resource").and_then(Value::as_str) else {\n                violations.push(format!("{id} recorded a construction cell with no resource identity"));\n                continue;\n            };'''
          s=once(s,old,new,'unattributed raw construction')

          # End-to-end short-pool relation is fully re-derived.
          needle='''    if entry\n        .get("rejections")\n        .and_then(Value::as_i64)\n        .is_none_or(|count| count <= 0)\n    {'''
          insert='''    let children = entry.pointer("/detail/concurrent_children").and_then(Value::as_i64);\n    let required = entry.pointer("/detail/required_connections").and_then(Value::as_i64);\n    let short_pool = entry.pointer("/detail/short_pool").and_then(Value::as_i64);\n    match (children, required, short_pool) {\n        (Some(children), Some(required), Some(short_pool)) => {\n            if children.checked_add(1) != Some(required) {\n                violations.push(format!("{resource} recorded {children} concurrent children but required_connections={required}, not children + 1"));\n            }\n            if required.checked_sub(1) != Some(short_pool) {\n                violations.push(format!("{resource} recorded required_connections={required} but short_pool={short_pool}, not exactly one short"));\n            }\n            if entry.get("connection_capacity").and_then(Value::as_i64) != Some(short_pool) {\n                violations.push(format!("{resource} short-pool evidence does not bind connection_capacity to {short_pool}"));\n            }\n            if entry.pointer("/detail/sufficient_pool").and_then(Value::as_i64) != Some(required) {\n                violations.push(format!("{resource} did not prove a pool of exactly {required} is the sufficient side of the boundary"));\n            }\n        }\n        _ => violations.push(format!("{resource} recorded no complete concurrent_children/required_connections/short_pool derivation")),\n    }\n\n    if entry\n        .get("rejections")\n        .and_then(Value::as_i64)\n        .is_none_or(|count| count <= 0)\n    {'''
          s=once(s,needle,insert,'short-pool derivation')

          # search-bounded-construction: mandatory metadata and resource-specific relations.
          marker='''    if accepted.len() + refused.len() != cells.len() {\n        violations.push(format!(\n            "the {report} report recorded a construction cell for {} that is neither its \\\n             accepted-at-or-under-the-ceiling cell nor its refused cell",\n            resource.name,\n        ));\n    }\n    violations\n}'''
          replacement='''    if accepted.len() + refused.len() != cells.len() {\n        violations.push(format!(\n            "the {report} report recorded a construction cell for {} that is neither its accepted search cell nor its refused search cell",\n            resource.name,\n        ));\n    }\n    if let (Some(accepted), Some(refused)) = (accepted.first(), refused.first()) {\n        for cell in [*accepted, *refused] {\n            if cell.get("declared_ceiling").and_then(Value::as_i64) != Some(declared) {\n                violations.push(format!("{} search evidence does not carry declared_ceiling={declared}", resource.name));\n            }\n            if cell.get("case").and_then(Value::as_str).is_none() {\n                violations.push(format!("{} search evidence carries no case identity", resource.name));\n            }\n        }\n        let accepted_value = accepted.get("value").and_then(Value::as_i64);\n        let refused_value = refused.get("value").and_then(Value::as_i64);\n        let accepted_unit = accepted.get("unit").and_then(Value::as_str);\n        let refused_unit = refused.get("unit").and_then(Value::as_str);\n        match resource.name.as_str() {\n            "retry-cache-bytes" => {\n                if accepted_unit != Some("bytes") || refused_unit != Some("bytes") { violations.push("retry-cache-bytes search cells must both be bytes".to_owned()); }\n                if refused_value != declared.checked_add(1) { violations.push(format!("retry-cache-bytes refusal must be exactly {} bytes", declared + 1)); }\n            }\n            "definition-nodes" => {\n                if accepted_unit != Some("nodes") || refused_unit != Some("nodes") { violations.push("definition-nodes search cells must both be nodes".to_owned()); }\n                if refused_value != declared.checked_add(1) { violations.push(format!("definition-nodes refusal must be exactly {} nodes", declared + 1)); }\n            }\n            "definition-manifest" => {\n                if accepted_unit != Some("bytes") || refused_unit != Some("nodes") { violations.push("definition-manifest must record accepted bytes and refused chain nodes explicitly".to_owned()); }\n                let raw = evidence.reports.get(report);\n                let largest_chain = raw.and_then(|v| v.pointer("/definition_bound/largest_accepted_chain")).and_then(Value::as_i64);\n                let largest_bytes = raw.and_then(|v| v.pointer("/definition_bound/largest_accepted_manifest_bytes")).and_then(Value::as_i64);\n                if accepted_value != largest_bytes { violations.push("definition-manifest accepted cell is not the recorded largest accepted manifest byte count".to_owned()); }\n                if largest_chain.and_then(|v| v.checked_add(1)) != refused_value { violations.push("definition-manifest refused chain is not exactly one node past the largest accepted chain".to_owned()); }\n                if largest_bytes.is_none_or(|v| v > declared) { violations.push("definition-manifest largest accepted manifest does not fit its declared byte ceiling".to_owned()); }\n                if raw.and_then(|v| v.pointer("/definition_bound/binding_bound")).and_then(Value::as_str) != Some("definition-manifest") { violations.push("definition-manifest report does not identify the manifest as the binding bound".to_owned()); }\n            }\n            _ => {}\n        }\n    }\n    violations\n}'''
          s=once(s,marker,replacement,'search proof hardening')

          # Keep the raw reports available for cross-cell relations such as manifest search.
          s=once(s,
              '    /// The construction cells for a resource proved only that way, and the\n    /// report that wrote them.\n    construction: BTreeMap<String, (String, Vec<Value>)>,',
              '    /// The construction cells for a resource proved only that way, and the\n    /// report that wrote them.\n    construction: BTreeMap<String, (String, Vec<Value>)>,\n    /// Complete raw observations by report, for relations spanning more than one cell.\n    reports: BTreeMap<String, Value>,',
              'evidence raw reports field')
          s=once(s,
              '    for (id, observation) in &runs.observations {\n        let numeric = observation',
              '    for (id, observation) in &runs.observations {\n        evidence.reports.insert(id.clone(), observation.clone());\n        let numeric = observation',
              'capture raw reports')

          # Generic valid unit-test fixtures must now satisfy the mandatory metadata contract.
          s=s.replace('{ "resource": "resource-a", "case": "at the ceiling", "value": 10, "expected": "accepted", "observed": "accepted" }',
                      '{ "resource": "resource-a", "case": "at the ceiling", "declared_ceiling": 10, "unit": "units", "value": 10, "expected": "accepted", "observed": "accepted" }')
          s=s.replace('{ "resource": "resource-a", "case": "one past", "value": 11, "expected": "refused", "observed": "refused" }',
                      '{ "resource": "resource-a", "case": "one past", "declared_ceiling": 10, "unit": "units", "value": 11, "expected": "refused", "observed": "refused" }')
          s=s.replace('{ "resource": "resource-b", "case": "at the ceiling", "value": 5, "expected": "accepted", "observed": "accepted" }',
                      '{ "resource": "resource-b", "case": "at the ceiling", "declared_ceiling": 5, "unit": "units", "value": 5, "expected": "accepted", "observed": "accepted" }')
          s=s.replace('{ "resource": "resource-b", "case": "one past", "value": 6, "expected": "refused", "observed": "refused" }',
                      '{ "resource": "resource-b", "case": "one past", "declared_ceiling": 5, "unit": "units", "value": 6, "expected": "refused", "observed": "refused" }')
          write(p,s)
          PY

          cargo fmt --all --check
          cargo test --package oxide-batch-xtask resource_bounds --lib
          rm .github/workflows/pr131-close-gaps.yml
          git add -A
          git commit -m "ci(m5): close resource-bound root proof semantics"
          git push origin HEAD:fix/pr131-final-closure
