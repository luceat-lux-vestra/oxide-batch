name: Research 627 integration topology A4-C3

on:
  push:
    branches: [research/627-integration-reuse]
    paths: [.github/research/627-dispatch.json]

permissions:
  actions: read
  contents: read

concurrency:
  group: research-627-integration-topology-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SCCACHE_VERSION: "0.18.0"
  SCCACHE_SHA256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.plan.outputs.target_sha }}
      variant: ${{ steps.plan.outputs.variant }}
      lane_count: ${{ steps.plan.outputs.lane_count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      target_count: ${{ steps.plan.outputs.target_count }}
      target_digest: ${{ steps.plan.outputs.target_digest }}
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh protected main
        run: git fetch --no-tags origin main
      - name: Resolve dispatch target
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          payload = json.loads(Path(".github/research/627-dispatch.json").read_text())
          target = payload.get("target_sha")
          if not isinstance(target, str) or re.fullmatch(r"[0-9a-f]{40}", target) is None:
              raise SystemExit("dispatch target_sha must be lowercase 40-hex")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"target_sha={target}\n")
          PY
      - name: Check out exact target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.dispatch.outputs.target_sha }}
          path: target-src
          fetch-depth: 1
          persist-credentials: false
      - name: Self-test topology harness
        run: python3 .github/research/627/reuse-harness.py self-test
      - name: Build fail-closed topology plan
        id: plan
        run: |
          python3 .github/research/627/reuse-harness.py plan \
            --harness-root . \
            --target-root target-src \
            --head-sha "$GITHUB_SHA" \
            --dispatch .github/research/627-dispatch.json \
            --out "$RUNNER_TEMP/topology-plan.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain exact topology plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-topology-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/topology-plan.json
          retention-days: 14
          if-no-files-found: error

  workers:
    name: ${{ needs.plan.outputs.variant }} lane ${{ matrix.lane }}
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out exact target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          path: target-src
          fetch-depth: 1
          persist-credentials: false
      - name: Download topology plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-topology-plan-${{ github.run_id }}
          path: research-plan
      - name: Restore protected-main sccache read-only
        uses: ./.github/research/627/setup-sccache
        with:
          target-root: target-src
          target-sha: ${{ needs.plan.outputs.target_sha }}
      - name: Execute exact-cover topology lane
        run: |
          python3 .github/research/627/reuse-harness.py run-lane \
            --plan research-plan/topology-plan.json \
            --target-root target-src \
            --lane "${{ matrix.lane }}" \
            --out "evidence-topology-${{ matrix.lane }}.json"
      - name: Retain topology lane evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-topology-evidence-${{ matrix.lane }}-${{ github.run_id }}
          path: evidence-topology-${{ matrix.lane }}.json
          retention-days: 14
          if-no-files-found: error

  summarize:
    name: topology summary
    if: always() && needs.plan.result == 'success'
    needs: [plan, workers]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download topology plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-topology-plan-${{ github.run_id }}
          path: research-plan
      - name: Download lane evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integration-topology-evidence-*-${{ github.run_id }}
          path: research-evidence
          merge-multiple: true
      - name: Validate exact-cover result
        run: |
          python3 .github/research/627/reuse-harness.py summarize \
            --plan research-plan/topology-plan.json \
            --evidence-dir research-evidence \
            --out topology-summary.json
      - name: Retain topology summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-topology-summary-${{ github.run_id }}
          path: topology-summary.json
          retention-days: 14
          if-no-files-found: error
