name: Research 627 integration shared-target reuse

on:
  push:
    branches: [research/627-integration-reuse]
    paths: [.github/research/627-dispatch.json]

permissions:
  actions: read
  contents: read

concurrency:
  group: research-627-integration-reuse-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SCCACHE_VERSION: "0.18.0"
  SCCACHE_SHA256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a

jobs:
  shared:
    name: shared target concurrent shards
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Refresh protected main
        run: git fetch --no-tags origin main
      - name: Resolve dispatch target
        id: dispatch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          payload=json.loads(Path(".github/research/627-dispatch.json").read_text())
          target=payload.get("target_sha")
          if not isinstance(target,str) or re.fullmatch(r"[0-9a-f]{40}",target) is None:
              raise SystemExit("dispatch target_sha must be lowercase 40-hex")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"target_sha={target}\n")
          PY
      - name: Check out exact target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ steps.dispatch.outputs.target_sha }}", path: target-src, fetch-depth: 1, persist-credentials: false}
      - name: Self-test revised reuse harness
        run: python3 .github/research/627/reuse-harness.py self-test
      - name: Build fail-closed shared-target plan
        id: plan
        run: |
          python3 .github/research/627/reuse-harness.py plan --harness-root . --target-root target-src \
            --head-sha "$GITHUB_SHA" --dispatch .github/research/627-dispatch.json \
            --out "${{ runner.temp }}/reuse-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Retain exact shared-target plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "integration-reuse-plan-${{ github.run_id }}", path: "${{ runner.temp }}/reuse-plan.json", retention-days: 14, if-no-files-found: error}
      - name: Restore protected-main sccache read-only
        uses: ./.github/research/627/setup-sccache
        with: {target-root: target-src, target-sha: "${{ steps.plan.outputs.target_sha }}"}
      - name: Run four production shards concurrently on one shared target directory
        run: |
          python3 .github/research/627/reuse-harness.py shared-run \
            --plan "${{ runner.temp }}/reuse-plan.json" \
            --target-root target-src \
            --out "${{ runner.temp }}/shared-run-summary.json" \
            --log-dir "${{ runner.temp }}/shared-shard-logs"
      - name: Retain shared-target evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "integration-reuse-shared-summary-${{ github.run_id }}"
          path: |
            ${{ runner.temp }}/shared-run-summary.json
            ${{ runner.temp }}/shared-shard-logs/*.log
          retention-days: 14
          if-no-files-found: error
