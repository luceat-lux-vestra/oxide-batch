name: PR 271 state authority bootstrap v2

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

concurrency:
  group: pr271-state-bootstrap-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Patch custom-leaf state authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def insert_before_once(path: str, needle: str, block: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"{path}: expected one insertion point, found {count}: {needle[:80]!r}")
              p.write_text(text.replace(needle, block + needle, 1))

          repo = "crates/oxide-batch-repository/src/repository.rs"
          replace_once(
              repo,
              "    /// Finds a job instance by its canonical identifying key.\n",
              "    /// Commits one bounded custom-leaf execution context by compare-and-swap.\n"
              "    ///\n"
              "    /// Adapters that cannot persist custom-leaf restart state reject the\n"
              "    /// negotiated capability rather than silently dropping the candidate.\n"
              "    fn commit_step_execution_context<'a>(\n"
              "        &'a mut self,\n"
              "        _id: StepExecutionId,\n"
              "        _expected_version: ExecutionVersion,\n"
              "        _context: &'a ExecutionContext,\n"
              "    ) -> BoxFuture<'a, Result<StepExecution, RepositoryError>> {\n"
              "        Box::pin(async {\n"
              "            Err(RepositoryError::UnsupportedCapability {\n"
              "                capability: RepositoryCapability::CustomLeafState,\n"
              "            })\n"
              "        })\n"
              "    }\n\n"
              "    /// Finds a job instance by its canonical identifying key.\n"
          )
          replace_once(
              repo,
              "    /// Durable local partition plans and compare-and-swap results.\n    StepPartitions,\n",
              "    /// Durable local partition plans and compare-and-swap results.\n    StepPartitions,\n"
              "    /// Durable bounded custom-leaf execution-context state.\n    CustomLeafState,\n"
          )
          replace_once(
              repo,
              "            Self::StepPartitions => \"durable step partitions\",\n            Self::NestedJobs => \"nested job linkage\",\n",
              "            Self::StepPartitions => \"durable step partitions\",\n"
              "            Self::CustomLeafState => \"custom leaf state\",\n"
              "            Self::NestedJobs => \"nested job linkage\",\n"
          )

          memory = "crates/oxide-batch/src/repository/memory.rs"
          replace_once(
              memory,
              "    DefinitionUpgrade, DurableStateKind, ExecutionCounts, ExecutionMetadata, ExecutionTimestamps,\n",
              "    DefinitionUpgrade, DurableStateKind, ExecutionContext, ExecutionCounts, ExecutionMetadata,\n"
              "    ExecutionTimestamps,\n"
          )
          replace_once(
              memory,
              "                RepositoryCapability::ExecutionOwnership,\n",
              "                RepositoryCapability::CustomLeafState,\n"
              "                RepositoryCapability::ExecutionOwnership,\n"
          )
          replace_once(
              memory,
              "    step_logical_ids: BTreeMap<StepExecutionId, NodeId>,\n",
              "    step_logical_ids: BTreeMap<StepExecutionId, NodeId>,\n"
              "    step_contexts: BTreeMap<StepExecutionId, ExecutionContext>,\n"
          )
          replace_once(
              memory,
              "                    return Ok(Some(FlowStepState::new(node_id.clone(), execution, None)));\n",
              "                    let context = self.staged.step_contexts.get(step_id).cloned();\n"
              "                    return Ok(Some(FlowStepState::new(\n"
              "                        node_id.clone(),\n"
              "                        execution,\n"
              "                        context,\n"
              "                    )));\n"
          )
          replace_once(
              memory,
              "            let counts = self\n                .latest_flow_step_snapshot(instance_id, node_id)?\n                .map_or_else(ExecutionCounts::default, |state| {\n                    state.execution().metadata().counts()\n                });\n",
              "            let prior = self.latest_flow_step_snapshot(instance_id, node_id)?;\n"
              "            let counts = prior.as_ref().map_or_else(ExecutionCounts::default, |state| {\n"
              "                state.execution().metadata().counts()\n"
              "            });\n"
              "            let inherited_context = prior.and_then(|state| state.context().cloned());\n"
          )
          replace_once(
              memory,
              "            self.staged.step_executions.insert(id, execution.clone());\n            self.staged.step_logical_ids.insert(id, node_id.clone());\n",
              "            self.staged.step_executions.insert(id, execution.clone());\n"
              "            self.staged.step_logical_ids.insert(id, node_id.clone());\n"
              "            if let Some(context) = inherited_context {\n"
              "                self.staged.step_contexts.insert(id, context);\n"
              "            }\n"
          )
          replace_once(
              memory,
              "        self.staged.step_executions.remove(&step_execution_id);\n        self.staged.step_logical_ids.remove(&step_execution_id);\n",
              "        self.staged.step_executions.remove(&step_execution_id);\n"
              "        self.staged.step_logical_ids.remove(&step_execution_id);\n"
              "        self.staged.step_contexts.remove(&step_execution_id);\n"
          )
          insert_before_once(
              memory,
              "    fn find_job_instance<'a>(\n",
              "    fn commit_step_execution_context<'a>(\n"
              "        &'a mut self,\n"
              "        id: StepExecutionId,\n"
              "        expected_version: ExecutionVersion,\n"
              "        context: &'a ExecutionContext,\n"
              "    ) -> BoxFuture<'a, Result<StepExecution, RepositoryError>> {\n"
              "        Box::pin(async move {\n"
              "            let execution = self\n"
              "                .staged\n"
              "                .step_executions\n"
              "                .get(&id)\n"
              "                .cloned()\n"
              "                .ok_or(RepositoryError::StepExecutionNotFound { id })?;\n"
              "            if execution.version() != expected_version {\n"
              "                return Err(RepositoryError::Lifecycle(LifecycleError::StaleVersion {\n"
              "                    expected: expected_version,\n"
              "                    actual: execution.version(),\n"
              "                }));\n"
              "            }\n"
              "            if execution.metadata().status() != BatchStatus::Started {\n"
              "                return Err(RepositoryError::FlowStateCorrupt);\n"
              "            }\n"
              "            let next_version = expected_version.next()?;\n"
              "            let updated = StepExecution::from_snapshot(\n"
              "                execution.id(),\n"
              "                execution.job_execution_id(),\n"
              "                execution.step_name().clone(),\n"
              "                execution.metadata().clone(),\n"
              "                next_version,\n"
              "            );\n"
              "            self.staged.step_executions.insert(id, updated.clone());\n"
              "            self.staged.step_contexts.insert(id, context.clone());\n"
              "            Ok(updated)\n"
              "        })\n"
              "    }\n\n"
          )

          postgres = "crates/oxide-batch/src/repository/postgres.rs"
          replace_once(
              postgres,
              "                RepositoryCapability::ExecutionOwnership,\n",
              "                RepositoryCapability::CustomLeafState,\n"
              "                RepositoryCapability::ExecutionOwnership,\n"
          )
          insert_before_once(
              postgres,
              "    fn find_job_instance<'a>(\n",
              "    fn commit_step_execution_context<'a>(\n"
              "        &'a mut self,\n"
              "        id: StepExecutionId,\n"
              "        expected_version: ExecutionVersion,\n"
              "        context: &'a ExecutionContext,\n"
              "    ) -> BoxFuture<'a, Result<StepExecution, RepositoryError>> {\n"
              "        Box::pin(async move {\n"
              "            let current = self\n"
              "                .step_execution(id)\n"
              "                .await?\n"
              "                .ok_or(RepositoryError::StepExecutionNotFound { id })?;\n"
              "            if current.version() != expected_version {\n"
              "                return Err(RepositoryError::Lifecycle(LifecycleError::StaleVersion {\n"
              "                    expected: expected_version,\n"
              "                    actual: current.version(),\n"
              "                }));\n"
              "            }\n"
              "            if current.metadata().status() != BatchStatus::Started {\n"
              "                return Err(RepositoryError::FlowStateCorrupt);\n"
              "            }\n"
              "            let payload: Value = serde_json::from_slice(\n"
              "                &context.payload_json().map_err(|_| RepositoryError::FlowStateCorrupt)?,\n"
              "            )\n"
              "            .map_err(|_| RepositoryError::FlowStateCorrupt)?;\n"
              "            let next_version = expected_version.next()?;\n"
              "            let updated_at = system_time_millis(self.repository.clock.now())?;\n"
              "            let affected = sqlx::query(\n"
              "                \"UPDATE oxide_batch.ob_step_execution SET \\\n"
              "                 context_format = $1, context_schema = $2, context_schema_version = $3, \\\n"
              "                 context_payload = $4, updated_at = to_timestamp($5::double precision / 1000.0), \\\n"
              "                 version = $6 WHERE id = $7 AND version = $8 AND status = 'STARTED'\",\n"
              "            )\n"
              "            .bind(i16::try_from(context.format_version()).map_err(|_| RepositoryError::FlowStateCorrupt)?)\n"
              "            .bind(context.schema_id().as_str())\n"
              "            .bind(i32::try_from(context.schema_version().get()).map_err(|_| RepositoryError::FlowStateCorrupt)?)\n"
              "            .bind(Json(payload))\n"
              "            .bind(updated_at)\n"
              "            .bind(database_version(next_version)?)\n"
              "            .bind(database_id(id.get(), IdentifierKind::StepExecution)?)\n"
              "            .bind(database_version(expected_version)?)\n"
              "            .execute(&mut **self.transaction()?)\n"
              "            .await\n"
              "            .map_err(|_| RepositoryError::Unavailable)?;\n"
              "            if affected.rows_affected() != 1 {\n"
              "                return Err(self.classify_step_cas(id, expected_version).await);\n"
              "            }\n"
              "            self.step_execution(id)\n"
              "                .await?\n"
              "                .ok_or(RepositoryError::StepExecutionNotFound { id })\n"
              "        })\n"
              "    }\n\n"
          )

          capabilities = "crates/oxide-batch/tests/repository_capabilities.rs"
          replace_once(
              capabilities,
              "fn all_capabilities() -> [RepositoryCapability; 7] {\n",
              "fn all_capabilities() -> [RepositoryCapability; 8] {\n"
          )
          replace_once(
              capabilities,
              "        RepositoryCapability::ExecutionOwnership,\n",
              "        RepositoryCapability::CustomLeafState,\n"
              "        RepositoryCapability::ExecutionOwnership,\n"
          )
          PY

          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo test -p oxide-batch --all-features --test repository
          cargo test -p oxide-batch --all-features --test repository_capabilities

      - name: Remove bootstrap workflow and commit candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/pr271-state-bootstrap-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/oxide-batch-repository/src/repository.rs \
                  crates/oxide-batch/src/repository/memory.rs \
                  crates/oxide-batch/src/repository/postgres.rs \
                  crates/oxide-batch/tests/repository_capabilities.rs \
                  .github/workflows/pr271-state-bootstrap-v2.yml
          git commit -m "feat(flow): add custom-leaf state authority"
          BASIC="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${BASIC}" \
              push origin "HEAD:${GITHUB_REF_NAME}"
