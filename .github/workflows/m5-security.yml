name: M5 Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-campaign:
    name: postgres-${{ matrix.postgres }}-security-campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    # This job deliberately declares no `services:` block. The campaign needs a
    # server whose certificate was signed by an authority generated for this
    # run, and a service container starts before any step has run and therefore
    # before that certificate exists. tests/fixtures/security/provision.sh
    # starts both servers it needs — one with TLS, one without — after
    # generating the material.
    env:
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed if the execution contract drifts
        run: ./tests/fixtures/security/verify-ci-contract.sh .github/workflows/m5-security.yml

      - name: Run the TLS, least-privilege, and redaction campaign
        # matrix.postgres comes only from the checked-in 15/18 matrix above.
        run: ./tests/fixtures/security/provision.sh ${{ matrix.postgres }} # zizmor: ignore[template-injection]

      # Retained on failure as well as on success. A failed security campaign is
      # mostly worth reading for which report, which TLS attempt, which
      # privilege cell, or which surface it lost.
      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/security-campaign.json
          if-no-files-found: error
