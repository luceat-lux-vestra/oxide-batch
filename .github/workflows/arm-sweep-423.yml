name: ARM whole-PR authority sweep 423

on:
  push:
    branches:
      - exp/423-arm-whole-pr-ci
    paths:
      - .github/workflows/arm-sweep-423.yml

concurrency:
  group: arm-sweep-423
  cancel-in-progress: true

jobs:
  dispatch:
    name: dispatch-arm-authorities
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: write # Dispatch only branch-local research authority workflows for this bounded experiment.
      contents: read # Check out and compare the exact reviewed research head.
      pull-requests: read # Resolve exact draft PR identity before dispatch.
    steps:
      - name: Check out exact research head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded research diff
        shell: bash
        env:
          BASE_SHA: 0440e83aadbfede9be9b274129561ea1bbeec79a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          actual="$(
            git diff --name-only "$BASE_SHA..$GITHUB_SHA" | sort
          )"
          expected="$(
            printf '%s\n' \
              .github/workflows/arm-sweep-423.yml \
              .github/workflows/ci.yml \
              .github/workflows/codeql.yml \
              .github/workflows/dependency-review.yml \
              .github/workflows/evidence.yml \
              .github/workflows/fast-branch.yml \
              .github/workflows/pr-ci.yml \
              .github/workflows/sccache-main-prime.yml \
              .github/workflows/supply-chain.yml \
              | sort
          )"
          test "$actual" = "$expected"
          git diff --check "$BASE_SHA..$GITHUB_SHA"

      - name: Resolve exact draft proof PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pulls="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=$OWNER:$BRANCH"
          )"
          test "$(jq 'length' <<<"$pulls")" -eq 1
          pr="$(jq -c '.[0]' <<<"$pulls")"
          jq -e \
            --arg head "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.head.sha == $head and .head.repo.full_name == $repo and .base.repo.full_name == $repo and .draft == true' \
            <<<"$pr" >/dev/null
          {
            echo "number=$(jq -r '.number' <<<"$pr")"
            echo "base_sha=$(jq -r '.base.sha' <<<"$pr")"
            echo "head_sha=$(jq -r '.head.sha' <<<"$pr")"
            echo "head_repo=$(jq -r '.head.repo.full_name' <<<"$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head ARM compiler cache prime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            runs="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/sccache-main-prime.yml/runs?event=push&branch=$BRANCH&per_page=30"
            )"
            latest="$(
              jq -c --arg sha "$GITHUB_SHA" '
                [.workflow_runs[] | select(.head_sha == $sha)]
                | if length == 0 then empty else max_by(.id) end
              ' <<<"$runs"
            )"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "exact-head ARM cache prime succeeded: $(jq -r '.id' <<<"$latest")"
              exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for exact-head ARM cache prime" >&2
          exit 1

      - name: Dispatch branch ARM authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CALLER_RUN_ID: ${{ github.run_id }}
          CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for workflow in \
            ci.yml \
            dependency-review.yml \
            codeql.yml \
            evidence.yml \
            supply-chain.yml
          do
            echo "dispatching $workflow at $BRANCH"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -f ref="$BRANCH" \
              -f "inputs[base_sha]=$BASE_SHA" \
              -f "inputs[head_sha]=$HEAD_SHA" \
              -f "inputs[head_repo]=$HEAD_REPO" \
              -f "inputs[pr_number]=$PR_NUMBER" \
              -f "inputs[caller_run_id]=$CALLER_RUN_ID" \
              -f "inputs[caller_run_attempt]=$CALLER_RUN_ATTEMPT"
          done

      - name: Record dispatch identity
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          echo "ARM_SWEEP_PR=$PR_NUMBER"
          echo "ARM_SWEEP_BASE=$BASE_SHA"
          echo "ARM_SWEEP_HEAD=$HEAD_SHA"
          echo "ARM_SWEEP_CALLER=$GITHUB_RUN_ID"
