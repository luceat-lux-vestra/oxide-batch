name: Temporary retained-evidence finalizer v2

on:
  push:
    branches:
      - security/227-actions-static-audit

permissions:
  contents: read

concurrency:
  group: temporary-evidence-finalizer-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-evidence-blobs-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run finalizer with cross-host credentials stripped by curl
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_EXECUTION_COMMIT: b1dd4f41f4eecc258e2da928c7374d67cbebbfc7
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/temporary-evidence-blob-uploader.yml').read_text()
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'

          import_anchor = 'import urllib.request\n'
          if script.count(import_anchor) != 1:
              raise SystemExit('could not locate the finalizer urllib import exactly once')
          script = script.replace(import_anchor, 'import subprocess\nimport urllib.request\n', 1)

          old = '''def request_bytes(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return response.read()
          '''
          old = textwrap.dedent(old)
          new = '''def request_bytes(url):
              return subprocess.check_output([
                  "curl",
                  "--fail",
                  "--silent",
                  "--show-error",
                  "--location",
                  "--header",
                  "Authorization: Bearer " + token,
                  "--header",
                  "Accept: application/vnd.github+json",
                  "--header",
                  "X-GitHub-Api-Version: 2022-11-28",
                  url,
              ])
          '''
          new = textwrap.dedent(new)
          if script.count(old) != 1:
              raise SystemExit('could not locate request_bytes exactly once')
          script = script.replace(old, new, 1)
          exec(compile(script, '<retained-evidence-finalizer-v2>', 'exec'), {'__name__': '__main__'})
          PY
