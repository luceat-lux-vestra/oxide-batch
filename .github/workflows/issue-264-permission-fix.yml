name: Issue 264 clippy correction

on:
  push:
    branches:
      - issue-264-final-review

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact corrections and run canonical clippy
        shell: bash
        run: |
          set -euo pipefail
          base="427ecbed506557bcb7cc2dd4cb624c0cd2bb7add"
          git reset --hard "$base"
          python3 - <<'PY'
          from pathlib import Path

          advanced = Path('crates/oxide-batch-plan/src/advanced.rs')
          s = advanced.read_text()
          old_import = 'use super::*;\n'
          new_import = '''use super::{
              BTreeMap, BTreeSet, CompiledExecutionPlan, CompiledFlowScope, DefinitionError,
              DefinitionIdentity, DefinitionRevision, Error, ExitCode, FlowGraph, FlowNode, FlowTarget,
              FlowTransition, JobName, NodeId, PlanError, StepNode, TerminalKind, Value,
              MAX_BRANCH_STEPS, MAX_FLOW_COMPOSITION_DEPTH, MAX_NODES, MAX_OUTGOING_TRANSITIONS,
              MAX_SPLIT_BRANCHES, MAX_TRANSITIONS, check_unambiguous, json,
          };
          '''
          if s.count(old_import) != 1:
              raise SystemExit('wildcard import replacement cardinality failure')
          s = s.replace(old_import, new_import)
          old_sig = '''    fn resolve_nested_target(
                  &self,
                  target: FlowTarget,
                  nested_scopes: &BTreeMap<NodeId, CompiledFlowScope>,
              ) -> FlowTarget {
          '''
          new_sig = '''    fn resolve_nested_target(
                  target: FlowTarget,
                  nested_scopes: &BTreeMap<NodeId, CompiledFlowScope>,
              ) -> FlowTarget {
          '''
          if s.count(old_sig) != 1:
              raise SystemExit('resolve_nested_target signature replacement cardinality failure')
          s = s.replace(old_sig, new_sig)
          if s.count('self.resolve_nested_target(') != 2:
              raise SystemExit('resolve_nested_target call replacement cardinality failure')
          s = s.replace('self.resolve_nested_target(', 'Self::resolve_nested_target(')
          advanced.write_text(s)

          lib = Path('crates/oxide-batch-plan/src/lib.rs')
          s = lib.read_text()
          old = '''    /// Iterates executable members in canonical logical-ID order.
              pub fn members(&self) -> impl ExactSizeIterator<Item = &NodeId> {
          '''
          new = '''    /// Iterates executable members in canonical logical-ID order.
              #[must_use]
              pub fn members(&self) -> impl ExactSizeIterator<Item = &NodeId> {
          '''
          if s.count(old) != 1:
              raise SystemExit('members must_use replacement cardinality failure')
          lib.write_text(s.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::too_many_lines
          git diff --check
          git add crates/oxide-batch-plan/src/advanced.rs crates/oxide-batch-plan/src/lib.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(flow): satisfy strict plan lint policy"
          echo "FIX_COMMIT=$(git rev-parse HEAD)"
          echo "FIX_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/issue-264-final-review || true
