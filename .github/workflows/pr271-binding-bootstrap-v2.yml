name: PR 271 custom-leaf binding bootstrap v2

on:
  push:
    branches: [issue-266-custom-leaf-lifecycle]

permissions: {}
concurrency:
  group: pr271-binding-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path); text = p.read_text(); n = text.count(old)
              if n != 1: raise SystemExit(f"{path}: expected 1 match, found {n}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def before(path, needle, block):
              p = Path(path); text = p.read_text(); n = text.count(needle)
              if n != 1: raise SystemExit(f"{path}: expected 1 insertion point, found {n}: {needle[:100]!r}")
              p.write_text(text.replace(needle, block + needle, 1))

          lib = "crates/oxide-batch/src/lib.rs"
          rep(lib, "mod completion;\n", "mod completion;\nmod custom_leaf;\n")
          rep(lib, "pub use diagnostics::{\n", "pub use custom_leaf::{\n    CustomLeafContext, CustomLeafHandler, CustomLeafRegistration, CustomLeafResult,\n};\npub use diagnostics::{\n")
          rep(lib,
              "    CompiledExecutionPlan, CompiledFlowScope, DeciderRevision, DecisionInputVersion, DecisionNode,\n",
              "    CompiledExecutionPlan, CompiledFlowScope, CustomLeafKind, CustomLeafNode, DeciderRevision,\n    DecisionInputVersion, DecisionNode,\n")

          flow = "crates/oxide-batch/src/flow.rs"
          rep(flow,
              "                        matches!(kind, Some(\"step\" | \"partitioned_step\"))\n",
              "                        matches!(kind, Some(\"step\" | \"partitioned_step\" | \"custom_leaf\"))\n")
          rep(flow, "    nested_jobs: BTreeMap<NodeId, NestedJobBinding>,\n",
                    "    nested_jobs: BTreeMap<NodeId, NestedJobBinding>,\n    custom_leaves: BTreeMap<NodeId, crate::CustomLeafRegistration>,\n")
          rep(flow, "            .field(\"nested_job_count\", &self.nested_jobs.len())\n            .finish()\n",
                    "            .field(\"nested_job_count\", &self.nested_jobs.len())\n            .field(\"custom_leaf_count\", &self.custom_leaves.len())\n            .finish()\n")
          rep(flow, "            nested_jobs: BTreeMap::new(),\n",
                    "            nested_jobs: BTreeMap::new(),\n            custom_leaves: BTreeMap::new(),\n")
          before(flow, "    /// Validates that every compiled node has exactly one executable binding.\n",
              "    /// Binds one exact registered handler to a compiled custom-leaf node.\n"
              "    ///\n    /// # Errors\n    ///\n"
              "    /// Rejects a non-custom node, identity/listener mismatch, or duplicate binding.\n"
              "    pub fn with_custom_leaf_registration(\n"
              "        mut self,\n        node_id: NodeId,\n        registration: crate::CustomLeafRegistration,\n"
              "    ) -> Result<Self, FlowJobError> {\n"
              "        let Some(FlowNode::CustomLeaf(compiled)) = self.plan.node(&node_id) else {\n"
              "            return Err(FlowJobError::WrongNodeKind { node: node_id });\n        };\n"
              "        if !custom_leaf_registration_matches(compiled, &registration) {\n"
              "            return Err(FlowJobError::CustomLeafRegistrationMismatch { node: node_id });\n        }\n"
              "        if self.custom_leaves.insert(node_id.clone(), registration).is_some() {\n"
              "            return Err(FlowJobError::DuplicateBinding { node: node_id });\n        }\n"
              "        Ok(self)\n    }\n\n")
          rep(flow,
              "                FlowNode::NestedJob(compiled) => self.nested_jobs.get(id).is_some_and(|binding| {\n                    binding.definition_identity() == compiled.child_definition()\n                }),\n",
              "                FlowNode::NestedJob(compiled) => self.nested_jobs.get(id).is_some_and(|binding| {\n                    binding.definition_identity() == compiled.child_definition()\n                }),\n                FlowNode::CustomLeaf(compiled) => self.custom_leaves.get(id).is_some_and(|registration| {\n                    custom_leaf_registration_matches(compiled, registration)\n                }),\n")
          rep(flow,
              "    /// The bound executable does not match the compiled step declaration.\n    ComponentMismatch {\n",
              "    /// A custom-leaf handler/listener registration does not match its declaration.\n    CustomLeafRegistrationMismatch {\n        /// Mismatched logical custom-leaf node.\n        node: NodeId,\n    },\n    /// The bound executable does not match the compiled step declaration.\n    ComponentMismatch {\n")
          rep(flow, "            Self::ComponentMismatch { node } => write!(\n",
              "            Self::CustomLeafRegistrationMismatch { node } => write!(\n                formatter,\n                \"custom-leaf node {} registration does not match its compiled identity\",\n                node.as_str()\n            ),\n            Self::ComponentMismatch { node } => write!(\n")
          before(flow, "fn split_step<'a>(\n",
              "fn custom_leaf_registration_matches(\n    compiled: &crate::CustomLeafNode,\n    registration: &crate::CustomLeafRegistration,\n) -> bool {\n    compiled.kind() == registration.kind()\n        && compiled.handler_revision() == registration.handler_revision()\n        && compiled.state_schema_id() == registration.state_schema_id()\n        && compiled.state_schema_version() == registration.state_schema_version()\n        && compiled.listener_revisions().len() == registration.listeners().len()\n        && compiled\n            .listener_revisions()\n            .iter()\n            .zip(registration.listeners())\n            .all(|(declared, (registered, _))| declared == registered)\n}\n\n")
          rep(flow, "            FlowNode::NestedJob(_) => Some(RepositoryCapability::NestedJobs),\n",
                    "            FlowNode::NestedJob(_) => Some(RepositoryCapability::NestedJobs),\n            FlowNode::CustomLeaf(_) => Some(RepositoryCapability::CustomLeafState),\n")

          lines = [
              "//! Binding and preflight evidence for registered custom leaves.", "",
              "use std::error::Error;", "use std::sync::Arc;", "",
              "use oxide_batch::{",
              "    BoxFuture, ComponentRevision, CustomLeafContext, CustomLeafHandler, CustomLeafKind,",
              "    CustomLeafNode, CustomLeafRegistration, CustomLeafResult, DefinitionRevision, FlowGraph,",
              "    FlowJob, FlowJobError, FlowNode, FlowTarget, JobName, NodeId, StateSchemaId,",
              "    StateSchemaVersion, StepName, TaskletError, TaskletOutcome, TerminalKind,",
              "};", "", "struct CompleteHandler;", "",
              "impl CustomLeafHandler for CompleteHandler {",
              "    fn execute<'a>(&'a self, _context: CustomLeafContext<'a>) -> BoxFuture<'a, Result<CustomLeafResult, TaskletError>> {",
              "        Box::pin(async { Ok(CustomLeafResult::new(TaskletOutcome::Completed)) })",
              "    }", "}", "",
              "fn plan() -> Result<(JobName, NodeId, oxide_batch::CompiledExecutionPlan), Box<dyn Error>> {",
              "    let name = JobName::new(\"custom-leaf-binding\")?;",
              "    let id = NodeId::new(\"custom\")?;",
              "    let node = CustomLeafNode::new(",
              "        id.clone(), StepName::new(\"custom-step\")?, CustomLeafKind::new(\"example.handler\")?,",
              "        ComponentRevision::new(\"handler-v1\")?, StateSchemaId::new(\"example.state\")?, StateSchemaVersion::new(1)?,",
              "    );",
              "    let compiled = FlowGraph::new(id.clone()).with_node(FlowNode::custom_leaf(node))",
              "        .with_sequence(id.clone(), FlowTarget::Terminal(TerminalKind::Complete))?",
              "        .compile(&name, DefinitionRevision::new(\"v1\")?)?;",
              "    Ok((name, id, compiled))", "}", "",
              "fn registration(revision: &str) -> Result<CustomLeafRegistration, Box<dyn Error>> {",
              "    Ok(CustomLeafRegistration::new(",
              "        CustomLeafKind::new(\"example.handler\")?, ComponentRevision::new(revision)?,",
              "        StateSchemaId::new(\"example.state\")?, StateSchemaVersion::new(1)?, Arc::new(CompleteHandler),",
              "    ))", "}", "",
              "#[test]", "fn exact_custom_leaf_registration_validates() -> Result<(), Box<dyn Error>> {",
              "    let (name, id, compiled) = plan()?;",
              "    FlowJob::new(name, compiled)?.with_custom_leaf_registration(id, registration(\"handler-v1\")?)?.validate()?;",
              "    Ok(())", "}", "",
              "#[test]", "fn custom_leaf_revision_mismatch_fails_closed() -> Result<(), Box<dyn Error>> {",
              "    let (name, id, compiled) = plan()?;",
              "    let error = FlowJob::new(name, compiled)?.with_custom_leaf_registration(id.clone(), registration(\"handler-v2\")?).expect_err(\"revision mismatch must be rejected\");",
              "    assert_eq!(error, FlowJobError::CustomLeafRegistrationMismatch { node: id });",
              "    Ok(())", "}", "",
              "#[test]", "fn missing_custom_leaf_registration_fails_validation() -> Result<(), Box<dyn Error>> {",
              "    let (name, id, compiled) = plan()?;",
              "    assert_eq!(FlowJob::new(name, compiled)?.validate(), Err(FlowJobError::MissingBinding { node: id }));",
              "    Ok(())", "}",
          ]
          Path("crates/oxide-batch/tests/custom_leaf_binding.rs").write_text("\n".join(lines) + "\n")
          PY
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo test -p oxide-batch --all-features --test custom_leaf_binding
      - name: Commit candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/pr271-binding-bootstrap-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/oxide-batch/src/lib.rs crates/oxide-batch/src/flow.rs crates/oxide-batch/tests/custom_leaf_binding.rs .github/workflows/pr271-binding-bootstrap-v2.yml
          git commit -m "feat(flow): bind registered custom leaves"
          BASIC="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${BASIC}" push origin "HEAD:${GITHUB_REF_NAME}"
