name: Supply-chain ARM proof 423

on:
  push:
    branches:
      - exp/423-arm-whole-pr-ci
    paths:
      - .github/workflows/supply-chain-arm-proof-423.yml
      - .github/workflows/supply-chain.yml

permissions:
  contents: read

concurrency:
  group: supply-chain-arm-proof-423-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out exact branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify supply-chain candidate is ARM native
        shell: bash
        run: |
          set -euo pipefail
          grep -F "runs-on: ubuntu-24.04-arm" .github/workflows/supply-chain.yml
          grep -F "cargo-deny-0.20.2-aarch64-unknown-linux-musl.tar.gz" .github/workflows/supply-chain.yml
          ! grep -F "uses: EmbarkStudios/cargo-deny-action@" .github/workflows/supply-chain.yml

      - name: Show repository Rust toolchain
        run: rustup show

      - name: Install cargo-deny 0.20.2 for ARM64
        shell: bash
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-deny"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-aarch64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          chmod +x "$install_dir/cargo-deny"
          "$install_dir/cargo-deny" --version
          echo "CARGO_DENY_BIN=$install_dir/cargo-deny" >> "$GITHUB_ENV"

      - name: Test supply-chain exception policy
        run: python3 .github/scripts/test_validate_supply_chain_exceptions.py

      - name: Validate supply-chain exception registry
        run: python3 .github/scripts/validate_supply_chain_exceptions.py

      - name: Check advisories, licenses, bans, and sources
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_DENY_BIN" --log-level warn --manifest-path ./Cargo.toml --all-features check
