name: PR131 Final Resource Bounds Retention

on:
  push:
    branches:
      - ci/m5-resource-bounds-provenance
    paths:
      - .github/workflows/pr131-retain-final-rb.yml

permissions:
  actions: read
  contents: write

jobs:
  retain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/m5-resource-bounds-provenance
          fetch-depth: 0
      - name: Download, verify, retain, and bind final resource-bounds evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "90fa7d0004f843fee77067c5af49d88200537332"
          gh api repos/luceat-lux-vestra/oxide-batch/actions/artifacts/9316533962/zip > /tmp/pg15.zip
          gh api repos/luceat-lux-vestra/oxide-batch/actions/artifacts/9316535433/zip > /tmp/pg18.zip
          echo '7c75c923129a1454ac753112adc536cab83ef030fb3d5a53227bee2b80623835  /tmp/pg15.zip' | sha256sum -c -
          echo '4b664bd447a5db7784cf718c4850f4fb59c55c1ba12618b9603ff5c3ca6ad6f9  /tmp/pg18.zip' | sha256sum -c -
          rm -rf /tmp/pg15 /tmp/pg18
          mkdir /tmp/pg15 /tmp/pg18
          unzip -q /tmp/pg15.zip -d /tmp/pg15
          unzip -q /tmp/pg18.zip -d /tmp/pg18
          test "$(git hash-object /tmp/pg15/resource-bounds-campaign.json)" = "54c0973bd1c2101f9a40d4483b03634928c71bc6"
          test "$(git hash-object /tmp/pg18/resource-bounds-campaign.json)" = "db682daff3f7dc5deb67a3dd0c39d4d24da21781"
          cp /tmp/pg15/resource-bounds-campaign.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json
          cp /tmp/pg18/resource-bounds-campaign.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('docs/engineering/campaigns/m5/evidence-provenance.json')
          data = json.loads(p.read_text())
          specs = {
              'resource-bounds-campaign-postgres-15.json': {
                  'job_name': 'postgres-15-resource-bounds-campaign', 'job_id': 95643695408,
                  'artifact_name': 'resource-bounds-campaign-postgres-15', 'artifact_id': 9316533962,
                  'digest': 'sha256:7c75c923129a1454ac753112adc536cab83ef030fb3d5a53227bee2b80623835',
                  'size': 13096, 'blob': '54c0973bd1c2101f9a40d4483b03634928c71bc6',
              },
              'resource-bounds-campaign-postgres-18.json': {
                  'job_name': 'postgres-18-resource-bounds-campaign', 'job_id': 95643695406,
                  'artifact_name': 'resource-bounds-campaign-postgres-18', 'artifact_id': 9316535433,
                  'digest': 'sha256:4b664bd447a5db7784cf718c4850f4fb59c55c1ba12618b9603ff5c3ca6ad6f9',
                  'size': 13095, 'blob': 'db682daff3f7dc5deb67a3dd0c39d4d24da21781',
              },
          }
          verified_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          seen = set()
          for entry in data['evidence']:
              spec = specs.get(entry['report'])
              if not spec:
                  continue
              seen.add(entry['report'])
              retained = json.loads(Path('docs/engineering/campaigns/m5/' + entry['report']).read_text())
              assert retained['passed'] is True and retained['violations'] == []
              assert retained['declared_resources'] == 36 and retained['observed_resources'] == 36
              assert retained['environment']['source_commit'] == '2d9ab0ce976535fa3564159f70568c04e346c6a5'
              assert retained['environment']['source_tree_clean'] is True
              entry['server_version'] = retained['postgresql_version']
              entry['producer']['execution_commit'] = '2d9ab0ce976535fa3564159f70568c04e346c6a5'
              entry['producer']['branch_head_sha'] = '90fa7d0004f843fee77067c5af49d88200537332'
              entry['producer']['source_tree_clean'] = True
              entry['workflow_run'].update({'id': 32115407707, 'attempt': 1, 'event': 'pull_request', 'conclusion': 'success'})
              entry['producing_job'].update({'name': spec['job_name'], 'id': spec['job_id'], 'conclusion': 'success'})
              entry['artifact'].update({'name': spec['artifact_name'], 'id': spec['artifact_id'], 'digest': spec['digest'], 'size_bytes': spec['size']})
              entry['retained_report_git_blob'] = spec['blob']
              entry['remote_verification'] = {
                  'verified': True,
                  'verified_at': verified_at,
                  'run_id': 32115407707,
                  'workflow_run_identity': True,
                  'workflow_run_conclusion': True,
                  'producing_job_identity': True,
                  'producing_job_conclusion': True,
                  'artifact_digest': True,
                  'artifact_bytes_match_retained_report': True,
                  'execution_commit_matches_report': True,
                  'note': 'Final lint-clean PR #131 retention. Run, jobs, artifact IDs, API SHA-256 digests, downloaded ZIP hashes, extracted report bytes, retained git blobs, and execution tree were independently verified; both reports bind execution tree 2d9ab0ce to producer branch head 90fa7d00 on main 82f995f6.'
              }
          assert seen == set(specs), seen
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          test "$(git hash-object docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json)" = "54c0973bd1c2101f9a40d4483b03634928c71bc6"
          test "$(git hash-object docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json)" = "db682daff3f7dc5deb67a3dd0c39d4d24da21781"
          cargo run --package oxide-batch-xtask -- evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/engineering/campaigns/m5/evidence-provenance.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json
          git diff --cached --check
          git commit -m 'docs(m5): retain final PR131 resource-bound evidence'
          git push origin HEAD:ci/m5-resource-bounds-provenance
