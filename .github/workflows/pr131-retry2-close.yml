name: PR131 Retry2 Closure Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ci/m5-resource-bounds-provenance
      - name: Apply, format, verify, and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr131-close-gaps.yml').read_text().splitlines()
          marker='        run: |'
          i=src.index(marker)+1
          body=[]
          for line in src[i:]:
              body.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(body)+'\n'
          script=script.replace('cargo fmt --all --check','cargo fmt --all')
          script=script.replace('cargo test --package oxide-batch-xtask resource_bounds --lib','cargo test -p oxide-batch-xtask')
          cut=script.index("rm .github/workflows/pr131-close-gaps.yml")
          script=script[:cut] + "cargo fmt --all -- --check\n"
          Path('/tmp/pr131-close.sh').write_text(script)
          PY
          bash /tmp/pr131-close.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f \
            .github/workflows/pr131-close-gaps.yml \
            .github/workflows/pr131-finalize.yml \
            .github/workflows/pr131-trigger-close.yml \
            .github/workflows/pr131-retry-close.yml \
            .github/workflows/pr131-retry2-close.yml \
            .pr131-trigger
          git add -A
          git diff --cached --check
          git commit -m "ci(m5): close resource-bound root proof semantics"
          git push origin HEAD:ci/m5-resource-bounds-provenance
