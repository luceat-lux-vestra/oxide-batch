name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read # Reconcile exact PR identity and changed-file metadata against the protected base.

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: trusted-pr-scope
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      legacy_base: ${{ steps.classify.outputs.legacy_base }}
      schema8_bootstrap: ${{ steps.classify.outputs.schema8_bootstrap }}
      classification_outcome: ${{ steps.classify.outcome }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      supply_chain_impact: ${{ steps.classify.outputs.supply_chain_impact }}
      evidence_impact: ${{ steps.classify.outputs.evidence_impact }}
    steps:
      - name: Check out exact trusted base
        id: trusted-base
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Classify merge-time authority from trusted base
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_CHECKOUT: ${{ steps.trusted-base.outcome }}
        shell: bash
        run: |
          {
            echo 'legacy_base=unknown'
            echo 'schema8_bootstrap=false'
            echo 'docs_only=false'
            echo 'supply_chain_impact=true'
            echo 'evidence_impact=true'
          } >> "$GITHUB_OUTPUT"
          set -euo pipefail
          test "$TRUSTED_CHECKOUT" = "success"

          schema_version="$(jq -er '.schema_version | select(type == "number")' .trusted-base/.github/merge-gate-policy.json)"
          if [ "$schema_version" -ge 7 ]; then
            echo 'legacy_base=false' >> "$GITHUB_OUTPUT"
          else
            echo 'legacy_base=true' >> "$GITHUB_OUTPUT"
          fi

          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.base.sha == $base and .head.sha == $head and .base.repo.full_name == $repo and ((.changed_files | type) == "number" and .changed_files > 0)' \
            <<<"$pr_json" >/dev/null
          expected_count="$(jq -er '.changed_files' <<<"$pr_json")"

          pages="$(gh api --paginate --slurp -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          jq -e 'type == "array" and all(.[]; type == "array")' <<<"$pages" >/dev/null
          changed_file_records="$(mktemp)"
          trap 'rm -f "$changed_file_records"' EXIT
          jq -r '.[][] | [.status, .filename, (.previous_filename // "")] | @tsv' <<<"$pages" >"$changed_file_records"

          schema8_bootstrap=false
          if [ "$schema_version" = "7" ] && [ "$expected_count" = "1" ]; then
            bootstrap_status="$(jq -er '[.[][]] | if length == 1 then .[0].status else error("bootstrap requires exactly one changed file") end' <<<"$pages")"
            bootstrap_path="$(jq -er '[.[][]] | if length == 1 then .[0].filename else error("bootstrap requires exactly one changed file") end' <<<"$pages")"
            bootstrap_previous="$(jq -r '[.[][]] | if length == 1 then (.[0].previous_filename // "") else "" end' <<<"$pages")"
            if [ "$bootstrap_status" = "modified" ] && [ "$bootstrap_path" = ".github/merge-gate-policy.json" ] && [ -z "$bootstrap_previous" ]; then
              head_policy="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/.github/merge-gate-policy.json?ref=${HEAD_SHA}")"
              head_schema="$(jq -er '.content | @base64d | fromjson | .schema_version | select(type == "number")' <<<"$head_policy")"
              if [ "$head_schema" = "8" ]; then
                schema8_bootstrap=true
              fi
            fi
          fi

          classification="$(
            python3 .trusted-base/.github/scripts/pr-scope.py \
              --repo-root .trusted-base \
              --policy .github/merge-gate-policy.json \
              --expected-count "$expected_count" \
              --trusted-base-sha "$BASE_SHA" \
              <"$changed_file_records"
          )"

          docs_only="$(jq -er 'if .classification_valid == true and (.docs_only | type) == "boolean" then .docs_only else error("invalid docs_only") end' <<<"$classification")"
          supply_chain_impact="$(jq -er 'if .classification_valid == true and (.supply_chain_impact | type) == "boolean" then .supply_chain_impact else error("invalid supply_chain_impact") end' <<<"$classification")"
          evidence_impact="$(jq -er 'if .classification_valid == true and (.evidence_impact | type) == "boolean" then .evidence_impact else error("invalid evidence_impact") end' <<<"$classification")"

          {
            echo "schema8_bootstrap=$schema8_bootstrap"
            echo "docs_only=$docs_only"
            echo "supply_chain_impact=$supply_chain_impact"
            echo "evidence_impact=$evidence_impact"
          } >> "$GITHUB_OUTPUT"

  dispatch-authorities:
    name: dispatch-required-authorities
    needs: scope
    if: ${{ always() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch only the protected-base authority workflows selected by trusted scope.
      contents: read # Read the exact protected-base policy/runtime used for dispatch planning.
    steps:
      - name: Check out exact trusted base for dispatch planning
        id: dispatch-trusted-base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .dispatch-trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch required authorities
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CALLER_RUN_ID: ${{ github.run_id }}
          CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          CLASSIFICATION_OUTCOME: ${{ needs.scope.outputs.classification_outcome }}
          LEGACY_BASE: ${{ needs.scope.outputs.legacy_base }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          EVIDENCE_IMPACT: ${{ needs.scope.outputs.evidence_impact }}
          SUPPLY_IMPACT: ${{ needs.scope.outputs.supply_chain_impact }}
        shell: bash
        run: |
          set -euo pipefail
          set -f
          plan="$(
            python3 .dispatch-trusted-base/.github/scripts/pr-authority-runtime.py plan               --policy .dispatch-trusted-base/.github/merge-gate-policy.json               --scope-result "$SCOPE_RESULT"               --classification-outcome "$CLASSIFICATION_OUTCOME"               --legacy-base "$LEGACY_BASE"               --docs-only "$DOCS_ONLY"               --evidence-impact "$EVIDENCE_IMPACT"               --supply-chain-impact "$SUPPLY_IMPACT"
          )"
          jq -e '
            .schema == "trusted-scope-authorities-v1" and
            (.required | type) == "array" and
            all(.required[]; (.workflow | type) == "string")
          ' <<<"$plan" >/dev/null

          while IFS= read -r workflow_path; do
            workflow="${workflow_path##*/}"
            test -n "$workflow"
            # Globbing is disabled above with set -f; keep canonical nested gh-api field tokens literal.
            # shellcheck disable=SC2102
            gh api --method POST               "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches"               -f ref="$DEFAULT_BRANCH"               -f inputs[base_sha]="$BASE_SHA"               -f inputs[head_sha]="$HEAD_SHA"               -f inputs[head_repo]="$HEAD_REPO"               -f inputs[pr_number]="$PR_NUMBER"               -f inputs[caller_run_id]="$CALLER_RUN_ID"               -f inputs[caller_run_attempt]="$CALLER_RUN_ATTEMPT"
          done < <(jq -r '.required[].workflow' <<<"$plan")

  pr-proof:
    name: pr-proof
    needs: [scope, dispatch-authorities]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read # Poll and verify the exact correlated authority workflow runs.
      contents: read # Read the exact protected-base policy/runtime used for proof verification.
    steps:
      - name: Draft placeholder
        if: ${{ github.event.pull_request.draft }}
        run: echo "authoritative PR proof is deferred until ready_for_review"

      - name: Check out exact trusted base for proof verification
        id: proof-trusted-base
        if: ${{ github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .proof-trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Verify dispatched authorities
        if: ${{ github.event.pull_request.draft == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CALLER_RUN_ID: ${{ github.run_id }}
          CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          CLASSIFICATION_OUTCOME: ${{ needs.scope.outputs.classification_outcome }}
          LEGACY_BASE: ${{ needs.scope.outputs.legacy_base }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          EVIDENCE_IMPACT: ${{ needs.scope.outputs.evidence_impact }}
          SUPPLY_IMPACT: ${{ needs.scope.outputs.supply_chain_impact }}
          DISPATCH_RESULT: ${{ needs.dispatch-authorities.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .proof-trusted-base/.github/scripts/pr-authority-runtime.py verify             --policy .proof-trusted-base/.github/merge-gate-policy.json             --scope-result "$SCOPE_RESULT"             --classification-outcome "$CLASSIFICATION_OUTCOME"             --legacy-base "$LEGACY_BASE"             --docs-only "$DOCS_ONLY"             --evidence-impact "$EVIDENCE_IMPACT"             --supply-chain-impact "$SUPPLY_IMPACT"             --dispatch-result "$DISPATCH_RESULT"             --base-sha "$BASE_SHA"             --head-sha "$HEAD_SHA"             --head-repo "$HEAD_REPO"             --pr-number "$PR_NUMBER"             --caller-run-id "$CALLER_RUN_ID"             --caller-run-attempt "$CALLER_RUN_ATTEMPT"             --timeout-seconds 540             --poll-interval-seconds 5
