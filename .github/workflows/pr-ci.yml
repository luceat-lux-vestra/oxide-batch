name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read # Reconcile exact PR identity and changed-file metadata against the protected base.

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: trusted-pr-scope
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      legacy_base: ${{ steps.classify.outputs.legacy_base }}
      schema8_bootstrap: ${{ steps.classify.outputs.schema8_bootstrap }}
      classification_outcome: ${{ steps.classify.outcome }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      supply_chain_impact: ${{ steps.classify.outputs.supply_chain_impact }}
      evidence_impact: ${{ steps.classify.outputs.evidence_impact }}
    steps:
      - name: Check out exact trusted base
        id: trusted-base
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Classify merge-time authority from trusted base
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_CHECKOUT: ${{ steps.trusted-base.outcome }}
        shell: bash
        run: |
          {
            echo 'legacy_base=unknown'
            echo 'schema8_bootstrap=false'
            echo 'docs_only=false'
            echo 'supply_chain_impact=true'
            echo 'evidence_impact=true'
          } >> "$GITHUB_OUTPUT"
          set -euo pipefail
          test "$TRUSTED_CHECKOUT" = "success"

          schema_version="$(jq -er '.schema_version | select(type == "number")' .trusted-base/.github/merge-gate-policy.json)"
          if [ "$schema_version" -ge 7 ]; then
            echo 'legacy_base=false' >> "$GITHUB_OUTPUT"
          else
            echo 'legacy_base=true' >> "$GITHUB_OUTPUT"
          fi

          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.base.sha == $base and .head.sha == $head and .base.repo.full_name == $repo and ((.changed_files | type) == "number" and .changed_files > 0)' \
            <<<"$pr_json" >/dev/null
          expected_count="$(jq -er '.changed_files' <<<"$pr_json")"

          pages="$(gh api --paginate --slurp -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          jq -e 'type == "array" and all(.[]; type == "array")' <<<"$pages" >/dev/null
          changed_file_records="$(mktemp)"
          trap 'rm -f "$changed_file_records"' EXIT
          jq -r '.[][] | [.status, .filename, (.previous_filename // "")] | @tsv' <<<"$pages" >"$changed_file_records"

          schema8_bootstrap=false
          if [ "$schema_version" = "7" ] && [ "$expected_count" = "1" ]; then
            bootstrap_status="$(jq -er '[.[][]] | if length == 1 then .[0].status else error("bootstrap requires exactly one changed file") end' <<<"$pages")"
            bootstrap_path="$(jq -er '[.[][]] | if length == 1 then .[0].filename else error("bootstrap requires exactly one changed file") end' <<<"$pages")"
            bootstrap_previous="$(jq -r '[.[][]] | if length == 1 then (.[0].previous_filename // "") else "" end' <<<"$pages")"
            if [ "$bootstrap_status" = "modified" ] && [ "$bootstrap_path" = ".github/merge-gate-policy.json" ] && [ -z "$bootstrap_previous" ]; then
              head_policy="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/.github/merge-gate-policy.json?ref=${HEAD_SHA}")"
              head_schema="$(jq -er '.schema_version | select(type == "number")' <<<"$head_policy")"
              if [ "$head_schema" = "8" ]; then
                schema8_bootstrap=true
              fi
            fi
          fi

          classification="$(
            python3 .trusted-base/.github/scripts/pr-scope.py \
              --repo-root .trusted-base \
              --policy .github/merge-gate-policy.json \
              --expected-count "$expected_count" \
              --trusted-base-sha "$BASE_SHA" \
              <"$changed_file_records"
          )"

          docs_only="$(jq -r 'if .classification_valid == true and (.docs_only | type) == "boolean" then .docs_only else error("invalid docs_only") end' <<<"$classification")"
          supply_chain_impact="$(jq -r 'if .classification_valid == true and (.supply_chain_impact | type) == "boolean" then .supply_chain_impact else error("invalid supply_chain_impact") end' <<<"$classification")"
          evidence_impact="$(jq -r 'if .classification_valid == true and (.evidence_impact | type) == "boolean" then .evidence_impact else error("invalid evidence_impact") end' <<<"$classification")"

          {
            echo "schema8_bootstrap=$schema8_bootstrap"
            echo "docs_only=$docs_only"
            echo "supply_chain_impact=$supply_chain_impact"
            echo "evidence_impact=$evidence_impact"
          } >> "$GITHUB_OUTPUT"

  rust:
    needs: scope
    if: ${{ needs.scope.outputs.legacy_base != 'true' && (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.docs_only != 'true') }}
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read

  dependency:
    needs: scope
    if: ${{ needs.scope.outputs.legacy_base != 'true' && (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.docs_only != 'true') }}
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read

  evidence:
    needs: scope
    if: ${{ needs.scope.outputs.legacy_base != 'true' && (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.evidence_impact != 'false') }}
    uses: ./.github/workflows/evidence.yml
    permissions:
      contents: read

  supply:
    needs: scope
    if: ${{ needs.scope.outputs.legacy_base != 'true' && (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.supply_chain_impact != 'false') }}
    uses: ./.github/workflows/supply-chain.yml
    permissions:
      contents: read

  pr-proof:
    name: pr-proof
    needs: [scope, rust, dependency, evidence, supply]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate direct PR authorities
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          CLASSIFICATION_OUTCOME: ${{ needs.scope.outputs.classification_outcome }}
          LEGACY_BASE: ${{ needs.scope.outputs.legacy_base }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          EVIDENCE_IMPACT: ${{ needs.scope.outputs.evidence_impact }}
          SUPPLY_IMPACT: ${{ needs.scope.outputs.supply_chain_impact }}
          RUST_RESULT: ${{ needs.rust.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency.result }}
          CODEQL_RESULT: not-applicable
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          SUPPLY_RESULT: ${{ needs.supply.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PR_DRAFT" = "true" ]; then
            echo "authoritative PR gate is deferred until ready_for_review"
            exit 0
          fi

          if [ "$LEGACY_BASE" = "true" ]; then
            echo "trusted legacy base retains the historical compatibility shortcut"
            exit 0
          fi

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name authority must succeed; result=$result" >&2
              return 1
            fi
          }

          require_skipped() {
            local name="$1"
            local result="$2"
            if [ "$result" != "skipped" ]; then
              echo "::error::$name authority must be skipped by trusted routing; result=$result" >&2
              return 1
            fi
          }

          echo "scope=$SCOPE_RESULT classification=$CLASSIFICATION_OUTCOME docs_only=$DOCS_ONLY codeql=$CODEQL_RESULT"

          if [ "$CLASSIFICATION_OUTCOME" != "success" ]; then
            require_success rust "$RUST_RESULT"
            require_success dependency "$DEPENDENCY_RESULT"
            require_success evidence "$EVIDENCE_RESULT"
            require_success supply "$SUPPLY_RESULT"
            exit 0
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            require_skipped rust "$RUST_RESULT"
            require_skipped dependency "$DEPENDENCY_RESULT"
          else
            require_success rust "$RUST_RESULT"
            require_success dependency "$DEPENDENCY_RESULT"
          fi

          if [ "$EVIDENCE_IMPACT" = "false" ]; then
            require_skipped evidence "$EVIDENCE_RESULT"
          else
            require_success evidence "$EVIDENCE_RESULT"
          fi

          if [ "$SUPPLY_IMPACT" = "false" ]; then
            require_skipped supply "$SUPPLY_RESULT"
          else
            require_success supply "$SUPPLY_RESULT"
          fi
