name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read # Reconcile exact PR identity and changed-file metadata against the protected base.

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: trusted-pr-scope
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      classification_outcome: ${{ steps.classify.outcome }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      supply_chain_impact: ${{ steps.classify.outputs.supply_chain_impact }}
      evidence_impact: ${{ steps.classify.outputs.evidence_impact }}
      codeql_runtime_classification_outcome: ${{ steps.codeql-runtime-scope.outcome }}
      codeql_runtime_required: ${{ steps.codeql-runtime-scope.outputs.required }}
    steps:
      - name: Check out exact trusted base
        id: trusted-base
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Classify merge-time authority from trusted base
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_CHECKOUT: ${{ steps.trusted-base.outcome }}
        shell: bash
        run: |
          {
            echo 'docs_only=false'
            echo 'supply_chain_impact=true'
            echo 'evidence_impact=true'
          } >> "$GITHUB_OUTPUT"
          set -euo pipefail
          test "$TRUSTED_CHECKOUT" = "success"

          schema_version="$(jq -er '.schema_version | select(type == "number")' .trusted-base/.github/pr-scope-policy.json)"
          test "$schema_version" = "1" || {
            echo "::error::unsupported trusted-base policy schema: $schema_version" >&2
            exit 1
          }

          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.base.sha == $base and .head.sha == $head and .base.repo.full_name == $repo and ((.changed_files | type) == "number" and .changed_files > 0)' \
            <<<"$pr_json" >/dev/null
          expected_count="$(jq -er '.changed_files' <<<"$pr_json")"

          pages="$(gh api --paginate --slurp -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          jq -e 'type == "array" and all(.[]; type == "array")' <<<"$pages" >/dev/null
          changed_file_records="$(mktemp)"
          trap 'rm -f "$changed_file_records"' EXIT
          jq -r '.[][] | [.status, .filename, (.previous_filename // "")] | @tsv' <<<"$pages" >"$changed_file_records"

          classification="$(
            python3 .trusted-base/.github/scripts/pr-scope.py \
              --repo-root .trusted-base \
              --policy .github/pr-scope-policy.json \
              --expected-count "$expected_count" \
              --trusted-base-sha "$BASE_SHA" \
              <"$changed_file_records"
          )"

          docs_only="$(jq -r 'if .classification_valid == true and (.docs_only | type) == "boolean" then .docs_only else error("invalid docs_only") end' <<<"$classification")"
          supply_chain_impact="$(jq -r 'if .classification_valid == true and (.supply_chain_impact | type) == "boolean" then .supply_chain_impact else error("invalid supply_chain_impact") end' <<<"$classification")"
          evidence_impact="$(jq -r 'if .classification_valid == true and (.evidence_impact | type) == "boolean" then .evidence_impact else error("invalid evidence_impact") end' <<<"$classification")"

          {
            echo "docs_only=$docs_only"
            echo "supply_chain_impact=$supply_chain_impact"
            echo "evidence_impact=$evidence_impact"
          } >> "$GITHUB_OUTPUT"

      - name: Classify selective CodeQL runtime from trusted base
        id: codeql-runtime-scope
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_CHECKOUT: ${{ steps.trusted-base.outcome }}
        shell: bash
        run: |
          echo 'required=true' >> "$GITHUB_OUTPUT"
          set -euo pipefail
          test "$TRUSTED_CHECKOUT" = "success"

          validator=.trusted-base/.github/scripts/trusted-codeql-runtime-validation.py
          if [ ! -f "$validator" ]; then
            echo "Trusted base predates #633 classifier; bootstrap requires the real runtime."
            exit 0
          fi

          pr_json="$RUNNER_TEMP/codeql-runtime-pr.json"
          files_json="$RUNNER_TEMP/codeql-runtime-files.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$pr_json"
          gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > "$files_json"

          python3 "$validator" classify \
            --pr-json "$pr_json" \
            --files-json "$files_json" \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --head-repo "$HEAD_REPO" \
            --github-output "$GITHUB_OUTPUT"
  rust:
    needs: scope
    if: ${{ (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.docs_only != 'true') }}
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read # Reuse canonical exact-SHA Fast evidence in the called Rust authority.
      contents: read

  dependency:
    needs: scope
    if: ${{ (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.docs_only != 'true') }}
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read

  evidence:
    needs: scope
    if: ${{ (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.evidence_impact != 'false') }}
    uses: ./.github/workflows/evidence.yml
    permissions:
      contents: read

  supply:
    needs: scope
    if: ${{ (needs.scope.outputs.classification_outcome != 'success' || needs.scope.outputs.supply_chain_impact != 'false') }}
    uses: ./.github/workflows/supply-chain.yml
    permissions:
      contents: read

  conformance:
    needs: scope
    uses: ./.github/workflows/m5-conformance.yml
    permissions:
      contents: read
      pull-requests: read # M5 trusted routing re-reads exact PR identity and changed-file metadata.

  codeql-runtime:
    name: codeql-runtime
    needs: scope
    if: ${{ needs.scope.outputs.codeql_runtime_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # Re-read exact PR metadata for the selective CodeQL runtime.
    steps:
      - name: Check out exact PR head for CodeQL runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify selective CodeQL runtime contract
        run: |
          python3 .github/scripts/trusted-codeql-runtime-validation.py self-test
          python3 .github/scripts/trusted-codeql-runtime-validation.py check-contract

      - name: Initialize PR-only CodeQL runtime
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none

      - name: Analyze PR-only CodeQL runtime without upload
        id: codeql-runtime-analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions
          upload: never
          output: ${{ runner.temp }}/pr-codeql-runtime

      - name: Verify local PR-only CodeQL SARIF and reject promotion
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SARIF_DIR: ${{ steps.codeql-runtime-analyze.outputs.sarif-output }}
        run: |
          python3 .github/scripts/trusted-codeql-runtime-validation.py verify \
            --sarif-dir "$SARIF_DIR" \
            --head "$HEAD_SHA"
  direct-merge-gate:
    name: Direct Merge Gate
    needs: [scope, rust, dependency, evidence, supply, conformance, codeql-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require complete PR DAG
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          CLASSIFICATION_OUTCOME: ${{ needs.scope.outputs.classification_outcome }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          EVIDENCE_IMPACT: ${{ needs.scope.outputs.evidence_impact }}
          SUPPLY_IMPACT: ${{ needs.scope.outputs.supply_chain_impact }}
          RUST_RESULT: ${{ needs.rust.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          SUPPLY_RESULT: ${{ needs.supply.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          CODEQL_RUNTIME_CLASSIFICATION_OUTCOME: ${{ needs.scope.outputs.codeql_runtime_classification_outcome }}
          CODEQL_RUNTIME_REQUIRED: ${{ needs.scope.outputs.codeql_runtime_required }}
          CODEQL_RUNTIME_RESULT: ${{ needs.codeql-runtime.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PR_DRAFT" = "true" ]; then
            echo "Direct Merge Gate is deferred until ready for review."
            exit 0
          fi

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name must succeed; result=$result" >&2
              return 1
            fi
          }

          require_skipped() {
            local name="$1"
            local result="$2"
            if [ "$result" != "skipped" ]; then
              echo "::error::$name must be skipped by trusted routing; result=$result" >&2
              return 1
            fi
          }

          require_success conformance "$CONFORMANCE_RESULT"
          require_success codeql-runtime-scope "$CODEQL_RUNTIME_CLASSIFICATION_OUTCOME"

          if [ "$CODEQL_RUNTIME_REQUIRED" = "true" ]; then
            require_success codeql-runtime "$CODEQL_RUNTIME_RESULT"
          elif [ "$CODEQL_RUNTIME_REQUIRED" = "false" ]; then
            require_skipped codeql-runtime "$CODEQL_RUNTIME_RESULT"
          else
            echo "::error::invalid codeql_runtime_required=$CODEQL_RUNTIME_REQUIRED" >&2
            exit 1
          fi

          echo "scope=$SCOPE_RESULT classification=$CLASSIFICATION_OUTCOME docs_only=$DOCS_ONLY codeql_runtime_required=$CODEQL_RUNTIME_REQUIRED"

          if [ "$CLASSIFICATION_OUTCOME" != "success" ]; then
            require_success rust "$RUST_RESULT"
            require_success dependency "$DEPENDENCY_RESULT"
            require_success evidence "$EVIDENCE_RESULT"
            require_success supply "$SUPPLY_RESULT"
            exit 0
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            require_skipped rust "$RUST_RESULT"
            require_skipped dependency "$DEPENDENCY_RESULT"
          else
            require_success rust "$RUST_RESULT"
            require_success dependency "$DEPENDENCY_RESULT"
          fi

          if [ "$EVIDENCE_IMPACT" = "false" ]; then
            require_skipped evidence "$EVIDENCE_RESULT"
          else
            require_success evidence "$EVIDENCE_RESULT"
          fi

          if [ "$SUPPLY_IMPACT" = "false" ]; then
            require_skipped supply "$SUPPLY_RESULT"
          else
            require_success supply "$SUPPLY_RESULT"
          fi

          echo "Direct PR DAG complete."
