name: Pull request labels

on:
  # This elevated trigger never checks out, builds, sources, or executes the PR
  # head. It only treats title/body/changed-file metadata as API data and writes
  # labels with the job-scoped token below.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      # actions/labeler reads the base repository to classify changed paths.
      contents: read
      # Both steps classify and mutate labels on the pull request/issue record.
      pull-requests: write # Update pull-request labels after classification.
      issues: write # Create managed labels and apply/remove them through the Issues API.
    steps:
      - name: Ensure managed labels and classify PR type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const managed = [
              ['type:bug', 'B60205', 'A defect in existing functionality'],
              ['type:feature', '1F6FEB', 'A new user-facing capability'],
              ['type:security', 'B60205', 'Security hardening or vulnerability work'],
              ['type:docs', 'D4F4DD', 'Documentation-only work'],
              ['type:research', 'BFDADC', 'Research, RFC, or design work'],
              ['type:task', '0E8A16', 'Implementation, maintenance, test, CI, or release task'],
              ['area:ci', 'BFDADC', 'Continuous integration and automation'],
              ['area:core', '0E8A16', 'Core domain model and facade contracts'],
              ['area:runtime', '1D76DB', 'Job, step, and execution runtime'],
              ['area:repository', '5319E7', 'Persistence interfaces and metadata'],
              ['area:postgres', '006B75', 'PostgreSQL adapter and migrations'],
              ['area:cli', '006B75', 'Command-line interface'],
              ['area:observability', '0052CC', 'Logging, metrics, tracing, and diagnostics'],
              ['area:test', 'C5DEF5', 'Test kit, fixtures, and verification support'],
              ['area:compatibility', 'C5DEF5', 'Compatibility contracts and conformance evidence'],
              ['area:docs', 'D4F4DD', 'Documentation system and content'],
              ['area:governance', 'F2D600', 'Project policy and governance'],
              ['dependencies', '0366D6', 'Dependency updates'],
            ];
            for (const [name, color, description] of managed) {
              try {
                const { data } = await github.rest.issues.getLabel({ ...context.repo, name });
                if ((data.description || '') !== description) {
                  await github.rest.issues.updateLabel({ ...context.repo, name, description });
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            }

            const pr = context.payload.pull_request;
            const title = pr.title.trim().toLowerCase();
            let type = null;
            if (/^(fix|bug)(\([^)]*\))?:/.test(title)) type = 'type:bug';
            else if (/^(feat|feature)(\([^)]*\))?:/.test(title)) type = 'type:feature';
            else if (/^security(\([^)]*\))?:/.test(title)) type = 'type:security';
            else if (/^docs(\([^)]*\))?:/.test(title)) type = 'type:docs';
            else if (/^(research|rfc|audit|design)(\([^)]*\))?:/.test(title)) type = 'type:research';

            if (!type) {
              const referenceText = `${pr.title}\n${pr.body || ''}`;
              const matches = [...referenceText.matchAll(/#(\d+)/g)]
                .map(match => Number(match[1]))
                .filter(number => number !== pr.number);
              for (const issueNumber of [...new Set(matches)].slice(0, 10)) {
                try {
                  const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
                  const inherited = issue.labels
                    .map(label => typeof label === 'string' ? label : label.name)
                    .find(name => ['type:bug', 'type:feature', 'type:security', 'type:docs', 'type:research', 'type:task'].includes(name));
                  if (inherited) {
                    type = inherited;
                    break;
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            type ||= 'type:task';

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number: pr.number, per_page: 100 });
            for (const name of labels.map(x => x.name).filter(x => x.startsWith('type:'))) {
              if (name !== type) await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name });
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [type] });

      - name: Label changed areas
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  # Base-trusted repository merge authority. This job runs from the protected
  # base branch via pull_request_target, never checks out PR-head code, and
  # reads the canonical member inventory from the exact PR base SHA.
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Read exact-head workflow runs and all job attempts for child authority.
      contents: read
      pull-requests: read # Re-read live PR base/head identity before evaluating child evidence.
    steps:
      - name: Evaluate base-trusted repository merge authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          API_VERSION = "2022-11-28"
          POLL_SECONDS = 10
          DEADLINE_SECONDS = 18 * 60
          EXPECTED_CONTEXT = "merge-gate"

          token = os.environ["GITHUB_TOKEN"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          pr_number = os.environ["PR_NUMBER"]
          try:
              pr_number_int = int(pr_number)
          except ValueError as exc:
              raise SystemExit(f"merge-gate: FAIL: invalid PR number: {pr_number!r}") from exc
          draft = os.environ["PR_DRAFT"].lower() == "true"

          class GateError(RuntimeError):
              pass

          def api(path, params=None):
              url = f"{api_url}/repos/{repository}/{path.lstrip('/')}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": API_VERSION,
                      "User-Agent": "oxide-batch-base-trusted-merge-gate",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except Exception as exc:
                  raise GateError(f"GitHub API request failed for {path}: {type(exc).__name__}: {exc}") from exc
              return payload

          def fail(message):
              print(f"merge-gate: FAIL: {message}", file=sys.stderr)
              raise SystemExit(1)

          try:
              pr = api(f"pulls/{pr_number}")
              if pr.get("base", {}).get("sha") != base_sha:
                  raise GateError("live pull request base SHA no longer matches the triggering event")
              if pr.get("head", {}).get("sha") != head_sha:
                  raise GateError("live pull request head SHA no longer matches the triggering event")
              if pr.get("base", {}).get("repo", {}).get("full_name") != repository:
                  raise GateError("live pull request base repository is not the protected repository")

              if draft:
                  print("merge-gate: draft pull request; authoritative evaluation is deferred until ready_for_review")
                  raise SystemExit(0)

              policy_file = api(
                  "contents/.github/merge-gate-policy.json",
                  {"ref": base_sha},
              )
              encoded = policy_file.get("content")
              if not isinstance(encoded, str):
                  raise GateError("trusted-base merge-gate policy response has no content")
              try:
                  policy = json.loads(base64.b64decode(encoded).decode("utf-8"))
              except Exception as exc:
                  raise GateError(f"trusted-base merge-gate policy is invalid: {exc}") from exc

              # Schema v7+ freezes trust semantics at the protected base.
              # Static-contract compatibility vocabulary retained while the
              # verifier migrates behind protected_files in schema v8:
              # normalized_policy_without_blob_sets
              # PR-head merge-gate policy changes trust semantics outside
              # protected_inventory(policy, "trusted-base")
              # protected_inventory(head_policy, "PR-head")
              # workflow replacement cannot admit
              # Workflow and control-plane implementation changes use staged Git
              # blob admission: an unchanged artifact may stage a future blob,
              # while a changed artifact must already have been admitted by the
              # trusted base. Schema 7 -> 8 is a one-time bootstrap that adds the
              # canonical protected-file inventory without allowing those files to
              # change in the same PR.
              base_schema = policy.get("schema_version", 0)
              if base_schema >= 7:
                  head_policy_file = api(
                      "contents/.github/merge-gate-policy.json",
                      {"ref": head_sha},
                  )
                  head_policy_encoded = head_policy_file.get("content")
                  if not isinstance(head_policy_encoded, str):
                      raise GateError("PR-head merge-gate policy response has no content")
                  try:
                      head_policy = json.loads(
                          base64.b64decode(head_policy_encoded).decode("utf-8")
                      )
                  except Exception as exc:
                      raise GateError(
                          f"PR-head merge-gate policy is invalid: {exc}"
                      ) from exc

                  REQUIRED_PROTECTED_FILES = {
                      ".github/scripts/pr-scope.py",
                      ".github/scripts/verify-merge-gates.rb",
                      ".github/scripts/test-merge-gates.rb",
                      ".github/scripts/validate_actions_security.py",
                      ".github/scripts/validate_supply_chain_exceptions.py",
                      "docs/engineering/retained-evidence-policy.json",
                  }

                  def blob_inventory(document, label, field, path_key, validator):
                      protected = (
                          document.get("repository_merge_gate", {})
                          .get(field)
                      )
                      if not isinstance(protected, list) or not protected:
                          raise GateError(
                              f"{label} {field} must be a non-empty array"
                          )
                      inventory = {}
                      for entry in protected:
                          if not isinstance(entry, dict):
                              raise GateError(
                                  f"{label} {field} entry is not an object"
                              )
                          path = entry.get(path_key)
                          accepted = entry.get("accepted_blobs")
                          if (
                              not isinstance(path, str)
                              or not validator(path)
                              or path in inventory
                              or not isinstance(accepted, list)
                              or not accepted
                              or len(set(accepted)) != len(accepted)
                              or any(
                                  not isinstance(blob, str)
                                  or len(blob) != 40
                                  or any(
                                      ch not in "0123456789abcdef"
                                      for ch in blob
                                  )
                                  for blob in accepted
                              )
                          ):
                              raise GateError(
                                  f"{label} {field} contract is malformed: {entry!r}"
                              )
                          inventory[path] = set(accepted)
                      return inventory

                  def workflow_path(path):
                      return path.startswith(".github/workflows/")

                  def protected_file_path(path):
                      return (
                          not path.startswith("/")
                          and "\\" not in path
                          and ".." not in path.split("/")
                          and path not in {"", "."}
                          and not path.startswith(".github/workflows/")
                      )

                  def normalize_blob_sets(document, include_files):
                      normalized = json.loads(json.dumps(document))
                      gate_doc = normalized.get("repository_merge_gate", {})
                      fields = [("protected_workflows", "workflow")]
                      if include_files:
                          fields.append(("protected_files", "path"))
                      for field, _ in fields:
                          entries = gate_doc.get(field)
                          if isinstance(entries, list):
                              for entry in entries:
                                  if isinstance(entry, dict):
                                      entry["accepted_blobs"] = ["<staged>"]
                      return normalized

                  def artifact_blob(path, ref):
                      encoded_path = urllib.parse.quote(path, safe="/")
                      payload = api(
                          f"contents/{encoded_path}",
                          {"ref": ref},
                      )
                      blob = payload.get("sha")
                      if (
                          not isinstance(blob, str)
                          or len(blob) != 40
                          or any(ch not in "0123456789abcdef" for ch in blob)
                      ):
                          raise GateError(
                              f"{path}: cannot resolve Git blob identity at {ref}"
                          )
                      return blob

                  def enforce_staged_transition(
                      base_inventory,
                      head_inventory,
                      label,
                  ):
                      if set(head_inventory) != set(base_inventory):
                          raise GateError(
                              f"PR-head {label} inventory differs from trusted-base inventory"
                          )
                      for path in sorted(base_inventory):
                          base_blob = artifact_blob(path, base_sha)
                          head_blob = artifact_blob(path, head_sha)
                          base_allowed = base_inventory[path]
                          head_allowed = head_inventory[path]
                          if base_blob == head_blob:
                              if not base_allowed.issubset(head_allowed):
                                  raise GateError(
                                      f"{path}: unchanged {label} may only add staged "
                                      "accepted blobs; existing trust cannot be removed"
                                  )
                          else:
                              if head_blob not in base_allowed:
                                  raise GateError(
                                      f"{path}: changed {label} blob {head_blob!r} "
                                      "was not pre-admitted by trusted-base policy"
                                  )
                              if head_blob not in head_allowed:
                                  raise GateError(
                                      f"{path}: PR-head policy does not retain its "
                                      f"active pre-admitted {label} blob"
                                  )
                              if not head_allowed.issubset(base_allowed):
                                  raise GateError(
                                      f"{path}: {label} replacement cannot admit "
                                      "additional blobs in the same PR"
                                  )

                  base_workflows = blob_inventory(
                      policy,
                      "trusted-base",
                      "protected_workflows",
                      "workflow",
                      workflow_path,
                  )
                  head_workflows = blob_inventory(
                      head_policy,
                      "PR-head",
                      "protected_workflows",
                      "workflow",
                      workflow_path,
                  )

                  CANONICAL_PR_PROOF = {
                      "schema": "trusted-scope-authorities-v1",
                      "members": [
                          {
                              "id": "rust",
                              "workflow": ".github/workflows/ci.yml",
                              "applicability": "non_docs",
                          },
                          {
                              "id": "dependency",
                              "workflow": ".github/workflows/dependency-review.yml",
                              "applicability": "non_docs",
                          },
                          {
                              "id": "codeql",
                              "workflow": ".github/workflows/codeql.yml",
                              "applicability": "non_docs",
                          },
                          {
                              "id": "evidence",
                              "workflow": ".github/workflows/evidence.yml",
                              "applicability": "evidence_impact",
                          },
                          {
                              "id": "supply",
                              "workflow": ".github/workflows/supply-chain.yml",
                              "applicability": "supply_chain_impact",
                          },
                      ],
                  }

                  def canonical_pr_proof_bootstrap(base_document, head_document):
                      if "pr_proof" in base_document:
                          return False
                      if head_document.get("pr_proof") != CANONICAL_PR_PROOF:
                          return False
                      without_pr_proof = json.loads(json.dumps(head_document))
                      without_pr_proof.pop("pr_proof", None)
                      return (
                          normalize_blob_sets(without_pr_proof, False)
                          == normalize_blob_sets(base_document, False)
                      )

                  head_schema = head_policy.get("schema_version", 0)
                  if base_schema == 7 and head_schema == 8:
                      bootstrap_head = json.loads(json.dumps(head_policy))
                      bootstrap_head["schema_version"] = 7
                      bootstrap_gate = bootstrap_head.get("repository_merge_gate", {})
                      protected_files = bootstrap_gate.pop("protected_files", None)
                      if (
                          normalize_blob_sets(bootstrap_head, False)
                          != normalize_blob_sets(policy, False)
                      ):
                          raise GateError(
                              "schema 7 -> 8 bootstrap may only add canonical "
                              "protected_files and staged blob identities"
                          )
                      if not isinstance(protected_files, list):
                          raise GateError(
                              "schema 7 -> 8 bootstrap must add protected_files"
                          )
                      head_files = blob_inventory(
                          head_policy,
                          "PR-head",
                          "protected_files",
                          "path",
                          protected_file_path,
                      )
                      if set(head_files) != REQUIRED_PROTECTED_FILES:
                          raise GateError(
                              "schema 7 -> 8 bootstrap protected_files must exactly "
                              "match the canonical control-plane inventory"
                          )
                      for path in sorted(REQUIRED_PROTECTED_FILES):
                          base_blob = artifact_blob(path, base_sha)
                          head_blob = artifact_blob(path, head_sha)
                          if base_blob != head_blob:
                              raise GateError(
                                  f"{path}: protected-file bootstrap cannot modify "
                                  "the file in the same PR"
                              )
                          if base_blob not in head_files[path]:
                              raise GateError(
                                  f"{path}: protected-file bootstrap must admit "
                                  "the current trusted blob"
                              )
                      enforce_staged_transition(
                          base_workflows,
                          head_workflows,
                          "protected workflow",
                      )
                  elif base_schema == 7 and head_schema == 7:
                      if (
                          normalize_blob_sets(head_policy, False)
                          != normalize_blob_sets(policy, False)
                          and not canonical_pr_proof_bootstrap(policy, head_policy)
                      ):
                          raise GateError(
                              "PR-head merge-gate policy changes trust semantics "
                              "outside staged protected-workflow blob admission "
                              "or canonical pr_proof bootstrap"
                          )
                      enforce_staged_transition(
                          base_workflows,
                          head_workflows,
                          "protected workflow",
                      )
                  elif base_schema >= 8 and head_schema == base_schema:
                      if (
                          normalize_blob_sets(head_policy, True)
                          != normalize_blob_sets(policy, True)
                      ):
                          raise GateError(
                              "PR-head merge-gate policy changes schema-v8 trust "
                              "semantics outside staged blob admission"
                          )
                      base_files = blob_inventory(
                          policy,
                          "trusted-base",
                          "protected_files",
                          "path",
                          protected_file_path,
                      )
                      head_files = blob_inventory(
                          head_policy,
                          "PR-head",
                          "protected_files",
                          "path",
                          protected_file_path,
                      )
                      if set(base_files) != REQUIRED_PROTECTED_FILES:
                          raise GateError(
                              "trusted-base protected_files inventory is not canonical"
                          )
                      enforce_staged_transition(
                          base_workflows,
                          head_workflows,
                          "protected workflow",
                      )
                      enforce_staged_transition(
                          base_files,
                          head_files,
                          "protected file",
                      )
                  else:
                      raise GateError(
                          f"unsupported merge-gate schema transition "
                          f"{base_schema!r} -> {head_schema!r}"
                      )

              gate = policy.get("repository_merge_gate")
              if not isinstance(gate, dict) or gate.get("context") != EXPECTED_CONTEXT:
                  raise GateError("trusted-base policy does not declare the canonical repository merge gate")

              protected_workflows = gate.get("protected_workflows", [])
              if not isinstance(protected_workflows, list):
                  raise GateError("trusted-base protected_workflows must be an array")
              for protected in protected_workflows:
                  if not isinstance(protected, dict):
                      raise GateError("protected workflow entry is not an object")
                  workflow_path = protected.get("workflow")
                  accepted_blobs = protected.get("accepted_blobs")
                  if (
                      not isinstance(workflow_path, str)
                      or not workflow_path.startswith(".github/workflows/")
                      or not isinstance(accepted_blobs, list)
                      or not accepted_blobs
                      or any(
                          not isinstance(blob, str)
                          or len(blob) != 40
                          or any(ch not in "0123456789abcdef" for ch in blob)
                          for blob in accepted_blobs
                      )
                  ):
                      raise GateError(f"malformed protected workflow contract: {protected!r}")
                  encoded_path = urllib.parse.quote(workflow_path, safe="/")
                  head_file = api(
                      f"contents/{encoded_path}",
                      {"ref": head_sha},
                  )
                  actual_blob = head_file.get("sha")
                  if actual_blob not in accepted_blobs:
                      raise GateError(
                          f"{workflow_path}: PR-head blob {actual_blob!r} is not accepted "
                          f"by trusted-base policy"
                      )
                  print(
                      f"merge-gate: protected workflow accepted path={workflow_path} "
                      f"blob={actual_blob}"
                  )

              if policy.get("schema_version", 0) >= 8:
                  protected_files = gate.get("protected_files", [])
                  if not isinstance(protected_files, list) or not protected_files:
                      raise GateError(
                          "trusted-base protected_files must be a non-empty array"
                      )
                  seen_paths = set()
                  for protected in protected_files:
                      if not isinstance(protected, dict):
                          raise GateError("protected file entry is not an object")
                      path = protected.get("path")
                      accepted_blobs = protected.get("accepted_blobs")
                      if (
                          not isinstance(path, str)
                          or not path
                          or path.startswith("/")
                          or "\\" in path
                          or ".." in path.split("/")
                          or path.startswith(".github/workflows/")
                          or path in seen_paths
                          or not isinstance(accepted_blobs, list)
                          or not accepted_blobs
                          or any(
                              not isinstance(blob, str)
                              or len(blob) != 40
                              or any(ch not in "0123456789abcdef" for ch in blob)
                              for blob in accepted_blobs
                          )
                      ):
                          raise GateError(
                              f"malformed protected file contract: {protected!r}"
                          )
                      seen_paths.add(path)
                      encoded_path = urllib.parse.quote(path, safe="/")
                      head_file = api(
                          f"contents/{encoded_path}",
                          {"ref": head_sha},
                      )
                      actual_blob = head_file.get("sha")
                      if actual_blob not in accepted_blobs:
                          raise GateError(
                              f"{path}: PR-head blob {actual_blob!r} is not accepted "
                              "by trusted-base protected-file policy"
                          )
                      print(
                          f"merge-gate: protected file accepted path={path} "
                          f"blob={actual_blob}"
                      )

              members = gate.get("members")
              if not isinstance(members, list) or not members:
                  raise GateError("trusted-base repository merge gate has no member inventory")

              normalized = []
              seen_contexts = set()
              for member in members:
                  if not isinstance(member, dict):
                      raise GateError("repository merge-gate member is not an object")
                  context = member.get("context")
                  workflow = member.get("workflow")
                  if not isinstance(context, str) or not context:
                      raise GateError("repository merge-gate member has an invalid context")
                  if not isinstance(workflow, str) or not workflow.startswith(".github/workflows/"):
                      raise GateError(f"{context}: repository merge-gate member has an invalid workflow")
                  if context in seen_contexts:
                      raise GateError(f"duplicate repository merge-gate member context: {context}")
                  seen_contexts.add(context)
                  normalized.append((context, workflow))

              by_workflow = {}
              for context, workflow in normalized:
                  by_workflow.setdefault(workflow, []).append(context)

              pending = dict(by_workflow)
              started = time.monotonic()
              while pending:
                  next_pending = {}
                  for workflow, contexts in pending.items():
                      workflow_id = urllib.parse.quote(workflow.rsplit("/", 1)[-1], safe="")
                      runs_payload = api(
                          f"actions/workflows/{workflow_id}/runs",
                          {"event": "pull_request", "head_sha": head_sha, "per_page": 100},
                      )
                      runs = runs_payload.get("workflow_runs")
                      if not isinstance(runs, list):
                          raise GateError(f"{workflow}: workflow-runs response is missing workflow_runs")
                      exact = [
                          run for run in runs
                          if run.get("head_sha") == head_sha
                          and run.get("event") == "pull_request"
                          and any(
                              isinstance(linked_pr, dict)
                              and linked_pr.get("number") == pr_number_int
                              for linked_pr in (run.get("pull_requests") or [])
                          )
                      ]
                      if not exact:
                          next_pending[workflow] = contexts
                          continue

                      run = max(exact, key=lambda item: item.get("id", -1))
                      run_id = run.get("id")
                      if not isinstance(run_id, int):
                          raise GateError(f"{workflow}: latest exact-head run has no integer id")

                      jobs = []
                      page = 1
                      while True:
                          payload = api(
                              f"actions/runs/{run_id}/jobs",
                              {"filter": "all", "per_page": 100, "page": page},
                          )
                          batch = payload.get("jobs")
                          if not isinstance(batch, list):
                              raise GateError(f"{workflow}: jobs page {page} is missing jobs")
                          jobs.extend(batch)
                          if len(batch) < 100:
                              break
                          page += 1

                      waiting = []
                      for context in contexts:
                          entries = [job for job in jobs if job.get("name") == context]
                          if not entries:
                              if run.get("status") == "completed":
                                  raise GateError(f"{context}: canonical source workflow completed without emitting the member")
                              waiting.append(context)
                              continue

                          attempts = [entry.get("run_attempt") for entry in entries]
                          if any(not isinstance(attempt, int) for attempt in attempts):
                              raise GateError(f"{context}: member job is missing an integer run_attempt")
                          latest_attempt = max(attempts)
                          latest = [entry for entry in entries if entry.get("run_attempt") == latest_attempt]
                          if len(latest) != 1:
                              raise GateError(
                                  f"{context}: duplicate member jobs at latest run_attempt={latest_attempt}"
                              )
                          job = latest[0]
                          status = job.get("status")
                          conclusion = job.get("conclusion")
                          if status != "completed":
                              waiting.append(context)
                              continue
                          if conclusion != "success":
                              raise GateError(
                                  f"{context}: latest authoritative execution concluded "
                                  f"status={status!r} conclusion={conclusion!r}"
                              )
                          print(
                              f"merge-gate: pass member={context} workflow={workflow} "
                              f"run_id={run_id} run_attempt={latest_attempt} job_id={job.get('id')}"
                          )

                      if waiting:
                          next_pending[workflow] = waiting

                  pending = next_pending
                  if not pending:
                      break
                  if time.monotonic() - started >= DEADLINE_SECONDS:
                      detail = ", ".join(
                          f"{workflow}: {', '.join(contexts)}"
                          for workflow, contexts in sorted(pending.items())
                      )
                      raise GateError(f"timed out waiting for exact-head merge authority: {detail}")
                  time.sleep(POLL_SECONDS)

              print(f"merge-gate: PASS: all {len(normalized)} canonical members are exact-head successes")
          except GateError as exc:
              fail(str(exc))
          PY
