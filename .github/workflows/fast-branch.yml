name: Fast branch CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: fast-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check commit hygiene
        run: git log -1 --check

      - name: Resolve exact protected trusted base
        id: resolve-trusted-base
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          echo 'base_sha=' >> "$GITHUB_OUTPUT"
          set -euo pipefail
          repo_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}")"
          jq -e             --arg repo "$GITHUB_REPOSITORY"             --arg branch "$DEFAULT_BRANCH"             '.full_name == $repo and .default_branch == $branch'             <<<"$repo_json" >/dev/null

          base_sha="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq '.commit.sha')"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact trusted base for docs-only classification
        id: fast-trusted-base
        if: ${{ steps.resolve-trusted-base.outcome == 'success' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve-trusted-base.outputs.base_sha }}
          path: .fast-trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Classify documentation-only scope from trusted base
        id: docs-only-scope
        if: ${{ steps.resolve-trusted-base.outcome == 'success' && steps.fast-trusted-base.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.resolve-trusted-base.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          TRUSTED_CHECKOUT: ${{ steps.fast-trusted-base.outcome }}
        shell: bash
        run: |
          echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          set -euo pipefail
          test "$TRUSTED_CHECKOUT" = "success"

          compare="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}")"
          jq -e             --arg head "$HEAD_SHA"             '.head_commit.sha == $head and (.files | type) == "array" and (.files | length) > 0 and (.files | length) < 300'             <<<"$compare" >/dev/null
          expected_count="$(jq -er '.files | length' <<<"$compare")"

          changed_file_records="$(mktemp)"
          trap 'rm -f "$changed_file_records"' EXIT
          jq -r '.files[] | [.status, .filename, (.previous_filename // "")] | @tsv' <<<"$compare" >"$changed_file_records"

          classification="$(
            python3 .fast-trusted-base/.github/scripts/pr-scope.py               --repo-root .fast-trusted-base               --policy .github/merge-gate-policy.json               --expected-count "$expected_count"               --trusted-base-sha "$BASE_SHA"               <"$changed_file_records"
          )"
          docs_only="$(
            jq -er '
              if .classification_valid == true and
                 (.docs_only | type) == "boolean"
              then .docs_only
              else error("invalid docs-only classification output")
              end
            ' <<<"$classification"
          )"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only Fast path: $docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.docs-only-scope.outcome == 'success' && steps.docs-only-scope.outputs.docs_only == 'true' }}
        run: echo "Trusted protected-base classification proved documentation-only scope; Rust product validation is not applicable."

      - name: Resolve protected-main compiler cache identity
        id: fast-cache-id
        if: ${{ (steps.docs-only-scope.outcome != 'success' || steps.docs-only-scope.outputs.docs_only != 'true') && steps.resolve-trusted-base.outcome == 'success' }}
        env:
          BASE_SHA: ${{ steps.resolve-trusted-base.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          toolchain_hash="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
          lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          [[ "$toolchain_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]

          family="oxide-fast-sccache-v1-linux-${toolchain_hash}"
          lock_prefix="${family}-${lock_hash}-"
          key="${lock_prefix}${BASE_SHA}"

          {
            echo "family=$family"
            echo "lock_prefix=$lock_prefix"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"

      - name: Install verified sccache 0.18.0
        id: install-sccache
        if: ${{ steps.fast-cache-id.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v0.18.0"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"

          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Restore protected-main compiler cache read-only
        id: restore-sccache
        if: ${{ steps.install-sccache.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oxide-fast-sccache
          key: ${{ steps.fast-cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.fast-cache-id.outputs.lock_prefix }}
            ${{ steps.fast-cache-id.outputs.family }}-

      - name: Enable restore-only sccache
        id: enable-sccache
        if: ${{ steps.restore-sccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/oxide-fast-sccache"
            echo "SCCACHE_CACHE_SIZE=768M"
            echo "SCCACHE_LOCAL_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"

          echo "protected-main cache hit: ${{ steps.restore-sccache.outputs.cache-hit }}"

      - name: Show toolchain
        if: ${{ steps.docs-only-scope.outcome != 'success' || steps.docs-only-scope.outputs.docs_only != 'true' }}
        run: rustup show

      - name: Check formatting
        if: ${{ steps.docs-only-scope.outcome != 'success' || steps.docs-only-scope.outputs.docs_only != 'true' }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: ${{ steps.docs-only-scope.outcome != 'success' || steps.docs-only-scope.outputs.docs_only != 'true' }}
        run: >-
          cargo clippy --workspace --all-targets --all-features --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::too_many_lines

      - name: Run workspace unit tests
        if: ${{ steps.docs-only-scope.outcome != 'success' || steps.docs-only-scope.outputs.docs_only != 'true' }}
        run: cargo test --workspace --all-features --lib

      - name: Show compiler cache stats
        if: ${{ always() && steps.enable-sccache.outcome == 'success' && (steps.docs-only-scope.outcome != 'success' || steps.docs-only-scope.outputs.docs_only != 'true') }}
        continue-on-error: true
        run: sccache --show-stats --stats-format=json

