name: PR131 Retain Final Resource Bounds

on:
  push:
    branches:
      - ci/m5-resource-bounds-provenance
    paths:
      - .github/workflows/pr131-retain-final.yml

permissions:
  actions: read
  contents: write

jobs:
  retain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/m5-resource-bounds-provenance
          fetch-depth: 0
      - name: Download, verify, retain, and bind final evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/luceat-lux-vestra/oxide-batch/actions/artifacts/9316533962/zip -o /tmp/pg15.zip
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/luceat-lux-vestra/oxide-batch/actions/artifacts/9316535433/zip -o /tmp/pg18.zip
          test "$(sha256sum /tmp/pg15.zip | cut -d' ' -f1)" = "7c75c923129a1454ac753112adc536cab83ef030fb3d5a53227bee2b80623835"
          test "$(sha256sum /tmp/pg18.zip | cut -d' ' -f1)" = "4b664bd447a5db7784cf718c4850f4fb59c55c1ba12618b9603ff5c3ca6ad6f9"
          unzip -p /tmp/pg15.zip resource-bounds-campaign.json > docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json
          unzip -p /tmp/pg18.zip resource-bounds-campaign.json > docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path('docs/engineering/campaigns/m5')
          producer_head = '90fa7d0004f843fee77067c5af49d88200537332'
          execution = '2d9ab0ce976535fa3564159f70568c04e346c6a5'
          run_id = 32115407707
          entries = {
              'resource-bounds-campaign-postgres-15.json': {
                  'job_id': 95643695408,
                  'artifact_id': 9316533962,
                  'digest': 'sha256:7c75c923129a1454ac753112adc536cab83ef030fb3d5a53227bee2b80623835',
                  'size': 13096,
              },
              'resource-bounds-campaign-postgres-18.json': {
                  'job_id': 95643695406,
                  'artifact_id': 9316535433,
                  'digest': 'sha256:4b664bd447a5db7784cf718c4850f4fb59c55c1ba12618b9603ff5c3ca6ad6f9',
                  'size': 13095,
              },
          }
          for name in entries:
              report = json.loads((root / name).read_text())
              assert report['passed'] is True
              assert report['violations'] == []
              assert report['declared_resources'] == 36
              assert report['observed_resources'] == 36
              manifests = [r['observation']['execution_manifest'] for r in report['reports']]
              assert len(manifests) == 4
              assert {m['execution_commit'] for m in manifests} == {execution}
              assert all(m['tree_clean'] is True for m in manifests)
          prov_path = root / 'evidence-provenance.json'
          prov = json.loads(prov_path.read_text())
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          for item in prov['evidence']:
              name = item['report']
              if name not in entries:
                  continue
              meta = entries[name]
              report = json.loads((root / name).read_text())
              item['server_version'] = report['postgresql_version']
              item['producer']['execution_commit'] = execution
              item['producer']['branch_head_sha'] = producer_head
              item['producer']['source_tree_clean'] = True
              item['workflow_run'].update({
                  'workflow': 'M5 Resource Bounds',
                  'workflow_file': '.github/workflows/m5-resource-bounds.yml',
                  'id': run_id,
                  'attempt': 1,
                  'event': 'pull_request',
                  'conclusion': 'success',
              })
              item['producing_job'].update({
                  'name': 'postgres-' + item['postgres_major_version'] + '-resource-bounds-campaign',
                  'id': meta['job_id'],
                  'conclusion': 'success',
              })
              item['artifact'].update({
                  'name': 'resource-bounds-campaign-postgres-' + item['postgres_major_version'],
                  'id': meta['artifact_id'],
                  'digest': meta['digest'],
                  'size_bytes': meta['size'],
              })
              item['remote_verification'].update({
                  'verified': True,
                  'verified_at': now,
                  'run_id': run_id,
                  'workflow_run_identity': True,
                  'workflow_run_conclusion': True,
                  'producing_job_identity': True,
                  'producing_job_conclusion': True,
                  'artifact_digest': True,
                  'artifact_bytes_match_retained_report': True,
                  'execution_commit_matches_report': True,
                  'note': 'Final fresh retention after the PR #131 lint-clean semantic closure. Run 32115407707, both producing jobs, artifact IDs/API SHA-256 digests, downloaded ZIP hashes, extracted report bytes, and execution tree 2d9ab0ce were independently verified; producer branch head is 90fa7d00 on main 82f995f6.',
              })
          prov_path.write_text(json.dumps(prov, indent=2) + '\n')
          PY
          PG15_BLOB=$(git hash-object docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json)
          PG18_BLOB=$(git hash-object docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json)
          python3 - "$PG15_BLOB" "$PG18_BLOB" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path('docs/engineering/campaigns/m5/evidence-provenance.json')
          d=json.loads(p.read_text())
          blobs={'resource-bounds-campaign-postgres-15.json':sys.argv[1], 'resource-bounds-campaign-postgres-18.json':sys.argv[2]}
          for item in d['evidence']:
              if item['report'] in blobs:
                  item['retained_report_git_blob']=blobs[item['report']]
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          test "$PG15_BLOB" = "54c0973bd1c2101f9a40d4483b03634928c71bc6"
          test "$PG18_BLOB" = "db682daff3f7dc5deb67a3dd0c39d4d24da21781"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json \
                  docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json \
                  docs/engineering/campaigns/m5/evidence-provenance.json
          git diff --cached --check
          git commit -m 'docs(m5): retain final resource-bound evidence'
          git push origin HEAD:ci/m5-resource-bounds-provenance
