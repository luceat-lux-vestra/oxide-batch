name: M6 Gate B Transaction/Restart Equivalence

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6-gate-b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-b-campaign:
    name: postgres-${{ matrix.postgres }}-gate-b-campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        # matrix.postgres is a checked-in 15/18 allowlist. The matching official
        # multi-arch image digests are immutable; an unsupported value resolves
        # to a deliberately invalid digest and fails before campaign execution.
        image: postgres:${{ matrix.postgres }}@sha256:${{ matrix.postgres == '15' && '926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561' || matrix.postgres == '18' && '4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280' || 'unsupported' }} # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_gate_b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_gate_b"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_gate_b
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_gate_b
      OXIDEBATCH_CAMPAIGN_DIR: target/m6-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed if the execution contract drifts
        run: ./tests/fixtures/gate-b/verify-ci-contract.sh .github/workflows/m6-gate-b.yml

      - name: Run the Gate B transaction/restart equivalence campaign
        # matrix.postgres comes only from the checked-in 15/18 matrix above.
        run: ./tests/fixtures/gate-b/run-ci-campaign.sh ${{ matrix.postgres }} # zizmor: ignore[template-injection]

      # Retained on failure as well as on success -- a failed Gate B campaign
      # is mostly worth reading for which scenario diverged.
      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-b-campaign-postgres-${{ matrix.postgres }}
          path: target/m6-campaigns/gate-b-campaign.json
          if-no-files-found: error
