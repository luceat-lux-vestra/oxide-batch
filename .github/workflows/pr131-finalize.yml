          s=s[:start]+'''fn reconcile_search_bounded_construction(resource: &Resource, evidence: &Evidence) -> Vec<String> {
    let mut violations = Vec::new();
    let Some(declared) = resource.ceiling else { return violations; };
    let Some((report, cells)) = evidence.construction.get(&resource.name) else {
        return vec![format!("{} declares a search-bounded-construction proof and no report recorded construction cells for it", resource.name)];
    };
    if cells.len() != 2 {
        violations.push(format!("{} requires exactly two search-bound root cells and the {report} report recorded {}", resource.name, cells.len()));
        return violations;
    }
    let accepted: Vec<&Value> = cells.iter().filter(|cell| cell.get("expected").and_then(Value::as_str)==Some("accepted") && cell.get("observed").and_then(Value::as_str)==Some("accepted")).collect();
    let refused: Vec<&Value> = cells.iter().filter(|cell| cell.get("expected").and_then(Value::as_str)==Some("refused") && cell.get("observed").and_then(Value::as_str)==Some("refused")).collect();
    if accepted.len()!=1 || refused.len()!=1 {
        violations.push(format!("{} requires exactly one accepted and one refused search-bound cell", resource.name));
        return violations;
    }
    let a=accepted[0]; let r=refused[0];
    for (side, cell) in [("accepted",a),("refused",r)] {
        if cell.get("declared_ceiling").and_then(Value::as_i64) != Some(declared) {
            violations.push(format!("{}'s {side} search cell does not carry declared ceiling {declared}", resource.name));
        }
        if cell.get("declared_unit").and_then(Value::as_str) != Some(resource.unit.as_str()) {
            violations.push(format!("{}'s {side} search cell does not carry declared unit {}", resource.name, resource.unit));
        }
    }
    let av=a.get("value").and_then(Value::as_i64); let rv=r.get("value").and_then(Value::as_i64);
    match resource.name.as_str() {
        "retry-cache-bytes" => {
            if a.get("unit").and_then(Value::as_str)!=Some("bytes") || r.get("unit").and_then(Value::as_str)!=Some("bytes") { violations.push("retry-cache-bytes search cells must both be byte-valued".to_owned()); }
            if av.is_none_or(|v| v>declared) { violations.push(format!("retry-cache-bytes accepted value {av:?} exceeds {declared}")); }
            if rv != declared.checked_add(1) { violations.push(format!("retry-cache-bytes refusal must be exactly {} and was {rv:?}", declared+1)); }
        }
        "definition-nodes" => {
            if a.get("unit").and_then(Value::as_str)!=Some("nodes") || r.get("unit").and_then(Value::as_str)!=Some("nodes") { violations.push("definition-nodes search cells must both be node-valued".to_owned()); }
            if av.is_none_or(|v| v>declared) { violations.push(format!("definition-nodes accepted search value {av:?} exceeds {declared}")); }
            if rv != declared.checked_add(1) { violations.push(format!("definition-nodes refusal must be exactly {} and was {rv:?}", declared+1)); }
        }
        "definition-manifest" => {
            let detail=evidence.search_detail.get("definition-manifest");
            let chain=detail.and_then(|d| d.get("largest_accepted_chain")).and_then(Value::as_i64);
            let bytes=detail.and_then(|d| d.get("largest_accepted_manifest_bytes")).and_then(Value::as_i64);
            let bound=detail.and_then(|d| d.get("manifest_ceiling")).and_then(Value::as_i64);
            if bound != Some(declared) { violations.push(format!("definition-manifest search detail recorded manifest ceiling {bound:?}, expected {declared}")); }
            if a.get("unit").and_then(Value::as_str)!=Some("bytes") || av != bytes || bytes.is_none_or(|v| v>declared) { violations.push(format!("definition-manifest accepted cell {av:?} is not its retained byte search result {bytes:?} within {declared}")); }
            if r.get("unit").and_then(Value::as_str)!=Some("nodes") || rv != chain.and_then(|v| v.checked_add(1)) { violations.push(format!("definition-manifest refusal {rv:?} nodes is not exactly one past largest accepted chain {chain:?}")); }
        }
        other => violations.push(format!("{other} declares search-bounded-construction without a typed reconciliation rule")),
    }
    violations
}
