name: PR131 Finalize

on:
  push:
    branches: [fix/pr131-final-closure]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, '[pr131-finalized]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/pr131-final-closure
      - name: Merge latest main and patch semantic closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python3 - <<'PY'
          import json
          p='docs/engineering/campaigns/m5/evidence-provenance.json'
          d=json.load(open(p))
          saved={
            'declared':[x for x in d['campaigns']['declared'] if x['campaign']=='M5 PostgreSQL resource bounds'],
            'evidence':[x for x in d['evidence'] if x['campaign']=='M5 PostgreSQL resource bounds'],
          }
          json.dump(saved,open('/tmp/resource-provenance.json','w'))
          PY

          git fetch origin main
          set +e
          git merge --no-commit origin/main
          merge_rc=$?
          set -e

          # #132 is authoritative for Cargo.lock and the seven pre-existing campaigns.
          git checkout --theirs -- Cargo.lock || true
          for campaign in soak cancellation performance conformance crash-restore upgrade security; do
            git checkout --theirs -- "docs/engineering/campaigns/m5/${campaign}-campaign-postgres-15.json" 2>/dev/null || true
            git checkout --theirs -- "docs/engineering/campaigns/m5/${campaign}-campaign-postgres-18.json" 2>/dev/null || true
          done
          git checkout --theirs -- docs/engineering/campaigns/m5/evidence-provenance.json || true

          python3 - <<'PY'
          import json
          p='docs/engineering/campaigns/m5/evidence-provenance.json'
          d=json.load(open(p)); saved=json.load(open('/tmp/resource-provenance.json'))
          d['campaigns']['declared']=[x for x in d['campaigns']['declared'] if x['campaign']!='M5 PostgreSQL resource bounds']+saved['declared']
          d['evidence']=[x for x in d['evidence'] if x['campaign']!='M5 PostgreSQL resource bounds']+saved['evidence']
          with open(p,'w') as f: json.dump(d,f,indent=2); f.write('\n')
          PY

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(m5): integrate dependency evidence baseline"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(p): return Path(p).read_text()
          def save(p,s): Path(p).write_text(s)
          def rep(s,old,new,label):
              if old not in s: raise SystemExit(f'missing patch anchor: {label}')
              return s.replace(old,new,1)

          # ---- independent verifier ----
          p='xtask/src/resource_bounds.rs'; s=load(p)
          s=rep(s,
