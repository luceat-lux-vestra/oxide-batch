    resource: &str,
    report: &str,
    cells: &[Value],
    allowed: &[(i64, &str)],
) -> Vec<String> {
    let mut violations = Vec::new();
    for cell in cells {
        let Some(value) = cell.get("value").and_then(Value::as_i64) else {
            violations.push(format!("the {report} report recorded a malformed root cell for {resource} with no numeric value"));
            continue;
        };
        let Some(side) = cell.get("expected").and_then(Value::as_str) else {
            violations.push(format!("the {report} report recorded a malformed root cell for {resource} at {value} with no expected side"));
            continue;
        };
        let Some(observed) = cell.get("observed").and_then(Value::as_str) else {
            violations.push(format!("the {report} report recorded a malformed root cell for {resource} at {value} with no observed side"));
            continue;
        };
        if side != "accepted" && side != "refused" {
            violations.push(format!("the {report} report recorded an invalid expected side {side} for {resource} at {value}"));
            continue;
        }
        if observed != side {
            violations.push(format!("the {report} report recorded {resource} at {value} as expected {side} but observed {observed}"));
        }
        if !allowed.iter().any(|(allowed_value, allowed_side)| *allowed_value == value && *allowed_side == side) {
            violations.push(format!(
                "the {report} report recorded a construction cell for {resource} at {value}, expected {side}, which is not one of its declared root cells",
            ));
        }
    }
    violations
}
