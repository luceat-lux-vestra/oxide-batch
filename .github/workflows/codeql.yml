name: CodeQL
run-name: Full CodeQL ${{ github.event_name }} ${{ github.sha }}

# No pull_request, PR-derived workflow_run, or PR-dispatched security analysis.
# Full Actions/Rust scans remain weekly and on explicit exact-main dispatch.
on:
  schedule:
    - cron: "47 18 * * 1"
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
        description: Exact protected main SHA to scan

permissions:
  contents: read

concurrency:
  group: codeql-full-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify trusted CodeQL source identity
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.check.outputs.candidate_sha }}
    steps:
      - name: Reject stale or untrusted candidate
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$INPUT_SHA" = "$GITHUB_SHA"
              live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
              test "$live_sha" = "$INPUT_SHA"
              ;;
            schedule)
              test -z "$INPUT_SHA"
              ;;
            *)
              echo "::error::Untrusted CodeQL scan event $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          echo "candidate_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  analyze-actions:
    name: Analyze (actions)
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.candidate_sha }}
          persist-credentials: false
      - name: Validate exact checkout
        env:
          EXPECTED_SHA: ${{ needs.verify-source.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:actions

  analyze-rust:
    name: Analyze (rust)
    needs: verify-source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.candidate_sha }}
          persist-credentials: false
      - name: Validate exact checkout
        env:
          EXPECTED_SHA: ${{ needs.verify-source.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:rust
          upload-database: false
