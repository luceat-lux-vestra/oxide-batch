name: CodeQL
run-name: CodeQL source ${{ inputs.candidate_sha || github.sha }}

# Full CodeQL runs only on weekly schedule or trusted explicit dispatch.
# Routine PR/push analysis stays retired; release dispatch may scan a historical
# immutable protected-main ancestor without trusting an arbitrary branch SHA.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character protected main SHA to scan"
        required: true
        type: string
  schedule:
    - cron: "47 18 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scan-guard:
    name: CodeQL schedule guard
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_scan: ${{ steps.decide.outputs.should_scan }}
    steps:
      - name: Decide whether full CodeQL is required
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?event=schedule&status=success&branch=main&per_page=100")"
          if jq -e --arg sha "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" '
            .workflow_runs | any(.id != $current and .head_sha == $sha
              and .head_branch == "main" and .path == ".github/workflows/codeql.yml")
          ' <<<"$runs" >/dev/null; then
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "Unchanged scheduled main SHA: skip expensive CodeQL matrix"
          else
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: scan-guard
    if: needs.scan-guard.outputs.should_scan == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: rust
            build-mode: none
            os: ubuntu-24.04-arm

    steps:
      - name: Require exact protected-main source for full CodeQL evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact 40-character SHA required"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Trusted main workflow only"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || exit 1
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 1
          fi
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${remote_main}")"
          jq -e --arg sha "$EXPECTED_SHA" '
            (.status == "ahead" or .status == "identical")
            and .base_commit.sha == $sha and .merge_base_commit.sha == $sha
          ' <<<"$compare" >/dev/null || { echo "::error::Not a protected-main ancestor"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify scanned source checkout and ancestry
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD

      - name: Record exact source identity
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = os.environ["EXPECTED_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit("Wrong checkout identity")
          doc = {"schema": 1, "candidate_sha": expected, "checkout_sha": actual,
                 "event_sha": os.environ["GITHUB_SHA"], "run_id": int(os.environ["GITHUB_RUN_ID"]),
                 "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                 "language": os.environ["CODEQL_LANGUAGE"]}
          pathlib.Path(os.environ["RUNNER_TEMP"], "source-identity.json").write_text(json.dumps(doc))
          PY

      - name: Retain source identity manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-source-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ runner.temp }}/source-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}
          output: ${{ runner.temp }}/release-codeql-${{ matrix.language }}

      - name: Retain original CodeQL SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 30

      - name: Reject invalid, incomplete or High/Critical SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_codeql_sarif.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${remote_main}")"
          jq -e --arg sha "$EXPECTED_SHA" '(.status == "ahead" or .status == "identical") and .merge_base_commit.sha == $sha and .base_commit.sha == $sha' <<<"$compare" >/dev/null || exit 1
