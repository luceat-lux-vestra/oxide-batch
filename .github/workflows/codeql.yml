name: CodeQL
run-name: CodeQL source ${{ inputs.candidate_sha || github.sha }}

# Full CodeQL runs only on weekly schedule or trusted explicit dispatch.
# Routine PR/push analysis stays retired; release dispatch may scan a historical
# immutable protected-main ancestor or the single frozen protected M7 recovery lineage.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character trusted release-source SHA to scan"
        required: true
        type: string
      release_tag:
        description: "Optional release tag; only v0.7.0 enables the frozen M7 recovery lineage"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "47 18 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scan-guard:
    name: CodeQL schedule guard
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read # Read prior scheduled CodeQL runs for unchanged-main detection.
      contents: read # Read protected-main repository metadata only.
    outputs:
      should_scan: ${{ steps.decide.outputs.should_scan }}
    steps:
      - name: Decide whether full CodeQL is required
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?event=schedule&status=success&branch=main&per_page=100")"
          if jq -e --arg sha "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" '
            .workflow_runs | any(.id != $current and .head_sha == $sha
              and .head_branch == "main" and .path == ".github/workflows/codeql.yml")
          ' <<<"$runs" >/dev/null; then
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "Unchanged scheduled main SHA: skip expensive CodeQL matrix"
          else
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: scan-guard
    if: needs.scan-guard.outputs.should_scan == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read # Read workflow/run identity while validating exact-source evidence.
      contents: read # Check out and authorize the exact immutable release source.
      security-events: write # Upload scheduled CodeQL findings to code scanning.
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: rust
            build-mode: none
            os: ubuntu-24.04-arm

    steps:
      - name: Require trusted main workflow authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact 40-character SHA required"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Trusted main workflow only"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || exit 1
            [[ -z "$RELEASE_TAG" ]] || exit 1
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 1
          fi

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}

      - name: Check out trusted release source policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-security
          sparse-checkout: |
            .github/scripts

      - name: Authorize exact source against trusted policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "::error::Wrong candidate checkout"; exit 1; }
          cp .release-security/.github/scripts/check_release_codeql.py "$RUNNER_TEMP/check_release_codeql.py"
          rm -rf .release-security
          args=(--source-only --sha "$EXPECTED_SHA")
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          python3 "$RUNNER_TEMP/check_release_codeql.py" "${args[@]}"

      - name: Record exact source identity
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = os.environ["EXPECTED_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit("Wrong checkout identity")
          doc = {"schema": 1, "candidate_sha": expected, "checkout_sha": actual,
                 "event_sha": os.environ["GITHUB_SHA"], "run_id": int(os.environ["GITHUB_RUN_ID"]),
                 "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                 "language": os.environ["CODEQL_LANGUAGE"]}
          pathlib.Path(os.environ["RUNNER_TEMP"], "source-identity.json").write_text(json.dumps(doc))
          PY

      - name: Retain source identity manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-source-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ runner.temp }}/source-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # These are historical standalone runtime probes, intentionally not
          # members of the current Cargo workspace/manifest. Rust build-mode
          # none otherwise reports semantic-analyzer-unavailable warnings for
          # them even though all current source files extract successfully.
          config: |
            paths-ignore:
              - tests/fixtures/upgrade/schema-2-runtime/probe.rs
              - tests/fixtures/upgrade/schema-3-runtime/probe.rs

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}
          output: ${{ runner.temp }}/release-codeql-${{ matrix.language }}

      - name: Retain original CodeQL SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 30

      - name: Reject invalid, incomplete or High/Critical SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_codeql_sarif.py \
            --sarif-dir "$SARIF_DIR" \
            --language "$CODEQL_LANGUAGE" \
            --candidate-sha "$EXPECTED_SHA"
          args=(--source-only --sha "$EXPECTED_SHA")
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          python3 "$RUNNER_TEMP/check_release_codeql.py" "${args[@]}"
