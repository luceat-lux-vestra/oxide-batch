name: CodeQL

# Pull requests are the merge-time authority. The same exact tree is not
# re-analysed after squash merge. Weekly analysis still picks up new CodeQL
# queries during periods without code changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  schedule:
    - cron: "47 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload CodeQL SARIF results to GitHub code scanning.
    steps:
      - name: Draft required-context placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "CodeQL Actions analysis is deferred until the pull request is ready for review"

      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:actions

  rust-impact:
    name: codeql-rust-impact
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Fetch the classifier from the exact protected base SHA.
      pull-requests: read # Reconcile live PR identity and the complete changed-file list.
    outputs:
      run_rust: ${{ steps.route.outputs.run_rust }}
      reason: ${{ steps.route.outputs.reason }}
      changed_files: ${{ steps.route.outputs.changed_files }}
    steps:
      - name: Resolve exact-base Rust CodeQL impact
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.parse
          import urllib.request

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          base_sha = os.environ["BASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          classifier_path = ".github/scripts/codeql-rust-impact.py"

          def fallback(reason):
              safe = str(reason).replace("\n", " ").replace("\r", " ")
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("run_rust=true\n")
                  handle.write(f"reason=fallback:{safe}\n")
                  handle.write("changed_files=unknown\n")
              print(f"::warning::Rust CodeQL routing fell back to full analysis: {safe}")

          try:
              encoded_path = urllib.parse.quote(classifier_path, safe="/")
              url = (
                  f"{api_url}/repos/{repository}/contents/{encoded_path}"
                  f"?ref={urllib.parse.quote(base_sha, safe='')}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "oxide-batch-codeql-rust-route",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)

              encoded = payload.get("content")
              if not isinstance(encoded, str):
                  raise RuntimeError("trusted-base classifier response has no content")
              classifier = base64.b64decode(encoded).decode("utf-8")
              target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "codeql-rust-impact.py"
              target.write_text(classifier, encoding="utf-8")

              completed = subprocess.run(
                  [sys.executable, str(target)],
                  check=False,
                  env=os.environ.copy(),
              )
              if completed.returncode != 0:
                  raise RuntimeError(
                      f"trusted-base classifier exited {completed.returncode}"
                  )
          except Exception as exc:
              fallback(f"{type(exc).__name__}:{exc}")
          PY

  analyze-rust:
    name: Analyze (rust)
    needs: rust-impact
    if: >-
      ${{ always() &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.draft == false &&
            (needs.rust-impact.result != 'success' ||
             needs.rust-impact.outputs.run_rust != 'false'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload CodeQL SARIF results to GitHub code scanning.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:rust
