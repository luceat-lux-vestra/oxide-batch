name: Evidence

# The retained-evidence verifier lives in its own workflow, and the separation
# is structural rather than tidiness.
#
# It answers a question about the *repository's current state* — are the
# retained reports still the untouched output of a recorded run over a tree
# whose campaign still means what it meant — and the answer is legitimately
# "no" for the whole window between a commit that changes campaign semantics
# and the retention commit that records the rerun.
#
# Inside the Rust workflow that window would make the workflow run fail, and
# official evidence may only be promoted from a producer run that wholly
# succeeded. A campaign could then never produce evidence on the very commit
# that needed it: the check would fail the run, the failed run could not be
# promoted, and the evidence would stay stale. Keeping it separate lets the
# producer run mean "this tree builds, tests and campaigns pass" while the
# evidence check keeps its own, honest, red state until retention lands.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-provenance:
    name: evidence-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The verifier is offline by construction: it resolves no commit and
      # fetches nothing, comparing the execution manifest each retained report
      # carries against the working tree. A plain checkout is all it needs.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify retained campaign evidence against its provenance
        run: cargo run --package oxide-batch-xtask -- evidence

  pr131-retain-fresh:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 131
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ci/m5-resource-bounds-provenance

      - name: Retain already-verified fresh resource-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          mkdir -p /tmp/pr131-pg15 /tmp/pr131-pg18
          gh run download 32078689387 -n resource-bounds-campaign-postgres-15 -D /tmp/pr131-pg15
          gh run download 32078689387 -n resource-bounds-campaign-postgres-18 -D /tmp/pr131-pg18

          test "$(git hash-object /tmp/pr131-pg15/resource-bounds-campaign.json)" = "3ca32303058f5f3dccbd8e486566755ea1858a69"
          test "$(git hash-object /tmp/pr131-pg18/resource-bounds-campaign.json)" = "1335a92ddd10853c2e1e28db8ff41a039e8c27ae"

          python3 - <<'PY'
          import json
          from pathlib import Path
          for path, pg in [('/tmp/pr131-pg15/resource-bounds-campaign.json','15'),('/tmp/pr131-pg18/resource-bounds-campaign.json','18')]:
              d=json.loads(Path(path).read_text())
              assert d['passed'] is True
              assert d['violations'] == []
              assert d['declared_resources'] == 36
              assert d['observed_resources'] == 36
              assert d['postgresql_major_version'] == pg
              assert d['environment']['source_tree_clean'] is True
              assert d['environment']['source_commit'] == '15d79fc4dd4e7daf887482aabfe96d56a082e4c9'
              assert d['observation']['execution_manifest']['execution_commit'] == '15d79fc4dd4e7daf887482aabfe96d56a082e4c9'
              assert len(d['reports']) == 4
          PY

          cp /tmp/pr131-pg15/resource-bounds-campaign.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-15.json
          cp /tmp/pr131-pg18/resource-bounds-campaign.json docs/engineering/campaigns/m5/resource-bounds-campaign-postgres-18.json

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('docs/engineering/campaigns/m5/evidence-provenance.json')
          doc=json.loads(path.read_text())
          now=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          updates={
            'resource-bounds-campaign-postgres-15.json': {
              'server':'15.19 (Debian 15.19-1.pgdg13+2)', 'job_id':95537210584,
              'job_name':'postgres-15-resource-bounds-campaign', 'artifact_id':9304381036,
              'artifact_name':'resource-bounds-campaign-postgres-15', 'size':13097,
              'digest':'sha256:d5735071f8bc6142f36da7caa0b450f41fddaad40320a924e121b59b5c30bca8',
              'blob':'3ca32303058f5f3dccbd8e486566755ea1858a69', 'pg':'15'
            },
            'resource-bounds-campaign-postgres-18.json': {
              'server':'18.6 (Debian 18.6-1.pgdg13+2)', 'job_id':95537210537,
              'job_name':'postgres-18-resource-bounds-campaign', 'artifact_id':9304381909,
              'artifact_name':'resource-bounds-campaign-postgres-18', 'size':13097,
              'digest':'sha256:c326e22d4839e9390d2f66a77250187ec4d2eb2f0cc424f15c33dd3de9930810',
              'blob':'1335a92ddd10853c2e1e28db8ff41a039e8c27ae', 'pg':'18'
            }
          }
          seen=set()
          for entry in doc['evidence']:
              name=entry['report']
              if name not in updates: continue
              u=updates[name]; seen.add(name)
              entry['postgres_major_version']=u['pg']
              entry['server_version']=u['server']
              entry['producer'].update({
                'execution_commit':'15d79fc4dd4e7daf887482aabfe96d56a082e4c9',
                'branch_head_sha':'058a3b37bce1d94b4dc9e5565ac318a341d4cac2',
                'source_tree_clean':True,
                'rustc':'rustc 1.97.1 (8bab26f4f 2026-07-14)',
                'os':'linux','arch':'x86_64'
              })
              entry['workflow_run'].update({
                'workflow':'M5 Resource Bounds',
                'workflow_file':'.github/workflows/m5-resource-bounds.yml',
                'id':32078689387,'attempt':1,'event':'pull_request','conclusion':'success'
              })
              entry['producing_job'].update({'name':u['job_name'],'id':u['job_id'],'conclusion':'success'})
              entry['artifact'].update({'name':u['artifact_name'],'id':u['artifact_id'],'digest':u['digest'],'size_bytes':u['size']})
              entry['retained_report_git_blob']=u['blob']
              entry['remote_verification']={
                'verified':True,'verified_at':now,'run_id':32078689387,
                'workflow_run_identity':True,'workflow_run_conclusion':True,
                'producing_job_identity':True,'producing_job_conclusion':True,
                'artifact_digest':True,'artifact_bytes_match_retained_report':True,
                'execution_commit_matches_report':True,
                'note':'Fresh retention after latest main/Cargo.lock integration and the fourth resource-bound verifier hardening pass. Run, jobs, artifact IDs and API SHA-256 digests were checked; both ZIP archives were downloaded independently, their SHA-256 matched the API digest, their single extracted report bytes matched these retained git blobs exactly, and both reports bind execution tree 15d79fc4 to producer branch head 058a3b37 on main 82f995f6.'
              }
          assert seen == set(updates), seen
          path.write_text(json.dumps(doc,indent=2)+'\n')
          PY

          if ! grep -q '^### Fourth resource-bound corrective pass$' docs/project/m5-campaign-evidence.md; then
            cat >> docs/project/m5-campaign-evidence.md <<'EOF'

          ### Fourth resource-bound corrective pass

          The final resource-bound review closed the remaining root-proof gaps after F42.
          Generic construction cells now carry and must match their declared bound and canonical
          unit, malformed or contradictory extra cells fail rather than disappearing from the
          exact-set check, and repository connection-capacity refusal is re-derived from the real
          end-to-end `concurrent_children + 1` / one-short pool observation. Search-bounded proofs
          are dimension-aware for retry-cache bytes, definition nodes, and definition-manifest
          bytes/nodes.

          Because `Cargo.lock` is part of the resource-bound semantic closure, producer run
          `32070824012` was superseded after #132. Fresh producer branch head
          `058a3b37bce1d94b4dc9e5565ac318a341d4cac2` executed as PR merge tree
          `15d79fc4dd4e7daf887482aabfe96d56a082e4c9` against main
          `82f995f6fcc7a0ccf1bfc1c7e61453647065b331` in run `32078689387`.
          PostgreSQL 15 job `95537210584` retained artifact `9304381036`; PostgreSQL 18 job
          `95537210537` retained artifact `9304381909`. Both report 36/36 resources, no
          violations, a clean execution tree, and one execution manifest across all four
          sub-reports.
          EOF
          fi

          git fetch origin main
          git checkout origin/main -- .github/workflows/evidence.yml
          rm -f .github/workflows/pr131-retain-fresh.yml
          git add -A
          git diff --cached --check
          git commit -m "docs(m5): retain fresh resource-bound evidence after final hardening"
          git push origin HEAD:ci/m5-resource-bounds-provenance
