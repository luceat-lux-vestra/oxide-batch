name: Evidence
# Always-required retained-evidence INTEGRITY, not current-HEAD freshness.
# Verify exact historical report bytes, recorded producer identities, matrix,
# provenance, and bound dependency-closure manifests without rewriting history.
# Dependency updates legitimately make historical evidence stale for the new
# HEAD; the explicit `cargo xtask evidence-freshness` / `dependency-closures`
# commands verify current-HEAD validity when qualifying or promoting evidence.
# Do not couple an ordinary dependency PR to 11 historical sidecar rewrites.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-provenance:
    # Live required context name remains stable during the topology migration.
    name: evidence-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "retained-evidence integrity verification is deferred until the pull request is ready for review"

      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository-wide retained evidence policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask --bin retained_evidence_policy

      - name: Verify retained campaign evidence integrity and provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- evidence
