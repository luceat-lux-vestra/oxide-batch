name: Evidence
run-name: pr-authority/evidence/pr-${{ inputs.pr_number }}/${{ inputs.head_sha }}/caller-${{ inputs.caller_run_id }}-${{ inputs.caller_run_attempt }}

# This required context owns retained-evidence integrity, not current-HEAD
# freshness. Every PR must prove that committed reports are still the exact
# retained bytes of identified successful producer runs, that their provenance
# and matrix/inventory contracts are internally sound, and that campaign
# dependency-closure metadata still matches the locked Cargo graph.
#
# A retained report may legitimately become semantically stale after an
# ordinary source change. Exact comparison of its recorded campaign objects
# against current HEAD is a separate fail-closed authority:
# `cargo xtask evidence-freshness`. Semantic-impact/deep/release routing owns
# that question; keeping it out of this always-required context avoids forcing
# every ordinary source PR to regenerate all affected retained reports.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/ci-topology-v7-migration
  workflow_call:
  workflow_dispatch:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      caller_run_id:
        required: true
        type: string
      caller_run_attempt:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.event_name }}-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.caller_run_id || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-provenance:
    # Live required context name remains stable during the topology migration.
    name: evidence-provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "retained-evidence integrity verification is deferred until the pull request is ready for review"

      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repo || github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false


      - name: Verify repository-wide retained evidence policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask --bin retained_evidence_policy

      # dependency-closure.json is current semantic metadata, not an old report.
      # Keep it deterministic and merge-blocking even though report freshness is
      # now a separate authority.
      - name: Hydrate locked dependency graph for closure verification
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo fetch --locked

      - name: Verify campaign dependency closure metadata
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- dependency-closures

      - name: Verify retained campaign evidence integrity and provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- evidence
