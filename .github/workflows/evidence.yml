name: Evidence

# The retained-evidence verifier lives in its own workflow, and the separation
# is structural rather than tidiness.
#
# It answers the merge-time integrity question: are the retained reports still
# the untouched output of the recorded successful producers, with internally
# consistent provenance and execution manifests?
#
# Current-HEAD semantic freshness is intentionally a separate authority exposed
# by cargo xtask evidence-freshness. Semantic-impact/deep/release orchestration
# may require that stronger check without making expected retained-evidence
# staleness fail every ordinary source pull request.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-provenance:
    # Required context producer: always emit; draft PRs only run the placeholder.
    name: evidence-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "retained-evidence verification is deferred until the pull request is ready for review"

      # The verifiers are offline by construction: they resolve no commit and
      # fetch nothing. The policy verifier binds the repository-wide inventory,
      # canonical verdict contract, and bounded retention governance. It runs
      # first so a deliberately stale campaign-provenance window cannot hide a
      # compile or policy failure in the new repository-wide contract.
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository-wide retained evidence policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask --bin retained_evidence_policy

      # The integrity verifier does not compare current semantic objects, but
      # building the xtask still consumes the exact committed dependency graph.
      # Hydrate it once so the final command can remain locked and deterministic.
      - name: Hydrate locked dependency graph for offline provenance verification
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo fetch --locked

      - name: Verify retained campaign evidence integrity and provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- evidence
