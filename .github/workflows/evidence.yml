name: Evidence

# The retained-evidence verifier lives in its own workflow, and the separation
# is structural rather than tidiness.
#
# It answers a question about the *repository's current state* — are the
# retained reports still the untouched output of a recorded run over a tree
# whose campaign still means what it meant — and the answer is legitimately
# "no" for the whole window between a commit that changes campaign semantics
# and the retention commit that records the rerun.
#
# Inside the Rust workflow that window would make the workflow run fail, and
# official evidence may only be promoted from a producer run that wholly
# succeeded. A campaign could then never produce evidence on the very commit
# that needed it: the check would fail the run, the failed run could not be
# promoted, and the evidence would stay stale. Keeping it separate lets the
# producer run mean "this tree builds, tests and campaigns pass" while the
# evidence check keeps its own, honest, red state until retention lands.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-provenance:
    # Required context producer: always emit; draft PRs only run the placeholder.
    name: evidence-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "retained-evidence verification is deferred until the pull request is ready for review"

      # The verifiers are offline by construction: they resolve no commit and
      # fetch nothing. The policy verifier binds the repository-wide inventory,
      # canonical verdict contract, and bounded retention governance. It runs
      # first so a deliberately stale campaign-provenance window cannot hide a
      # compile or policy failure in the new repository-wide contract.
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository-wide retained evidence policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask --bin retained_evidence_policy

      # The permanent verifier resolves campaign-specific graphs offline. A fresh
      # hosted runner has only the xtask's tiny dependency set cached after the
      # policy command, so hydrate the exact committed lock graph once before
      # the offline derivation. --locked prevents this step from changing what
      # is being verified.
      - name: Hydrate locked dependency graph for offline provenance verification
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo fetch --locked

      - name: Verify retained campaign evidence against its provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: cargo run --package oxide-batch-xtask -- evidence
