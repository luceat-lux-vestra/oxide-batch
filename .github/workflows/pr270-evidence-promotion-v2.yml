name: PR270 evidence promotion v2

on:
  push:
    branches:
      - issue-265-nested-job-durable-linkage
    paths:
      - .github/workflows/pr270-evidence-promotion-v2.yml

concurrency:
  group: pr270-evidence-promotion-v2
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-24.04
    if: github.repository == 'luceat-lux-vestra/oxide-batch'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact bootstrap commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git fetch --no-tags --prune --depth=2 origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git checkout --detach "refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "2d73f69345bd07a0299c702444741d4ad47cfbf0"

      - name: Re-run hardened promotion logic with redirect-safe artifact download
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr270-evidence-promotion.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])

          old = '''def api_bytes(path):
              with urllib.request.urlopen(request(path)) as response:
                  return response.read()
          '''
          new = '''def api_bytes(path):
              import subprocess
              return subprocess.run(
                  [
                      "curl", "--fail", "--silent", "--show-error", "--location",
                      "-H", f"Authorization: Bearer {token}",
                      "-H", "Accept: application/vnd.github+json",
                      "-H", "X-GitHub-Api-Version: 2022-11-28",
                      "-H", "User-Agent: oxide-batch-pr270-evidence-promotion",
                      api_root + path,
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
          '''
          if old not in script:
              raise SystemExit('expected api_bytes implementation not found')
          script = script.replace(old, new, 1)
          exec(compile(script, 'pr270-evidence-promotion.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Verify promoted retained evidence locally
        shell: bash
        run: |
          set -euo pipefail
          cargo run --package oxide-batch-xtask --bin retained_evidence_policy
          cargo run --package oxide-batch-xtask -- evidence

      - name: Commit promoted evidence and retire original bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr270-evidence-promotion.yml
          git add docs/engineering/campaigns/m5 docs/engineering/campaigns/m6 .github/workflows/pr270-evidence-promotion.yml

          changed="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$changed" | grep -c '^docs/engineering/campaigns/')" -eq 23
          test "$(printf '%s\n' "$changed" | grep -c '^\.github/workflows/pr270-evidence-promotion\.yml$')" -eq 1
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 24

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(evidence): promote PR #270 gate artifacts"
          git push origin HEAD:refs/heads/issue-265-nested-job-durable-linkage
