name: PR 271 custom-leaf runtime bootstrap v2

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

jobs:
  inspect-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and print failing fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, re, subprocess, zlib
          historical = subprocess.check_output([
              'git','show','143c3d09b3c69097a43cf5e008c1ace359bc89d2:.github/workflows/pr271-runtime-bootstrap.yml'
          ], text=True)
          match = re.search(r"base64\.b64decode\('([^']+)'\)", historical)
          exec(zlib.decompress(base64.b64decode(match.group(1))), {})
          PY
          sed -n '/committed_custom_state_is_reused_on_restart_and_completed_leaf_is_not_reinvoked/,/^}/p' crates/oxide-batch/tests/custom_leaf_runtime.rs
