name: PR 271 custom-leaf runtime bootstrap v2

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

concurrency:
  group: pr271-runtime-bootstrap-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Patch runtime and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          import subprocess
          import zlib
          from pathlib import Path

          historical = subprocess.check_output([
              "git", "show",
              "143c3d09b3c69097a43cf5e008c1ace359bc89d2:.github/workflows/pr271-runtime-bootstrap.yml",
          ], text=True)
          match = re.search(r"base64\.b64decode\('([^']+)'\)", historical)
          if match is None:
              raise SystemExit("runtime bootstrap payload not found")
          exec(zlib.decompress(base64.b64decode(match.group(1))), {})

          test = Path("crates/oxide-batch/tests/custom_leaf_runtime.rs")
          text = test.read_text()
          old = 'context("example.state", 2, 1).map_err(TaskletError::from_error)?'
          if text.count(old) != 1:
              raise SystemExit(f"expected one wrong-state fixture, found {text.count(old)}")
          test.write_text(text.replace(
              old,
              'context("example.state", 2, 1).expect("valid wrong-state fixture")',
              1,
          ))
          PY
          cargo fmt --all
          git diff --check
          cargo check --workspace --all-targets --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_binding --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_runtime --all-features --locked

      - name: Commit candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/pr271-runtime-bootstrap-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(flow): execute registered custom leaves"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
