name: PR132 evidence refresh v2

on:
  push:
    branches:
      - fix/pr132-evidence-refresh

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .refresh
          gh run download 31981456640 -n soak-campaign-postgres-15 -D .refresh/soak15
          gh run download 31981456640 -n soak-campaign-postgres-18 -D .refresh/soak18
          gh run download 31981456476 -n cancellation-campaign-postgres-15 -D .refresh/cancel15
          gh run download 31981456476 -n cancellation-campaign-postgres-18 -D .refresh/cancel18
          gh run download 31981456588 -n performance-campaign-postgres-15 -D .refresh/perf15
          gh run download 31981456588 -n performance-campaign-postgres-18 -D .refresh/perf18
          gh run download 31981456650 -n conformance-campaign-postgres-15 -D .refresh/conf15
          gh run download 31981456650 -n conformance-campaign-postgres-18 -D .refresh/conf18
          gh run download 31981456522 -n crash-restore-campaign-postgres-15 -D .refresh/crash15
          gh run download 31981456522 -n crash-restore-campaign-postgres-18 -D .refresh/crash18
          gh run download 31981456510 -n upgrade-campaign-postgres-15 -D .refresh/upgrade15
          gh run download 31981456510 -n upgrade-campaign-postgres-18 -D .refresh/upgrade18
          gh run download 31981456639 -n security-campaign-postgres-15 -D .refresh/security15
          gh run download 31981456639 -n security-campaign-postgres-18 -D .refresh/security18

      - name: Retain exact bytes and update provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess

          root = pathlib.Path.cwd()
          retained = root / 'docs/engineering/campaigns/m5'
          execution = '977528e1a85332ddc807843c22ffc4592886a049'
          branch_head = '9fc6a3006ef95fc2d50e76799e4060fb8a0f5e87'
          verified_at = '2026-08-17T21:43:00Z'

          items = [
            ('soak15','soak-campaign.json','soak-campaign-postgres-15.json','M5 Soak','.github/workflows/m5-soak.yml',31981456640,95248844977,'postgres-15-soak-campaign',9272534835,'soak-campaign-postgres-15','sha256:acffc7700242dd330b95f85e0198594cc2b361f19f43b5a0510aff55a3366f2b',88193,'15','2b1220eeb5753964b76e98a84f1e3788f363b107'),
            ('soak18','soak-campaign.json','soak-campaign-postgres-18.json','M5 Soak','.github/workflows/m5-soak.yml',31981456640,95248845086,'postgres-18-soak-campaign',9272533614,'soak-campaign-postgres-18','sha256:4637d2862e05ae5681ad550bb32bd33659f744bd419f3693e2bfe3cfdd8dd531',88351,'18','8d7624a595f6f1d1e2aa9414a74cf6ce8dcd0e56'),
            ('cancel15','cancellation-campaign.json','cancellation-campaign-postgres-15.json','M5 Cancellation','.github/workflows/m5-cancellation.yml',31981456476,95248843969,'postgres-15-cancellation-campaign',9272484017,'cancellation-campaign-postgres-15','sha256:0253c3c7230c76cec05c6e8ebc8ae24b8124263f9570d09664f3ca4491fb49ba',5754,'15','67952d157006a6f5bf2f63942502d7f471877aa2'),
            ('cancel18','cancellation-campaign.json','cancellation-campaign-postgres-18.json','M5 Cancellation','.github/workflows/m5-cancellation.yml',31981456476,95248844049,'postgres-18-cancellation-campaign',9272484122,'cancellation-campaign-postgres-18','sha256:a0ab11920f6a461418f62ff9a57817c5ada68be70ff9a3aa5ab7fadef3852b15',5758,'18','b5f46cc28eeb021a29d31183561f7c87e2c190bf'),
            ('perf15','performance-campaign.json','performance-campaign-postgres-15.json','M5 Performance','.github/workflows/m5-performance.yml',31981456588,95248844607,'postgres-15-performance-campaign',9272507072,'performance-campaign-postgres-15','sha256:6ee0c1abe450493e1c6e1ef1fbc9a030ff71502eb61a31667ffe091bcccc31ee',6462,'15','8952793552dcd1d0fdc1ef6ec1323ed476e90e3e'),
            ('perf18','performance-campaign.json','performance-campaign-postgres-18.json','M5 Performance','.github/workflows/m5-performance.yml',31981456588,95248844587,'postgres-18-performance-campaign',9272508826,'performance-campaign-postgres-18','sha256:ad9420409db6bda80be583ee84f6edae7c18518d0e8525b9bb22bc6b0516a055',6467,'18','d6bf7f2711ed18626a556ee86d18f492f2352f2c'),
            ('conf15','conformance-campaign.json','conformance-campaign-postgres-15.json','M5 Conformance','.github/workflows/m5-conformance.yml',31981456650,95248844685,'postgres-15-conformance-campaign',9272499396,'conformance-campaign-postgres-15','sha256:86d5e1e5577f0bf2de80120356c0bc04aa62ee49f643496ad04ae3d4283f0a76',7135,'15','a212a8fc237d3e9c5aec438eaac84a7299a7106e'),
            ('conf18','conformance-campaign.json','conformance-campaign-postgres-18.json','M5 Conformance','.github/workflows/m5-conformance.yml',31981456650,95248844762,'postgres-18-conformance-campaign',9272502643,'conformance-campaign-postgres-18','sha256:33c35d64da8f3a7a674374245ac743932446a03720798fc635daa4b22b0c0592',7135,'18','1aad3351956be115a6c61aca1f0d4df05208e8d4'),
            ('crash15','crash-restore-campaign.json','crash-restore-campaign-postgres-15.json','M5 Crash and Restore','.github/workflows/m5-crash-restore.yml',31981456522,95248844445,'postgres-15-crash-restore-campaign',9272481597,'crash-restore-campaign-postgres-15','sha256:074272ffd98595084d5e4b6c36f1de7fb76dd1cc88f410647394d816327c27b0',6691,'15','a3646fd5ed1eb1fe14a64a9bb08857b7bfca1ae0'),
            ('crash18','crash-restore-campaign.json','crash-restore-campaign-postgres-18.json','M5 Crash and Restore','.github/workflows/m5-crash-restore.yml',31981456522,95248844387,'postgres-18-crash-restore-campaign',9272481817,'crash-restore-campaign-postgres-18','sha256:3f77513b46b36eecb3072c4bdabe571d835ae2d38dc1355e23c4a9ef7bc8e5d8',6698,'18','3f787743fbeafb1d4b3af4604b14b901a2773f25'),
            ('upgrade15','upgrade-campaign.json','upgrade-campaign-postgres-15.json','M5 Upgrade','.github/workflows/m5-upgrade.yml',31981456510,95248844228,'postgres-15-upgrade-campaign',9272486260,'upgrade-campaign-postgres-15','sha256:087caa2934295fd3420f4dfd9346fa4279c4849cafb2bc97a56961192dd33917',5170,'15','200ab096db842f7b46fda9509dd4ab6fd667e268'),
            ('upgrade18','upgrade-campaign.json','upgrade-campaign-postgres-18.json','M5 Upgrade','.github/workflows/m5-upgrade.yml',31981456510,95248844299,'postgres-18-upgrade-campaign',9272485512,'upgrade-campaign-postgres-18','sha256:7ac77c44d59b5a5c923761eb26e4218e1b87e99917fc009843c6f4024fec6efc',5168,'18','6556e46f66f2257b26d7ba60675f7ff8cdcd2a5f'),
            ('security15','security-campaign.json','security-campaign-postgres-15.json','M5 Security','.github/workflows/m5-security.yml',31981456639,95248844787,'postgres-15-security-campaign',9272478665,'security-campaign-postgres-15','sha256:e750400ccf994440112351c2498ec901617c4cd789835f1a596ec91efa9a5381',6949,'15','ff521cab68c02d03a5b3f83a1cd8c96f8ce71cc2'),
            ('security18','security-campaign.json','security-campaign-postgres-18.json','M5 Security','.github/workflows/m5-security.yml',31981456639,95248844775,'postgres-18-security-campaign',9272480308,'security-campaign-postgres-18','sha256:b620de94f443a514794530f26b0f050897834d035ed4ce103be4f2dd7029e0ab',6949,'18','72a1cfea800c166988f9d4022dc3b779be01ab66'),
          ]

          prov_path = retained / 'evidence-provenance.json'
          prov = json.loads(prov_path.read_text())
          entries = {e['report']: e for e in prov['evidence']}

          for folder,src_name,target_name,wf,wffile,run,jobid,jobname,aid,aname,digest,size,pg,expected_blob in items:
            src = root / '.refresh' / folder / src_name
            body = src.read_bytes()
            blob = subprocess.check_output(['git','hash-object',str(src)], text=True).strip()
            if blob != expected_blob:
              raise SystemExit(f'{target_name}: downloaded blob {blob} != independently verified {expected_blob}')
            doc = json.loads(body)
            if doc.get('passed') is not True or doc.get('violations') != []:
              raise SystemExit(f'{target_name}: report is not a clean pass')
            if doc['environment']['source_commit'] != execution or doc['environment']['source_tree_clean'] is not True:
              raise SystemExit(f'{target_name}: wrong execution tree')
            if doc['environment']['matrix'] != f'postgres-{pg}' or str(doc.get('postgresql_major_version')) != pg:
              raise SystemExit(f'{target_name}: wrong matrix identity')

            target = retained / target_name
            target.write_bytes(body)
            entry = entries[target_name]
            entry['producer']['execution_commit'] = execution
            entry['producer']['branch_head_sha'] = branch_head
            entry['producer']['source_tree_clean'] = True
            entry['workflow_run'].update({'workflow':wf,'workflow_file':wffile,'id':run,'attempt':1,'event':'pull_request','conclusion':'success'})
            entry['producing_job'].update({'name':jobname,'id':jobid,'conclusion':'success'})
            entry['artifact'].update({'name':aname,'id':aid,'digest':digest,'size_bytes':size})
            entry['retained_report_git_blob'] = expected_blob
            entry['remote_verification'] = {
              'verified': True,
              'verified_at': verified_at,
              'run_id': run,
              'workflow_run_identity': True,
              'workflow_run_conclusion': True,
              'producing_job_identity': True,
              'producing_job_conclusion': True,
              'artifact_digest': True,
              'artifact_bytes_match_retained_report': True,
              'execution_commit_matches_report': True,
              'note': 'Fresh retention after Cargo.lock changed a declared campaign-semantics object. The workflow run, producing job, artifact ID/digest, downloaded ZIP bytes, extracted report bytes, and execution tree were independently verified before this retention.'
            }
            if isinstance(doc.get('postgresql_version'), str):
              entry['server_version'] = doc['postgresql_version']

          prov_path.write_text(json.dumps(prov, indent=2, ensure_ascii=False) + '\n')
          PY

          cargo run --package oxide-batch-xtask -- evidence

      - name: Commit self-cleaned evidence refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr132-evidence-refresh.yml
          rm .github/workflows/pr132-evidence-refresh-v2.yml
          git add docs/engineering/campaigns/m5 .github/workflows/pr132-evidence-refresh.yml .github/workflows/pr132-evidence-refresh-v2.yml
          git commit -m "docs(m5): refresh evidence for dependency lockfile update"
          git push origin HEAD:fix/pr132-evidence-refresh
