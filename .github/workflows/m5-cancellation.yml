name: M5 Cancellation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-cancellation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancellation-campaign:
    name: postgres-${{ matrix.postgres }}-cancellation-campaign
    runs-on: ubuntu-24.04
    # The floor is set by the declared deadline set rather than by the
    # workload: the accepted default deadline of 30 s has to be waited out
    # once, and the other two points add six seconds, so roughly forty seconds
    # of every run is deliberate waiting. Twenty minutes leaves room for the
    # build and the four reports and is still a ceiling.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        # matrix.postgres is a checked-in 15/18 allowlist. The matching official
        # multi-arch image digests are immutable; an unsupported value resolves
        # to a deliberately invalid digest and fails before campaign execution.
        image: postgres:${{ matrix.postgres }}@sha256:${{ matrix.postgres == '15' && '926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561' || matrix.postgres == '18' && '4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280' || 'unsupported' }} # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_cancellation
        ports:
          - 5432:5432
        # Each report holds one pool of 5 connections, the derived requirement
        # for a worker budget of 4, and the reports run one at a time. The
        # image's default of 100 is ample; raising it would let a connection a
        # cancelled attempt failed to return be absorbed rather than exhaust
        # the pool, which is one of the leaked-work outcomes P-014 is about.
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_cancellation"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_cancellation
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_cancellation
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed if the execution contract drifts
        run: ./tests/fixtures/cancellation/verify-ci-contract.sh .github/workflows/m5-cancellation.yml

      - name: Measure P-014 stop, cancel, and drain
        # matrix.postgres comes only from the checked-in 15/18 matrix above.
        run: ./tests/fixtures/cancellation/run-ci-campaign.sh ${{ matrix.postgres }} # zizmor: ignore[template-injection]

      # Retained on failure as well as on success. A failed cancellation
      # campaign is mostly worth reading for its latency and unjoined-count
      # detail, and a job that uploaded only green reports would discard
      # exactly that.
      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cancellation-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/cancellation-campaign.json
          if-no-files-found: error
