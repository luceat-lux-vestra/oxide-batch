name: M5 Soak

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak-campaign:
    name: postgres-${{ matrix.postgres }}-soak-campaign
    runs-on: ubuntu-24.04
    # The declared window is 32 warmup and 600 measured cycles, each a launch,
    # a fault, a restart, and a drain. That is minutes rather than seconds, so
    # the ceiling is higher than the other campaigns' — and it is still a
    # ceiling, because a soak that stopped making progress must fail rather
    # than occupy a runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        # matrix.postgres is a checked-in 15/18 allowlist. The matching official
        # multi-arch image digests are immutable; an unsupported value resolves
        # to a deliberately invalid digest and fails before campaign execution.
        image: postgres:${{ matrix.postgres }}@sha256:${{ matrix.postgres == '15' && '926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561' || matrix.postgres == '18' && '4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280' || 'unsupported' }} # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_soak
        ports:
          - 5432:5432
        # The campaign holds one pool of 5 connections for its whole run, which
        # is the derived requirement for a worker budget of 4. The image's
        # default of 100 is ample; raising it would let a checkout leak be
        # absorbed instead of exhausting the pool.
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_soak"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_soak
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_soak
      OXIDEBATCH_CAMPAIGN_DIR: target/m5-campaigns
      OXIDEBATCH_CAMPAIGN_MATRIX: postgres-${{ matrix.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed if the execution contract drifts
        run: ./tests/fixtures/soak/verify-ci-contract.sh .github/workflows/m5-soak.yml

      - name: Run the declared P-015 soak window and judge its growth
        # matrix.postgres comes only from the checked-in 15/18 matrix above.
        run: ./tests/fixtures/soak/run-ci-campaign.sh ${{ matrix.postgres }} # zizmor: ignore[template-injection]

      # Retained on failure as well as on success. What a failed soak needs is
      # the resource trajectory that led to it, and a job that uploaded only
      # green reports would discard exactly the evidence worth reading.
      - name: Retain the campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-campaign-postgres-${{ matrix.postgres }}
          path: target/m5-campaigns/soak-campaign.json
          if-no-files-found: error
