name: PR271 evidence promotion

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle
    paths:
      - .github/workflows/pr271-evidence-promotion.yml

concurrency:
  group: pr271-evidence-promotion
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-24.04
    if: github.repository == 'luceat-lux-vestra/oxide-batch'
    permissions:
      actions: read # Verify exact producer run/job/artifact metadata.
      contents: write # Push one verified evidence-only promotion commit.
    steps:
      - name: Check out exact bootstrap commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git fetch --no-tags --prune --depth=2 origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git checkout --detach "refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "bc9ff480ec5d78ad42bcb2a09b13a250aa4c5bda"

      - name: Re-verify and promote fresh producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime
          import hashlib
          import io
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path

          producer_head = "bc9ff480ec5d78ad42bcb2a09b13a250aa4c5bda"
          expected_execution_commit = "e77fba33f9e9aba2c23199d8673441f53e3ff85b"
          run_ids = {
              "M5 Cancellation": 34923699265,
              "M5 Conformance": 34923698985,
              "M5 Crash and Restore": 34923699182,
              "M5 Performance": 34923699202,
              "M5 Resource Bounds": 34923699086,
              "M5 Security": 34923699112,
              "M5 Soak": 34923699193,
              "M5 Upgrade": 34923699073,
              "M6 Gate B Transaction/Restart Equivalence": 34923699018,
              "M6 Gate H P-002 Performance": 34923698962,
              "M6 Full Component Conformance": 34923699109,
          }

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repo}"

          def request(path):
              return urllib.request.Request(
                  api_root + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "oxide-batch-pr271-evidence-promotion",
                  },
              )

          def api_json(path):
              with urllib.request.urlopen(request(path)) as response:
                  return json.load(response)

          def git_blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          provenance = {}
          entries = []
          for milestone in ("m5", "m6"):
              path = Path(f"docs/engineering/campaigns/{milestone}/evidence-provenance.json")
              document = json.loads(path.read_text())
              provenance[milestone] = (path, document)
              for entry in document["evidence"]:
                  entries.append((milestone, entry))

          if len(entries) != 21:
              raise SystemExit(f"expected 21 retained evidence entries, found {len(entries)}")
          if set(run_ids) != {entry["workflow_run"]["workflow"] for _, entry in entries}:
              raise SystemExit("producer workflow inventory differs from retained provenance")

          verified_at = (
              datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )

          for milestone, entry in entries:
              workflow = entry["workflow_run"]["workflow"]
              run_id = run_ids[workflow]
              run = api_json(f"/actions/runs/{run_id}")
              assert run["id"] == run_id
              assert run["name"] == workflow
              assert run["path"] == entry["workflow_run"]["workflow_file"]
              assert run["event"] == "pull_request"
              assert run["conclusion"] == "success"
              assert run["run_attempt"] == 1
              assert run["head_sha"] == producer_head

              jobs = api_json(f"/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
              matches = [job for job in jobs if job["name"] == entry["producing_job"]["name"]]
              assert len(matches) == 1, (workflow, entry["producing_job"]["name"], len(matches))
              job = matches[0]
              assert job["status"] == "completed"
              assert job["conclusion"] == "success"

              artifacts = api_json(f"/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
              matches = [artifact for artifact in artifacts if artifact["name"] == entry["artifact"]["name"]]
              assert len(matches) == 1, (workflow, entry["artifact"]["name"], len(matches))
              artifact = matches[0]
              assert not artifact["expired"]
              assert artifact["workflow_run"]["id"] == run_id
              assert artifact["workflow_run"]["head_sha"] == producer_head
              assert artifact["digest"].startswith("sha256:")

              with tempfile.NamedTemporaryFile(suffix=".zip") as archive_file:
                  subprocess.run(
                      [
                          "curl", "-fsSL", "--retry", "3",
                          "-H", f"Authorization: Bearer {token}",
                          "-H", "Accept: application/vnd.github+json",
                          "-H", "X-GitHub-Api-Version: 2022-11-28",
                          f"{api_root}/actions/artifacts/{artifact['id']}/zip",
                          "-o", archive_file.name,
                      ],
                      check=True,
                  )
                  archive = Path(archive_file.name).read_bytes()

              observed_digest = "sha256:" + hashlib.sha256(archive).hexdigest()
              assert observed_digest == artifact["digest"]
              assert len(archive) == artifact["size_in_bytes"]

              expected_inner = re.sub(r"-postgres-(?:15|18)(?=\.json$)", "", entry["report"])
              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  names = [name for name in zipped.namelist() if not name.endswith("/")]
                  assert names == [expected_inner], (entry["report"], names, expected_inner)
                  report_bytes = zipped.read(expected_inner)

              report = json.loads(report_bytes)
              env = report["environment"]
              assert env["source_commit"] == expected_execution_commit
              assert report["observation"]["execution_manifest"]["execution_commit"] == expected_execution_commit
              assert env["source_tree_clean"] is True
              assert env["matrix"] == entry["matrix_point"]
              assert str(report["postgresql_major_version"]) == entry["postgres_major_version"]
              assert report["passed"] is True
              assert report["violations"] == []

              destination = Path("docs/engineering/campaigns") / milestone / entry["report"]
              destination.write_bytes(report_bytes)

              producer = entry["producer"]
              producer["execution_commit"] = expected_execution_commit
              producer["execution_commit_note"] = (
                  "Exact PR #271 synthetic merge execution tree recorded by the successful producer report; "
                  "object-manifest identities are the authority for later local verification."
              )
              producer["branch_head_sha"] = producer_head
              producer["branch_head_note"] = (
                  "Exact PR #271 source candidate that triggered the successful producer run; "
                  "recorded separately from the ephemeral execution tree."
              )
              producer["source_tree_clean"] = True
              producer["rustc"] = env["rustc"]
              producer["os"] = env["os"]
              producer["arch"] = env["arch"]

              entry["workflow_run"].update({
                  "id": run_id,
                  "attempt": run["run_attempt"],
                  "event": run["event"],
                  "conclusion": run["conclusion"],
              })
              entry["producing_job"].update({
                  "id": job["id"],
                  "conclusion": job["conclusion"],
              })
              entry["artifact"].update({
                  "id": artifact["id"],
                  "digest": artifact["digest"],
                  "size_bytes": artifact["size_in_bytes"],
              })
              entry["retained_report_git_blob"] = git_blob(report_bytes)
              entry["remote_verification"] = {
                  "verified": True,
                  "verified_at": verified_at,
                  "run_id": run_id,
                  "workflow_run_identity": True,
                  "workflow_run_conclusion": True,
                  "producing_job_identity": True,
                  "producing_job_conclusion": True,
                  "artifact_digest": True,
                  "artifact_bytes_match_retained_report": True,
                  "execution_commit_matches_report": True,
                  "note": (
                      "PR #271 successful Actions artifact independently fetched through the GitHub API; "
                      "run/job identity and success, archive SHA-256, exact report bytes, canonical report identity, "
                      "runtime axis when declared, and execution commit were verified before retention."
                  ),
              }

          for path, document in provenance.values():
              path.write_text(json.dumps(document, indent=2, ensure_ascii=False) + "\n")

          print(f"promoted {len(entries)} reports from source candidate {producer_head}")
          PY

      - name: Verify promoted retained evidence locally
        shell: bash
        run: |
          set -euo pipefail
          cargo run --package oxide-batch-xtask --bin retained_evidence_policy
          cargo run --package oxide-batch-xtask -- evidence

      - name: Commit evidence-only promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr271-evidence-promotion.yml
          git add docs/engineering/campaigns/m5 docs/engineering/campaigns/m6 .github/workflows/pr271-evidence-promotion.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$changed" | grep -c '^docs/engineering/campaigns/')" -eq 23
          test "$(printf '%s\n' "$changed" | grep -c '^\.github/workflows/pr271-evidence-promotion\.yml$')" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(evidence): promote PR #271 gate artifacts"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
