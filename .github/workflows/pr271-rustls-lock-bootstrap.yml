name: PR 271 final candidate cleanup

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

concurrency:
  group: pr271-final-candidate-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply cleanup
        run: python3 .github/scripts/pr271-final-review-fix.py

      - name: Verify candidate
        run: |
          cargo fmt --all -- --check
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::too_many_lines
          cargo test -p oxide-batch --test facade_review --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_binding --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_runtime --all-features --locked
          cargo test -p oxide-batch --features postgres --test postgres_custom_leaf_crash_recovery --no-run --locked
          cargo run --package oxide-batch-xtask -- surface

      - name: Commit cleaned candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/scripts/pr271-final-review-fix.py
          rm .github/workflows/pr271-rustls-lock-bootstrap.yml
          git diff --quiet 552a4575212f0ab0bc43072ddb7152e606e7bfe1 -- Cargo.lock
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(flow): finalize custom-leaf review surface"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
