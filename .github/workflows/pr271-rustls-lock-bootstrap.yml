name: PR 271 final review bootstrap

on:
  push:
    branches:
      - issue-266-custom-leaf-lifecycle

permissions: {}

concurrency:
  group: pr271-final-review-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Required only to push the reviewed candidate commit below.
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply final review fixes and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/oxide-batch/tests/postgres_custom_leaf_crash_recovery.rs')
          text = source.read_text()
          replacements = [
              ('FlowExecutionOutcome, FlowGraph,', 'FlowExecutionOutcome, FlowFailure, FlowGraph,'),
              ('FlowLauncher, FlowNode, FlowTarget,', 'FlowLauncher, FlowNode, FlowRuntimeError, FlowTarget,'),
              ('RecoveryRequest, SequentialIdGenerator,', 'RecoveryRequest, RepositoryError, SequentialIdGenerator,'),
          ]
          for old, new in replacements:
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'postgres custom-leaf import token not found: {old}')
                  text = text.replace(old, new, 1)
          source.write_text(text)

          script = Path('.github/scripts/pr271-final-review-fix.py')
          patch = script.read_text()
          old_guard = 'elif new_import not in text:\n    raise SystemExit("postgres custom-leaf import anchor not found")\n'
          new_guard = 'elif new_import not in text:\n    pass\n'
          if old_guard not in patch and new_guard not in patch:
              raise SystemExit('review-fix import guard not found')
          if old_guard in patch:
              script.write_text(patch.replace(old_guard, new_guard, 1))
          PY
          python3 .github/scripts/pr271-final-review-fix.py
          python3 - <<'PY'
          import re
          from pathlib import Path

          flow = Path('crates/oxide-batch/src/flow.rs')
          text = flow.read_text()
          pattern = re.compile(
              r'        if !matches!\(outcome, TaskletExecutionOutcome::Unknown\) \{\n'
              r'            if let Some\(state\) = candidate_state\.as_ref\(\) \{\n'
              r'(?P<body>.*?)'
              r'            \}\n'
              r'        \}\n\n'
              r'        let mut failures',
              re.S,
          )
          match = pattern.search(text)
          if match is not None:
              replacement = (
                  '        if !matches!(outcome, TaskletExecutionOutcome::Unknown)\n'
                  '            && let Some(state) = candidate_state.as_ref()\n'
                  '        {\n'
                  + match.group('body')
                  + '        }\n\n'
                  + '        let mut failures'
              )
              flow.write_text(text[:match.start()] + replacement + text[match.end():])
          elif '&& let Some(state) = candidate_state.as_ref()' not in text:
              raise SystemExit('UNKNOWN state guard regex not found')

          runtime = Path('crates/oxide-batch/tests/custom_leaf_runtime.rs')
          text = runtime.read_text()
          old = '''    let mut launch = Box::pin(
              FlowLauncher::new(&repository, clock.as_ref(), ids.as_ref()).launch(
                  &job,
                  &JobParameters::new(),
                  &stop,
              ),
          );
          '''.replace('              ', '    ')
          new = '''    let launcher = FlowLauncher::new(&repository, clock.as_ref(), ids.as_ref());
          let parameters = JobParameters::new();
          let mut launch = Box::pin(launcher.launch(&job, &parameters, &stop));
          '''.replace('          ', '')
          if old not in text and 'let launcher = FlowLauncher::new(&repository' not in text:
              raise SystemExit('ownership test lifetime anchor not found')
          if old in text:
              runtime.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::too_many_lines
          cargo check --workspace --all-targets --all-features --locked
          cargo test -p oxide-batch-plan --test custom_leaf --locked
          cargo test -p oxide-batch --test custom_leaf_binding --all-features --locked
          cargo test -p oxide-batch --test custom_leaf_runtime --all-features --locked
          cargo test -p oxide-batch --features postgres \
            --test postgres_custom_leaf_crash_recovery --no-run --locked
          cargo run --package oxide-batch-xtask -- surface

      - name: Commit final candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/scripts/pr271-final-review-fix.py
          rm .github/workflows/pr271-rustls-lock-bootstrap.yml
          git add -A
          git diff --cached --check
          test -z "$(git status --short | grep 'pr271-final-review-fix.py\|pr271-rustls-lock-bootstrap.yml' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(flow): close custom-leaf review gaps"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
