name: M7 Fork PostgreSQL Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-fork-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-postgres:
    name: fork-postgres-${{ matrix.postgres }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "15"
            image: "postgres:15@sha256:926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561"
          - postgres: "18"
            image: "postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxide_batch_campaign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname oxide_batch_campaign"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      OXIDEBATCH_POSTGRES_ADMIN_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_campaign
      OXIDEBATCH_POSTGRES_MIGRATOR_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_campaign
      OXIDEBATCH_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/oxide_batch_campaign
    steps:
      - name: Check out PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify transformed fork on PostgreSQL ${{ matrix.postgres }}
        run: cargo test --locked --package oxide-batch --features postgres --test postgres_fork -- --nocapture --test-threads=1
      - name: Verify populated schema 10 to 11 migration and dump restore on PostgreSQL ${{ matrix.postgres }}
        run: bash ./tests/fixtures/postgres/run-design-gate.sh "${{ matrix.postgres }}"
