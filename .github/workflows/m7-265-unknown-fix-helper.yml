name: M7 265 unknown child contract helper

on:
  push:
    branches:
      - issue-265-nested-job-durable-linkage

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-265-nested-job-durable-linkage
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify unknown-child contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/m7-265-unknown-fix.py
          cargo fmt --all
          cargo test -p oxide-batch --test repository nested_job -- --nocapture
          cargo clippy -p oxide-batch-repository --all-targets --all-features -- -D warnings
          cargo clippy -p oxide-batch --test repository -- -D warnings

      - name: Promote correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/m7-265-unknown-fix.py .github/workflows/m7-265-unknown-fix-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(repository): keep unknown nested child unresolved"
          git push origin HEAD:issue-265-nested-job-durable-linkage
