# Oxide Batch automatic PR area classification.
# Area labels are derived from the current workspace topology and synchronized on each PR update.

changed-files-labels-limit: 30
max-files-changed: 1000

area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "deny.toml"
          - "rust-toolchain.toml"
          - "rustfmt.toml"
          - "xtask/**"

area:core:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/oxide-batch-core/**"
          - "crates/oxide-batch/**"

area:runtime:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/oxide-batch-plan/**"
          - "crates/oxide-batch/src/chunk*.rs"
          - "crates/oxide-batch/src/*runtime*.rs"
          - "crates/oxide-batch/src/*listener*.rs"

area:repository:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/oxide-batch-repository/**"
          - "docs/architecture/*repository*"
          - "docs/operations/*persistence*"
          - "docs/operations/*migration*"

area:postgres:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/oxide-batch-repository/**/*postgres*"
          - "crates/oxide-batch-repository/**/migrations/**"
          - "tests/fixtures/postgres/**"
          - "docs/**/*postgres*"
          - "docs/operations/migrations/**"

area:cli:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/oxide-batch-cli/**"

area:observability:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/**/*observ*"
          - "crates/**/*telemetry*"
          - "crates/**/*diagnostic*"
          - "docs/operations/*observ*"
          - "docs/operations/*telemetry*"

# Test ownership is for the reusable test kit / shared fixtures, not every
# implementation PR that happens to include regression tests.
area:test:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/oxide-batch-test/**"
          - "tests/fixtures/**"
          - "tests/support/**"

area:compatibility:
  - changed-files:
      - any-glob-to-any-file:
          - "**/tests/**/*conformance*"
          - "docs/compatibility/**"
          - "docs/engineering/campaigns/**/*conformance*"

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

# Governance is policy/decision/release-process ownership. Implementation
# evidence under docs/project is intentionally excluded to avoid noisy labels.
area:governance:
  - changed-files:
      - any-glob-to-any-file:
          - "AGENTS.md"
          - "CODE_OF_CONDUCT.md"
          - "CONTRIBUTING.md"
          - "GOVERNANCE.md"
          - "SECURITY.md"
          - "SUPPORT.md"
          - "docs/governance/**"
          - "docs/release/**"
          - "docs/rfcs/**"
          - "docs/architecture/decisions/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.toml"
          - "Cargo.lock"
          - "deny.toml"
