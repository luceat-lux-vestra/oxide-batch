[package]
name = "oxide-batch-m0-spikes"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util = "0.3.31"
oxide-batch = { version = "=0.6.0", path = "../../crates/oxide-batch", features = ["postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints]
workspace = true
