[graph]
all-features = true

[advisories]
ignore = [
    # SQLx 0.9.0 requires libsqlite3-sys <0.38.0. OxideBatch enables only
    # sqlx/sqlite-unbundled, so RUSTSEC-2026-0459's bundled vulnerable SQLite
    # copy is not linked. System SQLite patching remains a deployment/security
    # responsibility. Keep the facade feature guard in sqlite_repository_core.
    "RUSTSEC-2026-0459",
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
