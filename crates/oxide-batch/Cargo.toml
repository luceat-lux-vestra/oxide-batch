[package]
name = "oxide-batch"
description = "Early-alpha restartable batch processing for Rust, inspired by Spring Batch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["batch", "job", "workflow", "processing", "restartable"]
categories = ["asynchronous", "database"]
publish = ["crates-io"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
postgres = ["dep:sqlx"]

[dependencies]
futures-util = "0.3.31"
oxide-batch-core = { path = "../oxide-batch-core", version = "=0.1.0-alpha.2" }
oxide-batch-plan = { path = "../oxide-batch-plan", version = "=0.1.0-alpha.2" }
oxide-batch-repository = { path = "../oxide-batch-repository", version = "=0.1.0-alpha.2" }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, optional = true, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
futures-executor = "0.3.31"
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
trybuild = "1.0.118"

[[example]]
name = "postgres_local_partition"
required-features = ["postgres"]
