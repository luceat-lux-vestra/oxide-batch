[package]
name = "oxide-batch"
description = "Rust-native framework for reliable, restartable batch processing, inspired by Spring Batch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
exclude = ["tests/**"]
keywords = ["batch", "job", "workflow", "processing", "restartable"]
categories = ["asynchronous", "database"]
publish = ["crates-io"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
mongodb = ["dep:mongodb"]
mysql = ["dep:sqlx", "sqlx/mysql"]
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite-unbundled"]
sqlserver = ["dep:bb8", "dep:tiberius", "dep:tokio-util", "tokio/net"]

[dependencies]
bb8 = { version = "0.9.1", default-features = false, optional = true }
csv = "1.4.0"
csv-core = "0.1.13"
futures-util = "0.3.31"
# BSON 3 avoids BSON 2.x enabling serde_json/preserve_order globally, which would
# change OxideBatch canonical manifest ordering and durable identity digests.
mongodb = { version = "3.10.1", default-features = false, optional = true, features = ["compat-3-3-0", "bson-3", "rustls-tls"] }
oxide-batch-core = { path = "../oxide-batch-core", version = "=0.6.0" }
oxide-batch-plan = { path = "../oxide-batch-plan", version = "=0.6.0" }
oxide-batch-repository = { path = "../oxide-batch-repository", version = "=0.6.0" }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, optional = true, features = [
    "json",
    "macros",
    "migrate",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
] }
tiberius = { version = "0.13.0", default-features = false, optional = true, features = ["rustls", "tds80"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }

[dev-dependencies]
futures-executor = "0.3.31"
stats_alloc = "0.1.10"
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
trybuild = "1.0.118"

[[example]]
name = "postgres_local_partition"
required-features = ["postgres"]
