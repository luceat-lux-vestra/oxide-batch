[workspace]
members = [
    "crates/oxide-batch",
    "crates/oxide-batch-core",
    "crates/oxide-batch-repository",
    "crates/oxide-batch-plan",
    "crates/oxide-batch-cli",
    "spikes/m0-architecture",
    "spikes/m6-item-hot-path",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/luceat-lux-vestra/oxide-batch"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
